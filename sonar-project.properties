sonar.projectKey=keyorixhq_keyorix
sonar.organization=keyorixhq

# Exclude generated files and constant-only files from coverage analysis.
# Go const declarations are not executable and always show 0% coverage.
sonar.coverage.exclusions=**/*_gen.go,**/constants.go,**/*.pb.go

# Exclude generated and constant-only files from duplication detection.
sonar.cpd.exclusions=**/*_gen.go,**/*.pb.go,**/constants.go

# gosec v2.26.1 requires "#nosec GXXX" to be the first token in a comment,
# while SonarCloud requires "NOSONAR" to be first — both can't be first in the
# same comment. The suppressions below handle the cases where the two tools'
# requirements are irreconcilable via inline comments.
#
# go:S4830 — InsecureSkipVerify disables certificate chain validation
# go:S5527 — InsecureSkipVerify disables hostname verification
# All four files use InsecureSkipVerify as an explicit operator opt-in,
# guarded by a config flag and a loud WARNING log at startup.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S4830
sonar.issue.ignore.multicriteria.e1.resourceKey=internal/evidencesink/webhook.go
sonar.issue.ignore.multicriteria.e2.ruleKey=go:S5527
sonar.issue.ignore.multicriteria.e2.resourceKey=internal/evidencesink/webhook.go
sonar.issue.ignore.multicriteria.e3.ruleKey=go:S4830
sonar.issue.ignore.multicriteria.e3.resourceKey=internal/notifychan/webhook.go
sonar.issue.ignore.multicriteria.e4.ruleKey=go:S5527
sonar.issue.ignore.multicriteria.e4.resourceKey=internal/notifychan/webhook.go
sonar.issue.ignore.multicriteria.e5.ruleKey=go:S4830
sonar.issue.ignore.multicriteria.e5.resourceKey=internal/audit/siem/forwarder.go
sonar.issue.ignore.multicriteria.e6.ruleKey=go:S5527
sonar.issue.ignore.multicriteria.e6.resourceKey=internal/audit/siem/forwarder.go
sonar.issue.ignore.multicriteria.e7.ruleKey=go:S4830
sonar.issue.ignore.multicriteria.e7.resourceKey=internal/storage/remote/client.go
sonar.issue.ignore.multicriteria.e8.ruleKey=go:S5527
sonar.issue.ignore.multicriteria.e8.resourceKey=internal/storage/remote/client.go
# go:S2092 — Secure cookie flag (threaded from runtime TLS config, not hardcoded)
# go:S3330 — HttpOnly flag (HttpOnly:false is intentional for CSRF double-submit cookie)
sonar.issue.ignore.multicriteria.e9.ruleKey=go:S2092
sonar.issue.ignore.multicriteria.e9.resourceKey=server/middleware/session_cookie.go
sonar.issue.ignore.multicriteria.e10.ruleKey=go:S3330
sonar.issue.ignore.multicriteria.e10.resourceKey=server/middleware/session_cookie.go
# gosecurity:S5146 — open redirect in test handlers that intentionally redirect
# to an http:// or evil-host URL to verify refuseRedirect blocks them.
sonar.issue.ignore.multicriteria.e11.ruleKey=gosecurity:S5146
sonar.issue.ignore.multicriteria.e11.resourceKey=internal/evidencesink/evidencesink_extra_test.go
# go:S2077 — dynamic SQL; all call sites are guarded by assertSafeUsername
sonar.issue.ignore.multicriteria.e12.ruleKey=go:S2077
sonar.issue.ignore.multicriteria.e12.resourceKey=internal/dynamic/mysql.go
