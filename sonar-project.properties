sonar.projectKey=keyorixhq_keyorix-web
sonar.organization=keyorixhq

sonar.sources=src
# Exclude test helpers and test files from source analysis;
# they are picked up separately via coverage.
sonar.exclusions=src/test/**,src/**/__tests__/**,src/**/*.test.ts,src/**/*.test.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
