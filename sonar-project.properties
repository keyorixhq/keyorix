sonar.projectKey=keyorixhq_keyorix
sonar.organization=keyorixhq

# Declare source encoding explicitly so the scanner never falls back to the CI
# runner's system charset (which varies by host) and never emits the
# "There are problems with file encoding" warning.
sonar.sourceEncoding=UTF-8

# Completely exclude files that should never be analyzed by any SonarCloud
# language plugin. This is separate from sonar.coverage.exclusions, which only
# hides files from the coverage panel but still lets language analyzers run.
#
#   *.sql — SQLite/MySQL migration DDL. SonarCloud's PLSQL analyzer picks them
#     up and immediately warns "Data Dictionary not configured", because these
#     files are plain DDL, not Oracle PL/SQL. Excluding them silences that
#     warning without affecting any useful finding.
#
#   server/webui/dist/** — committed web-UI placeholder (index.html) and any
#     locally-present build artefacts. The scanner has no useful rules for
#     minified JS/CSS bundles and reports encoding warnings on binary font files.
sonar.exclusions=**/*.sql,server/webui/dist/**

# Exclude files that cannot or should not count against coverage:
#
#   *_gen.go / constants.go / *.pb.go — generated or constant-only files whose
#     declarations are not executable and always show 0% in any coverage profile.
#
#   *_test.go — Go test files are not themselves instrumented by `go test
#     -coverprofile`; the coverage profile only records production-code hits, so
#     every line in a test file appears as "uncovered" in SonarCloud, creating
#     thousands of spurious 0%-coverage entries in the New-Code panel.
#
#   *.sql — SQL migration files have no executable lines Go can instrument.
#
#   examples/** / demo/** — demo and example code are illustrative; coverage
#     gaps there do not represent production risk.
#
#   operator/** — the Kubernetes operator is a separate Go module with its own
#     CI job; including it here would double-count lines against the wrong
#     coverage baseline.
#
#   internal/testhelper/** — test-helper utilities that live in non-_test.go
#     files so they can be imported across packages; they are test infrastructure,
#     not production code, and are never instrumented by production test runs.
#
#   server/webui/embed.go — contains only `//go:embed` directives and trivial
#     wrappers; the three exported functions are covered by embed_test.go.
#
#   cmd/*/main.go / main.go — CLI/server entry-point wiring; each is a thin
#     `flag.Parse(); run()` shell with no logic worth measuring.
sonar.coverage.exclusions=\
  **/*_gen.go,\
  **/constants.go,\
  **/*.pb.go,\
  **/*_test.go,\
  **/*.sql,\
  examples/**,\
  demo/**,\
  operator/**,\
  internal/testhelper/**,\
  server/webui/embed.go,\
  **/main.go,\
  cmd/*/main.go,\
  internal/core/webauthn.go
#
#   internal/core/webauthn.go — the WebAuthn relying party (c.webauthnRP) is a
#     concrete *webauthn.WebAuthn type. ValidateLogin/ValidatePasskeyLogin require
#     a real FIDO2 ceremony (signed assertion + counter); there is no mockable
#     interface so the call sites that follow those validation calls are structurally
#     unreachable in unit tests. All other paths in the file are covered.

# Exclude generated, constant-only, and test files from duplication detection.
# Go test files (*_test.go) have inherently repetitive structure — table-driven
# test boilerplate, setup/teardown helpers, and assertion blocks repeat by design;
# flagging them as CPD adds noise without actionable findings in test code.
sonar.cpd.exclusions=**/*_gen.go,**/*.pb.go,**/constants.go,**/*_test.go

# gosec v2.26.1 requires "#nosec GXXX" to be the first token in a comment,
# while SonarCloud requires "NOSONAR" to be first — both can't be first in the
# same comment. The suppressions below handle the cases where the two tools'
# requirements are irreconcilable via inline comments.
#
# go:S4830 — InsecureSkipVerify disables certificate chain validation
# go:S5527 — InsecureSkipVerify disables hostname verification
# All four files use InsecureSkipVerify as an explicit operator opt-in,
# guarded by a config flag and a loud WARNING log at startup.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18,e19,e20,e21,e22,e23,e24,e25,e26,e27,e28,e29,e30
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S4830
sonar.issue.ignore.multicriteria.e1.resourceKey=internal/evidencesink/webhook.go
sonar.issue.ignore.multicriteria.e2.ruleKey=go:S5527
sonar.issue.ignore.multicriteria.e2.resourceKey=internal/evidencesink/webhook.go
sonar.issue.ignore.multicriteria.e3.ruleKey=go:S4830
sonar.issue.ignore.multicriteria.e3.resourceKey=internal/notifychan/webhook.go
sonar.issue.ignore.multicriteria.e4.ruleKey=go:S5527
sonar.issue.ignore.multicriteria.e4.resourceKey=internal/notifychan/webhook.go
sonar.issue.ignore.multicriteria.e5.ruleKey=go:S4830
sonar.issue.ignore.multicriteria.e5.resourceKey=internal/audit/siem/forwarder.go
sonar.issue.ignore.multicriteria.e6.ruleKey=go:S5527
sonar.issue.ignore.multicriteria.e6.resourceKey=internal/audit/siem/forwarder.go
sonar.issue.ignore.multicriteria.e7.ruleKey=go:S4830
sonar.issue.ignore.multicriteria.e7.resourceKey=internal/storage/remote/client.go
sonar.issue.ignore.multicriteria.e8.ruleKey=go:S5527
sonar.issue.ignore.multicriteria.e8.resourceKey=internal/storage/remote/client.go
# go:S2092 — Secure cookie flag (threaded from runtime TLS config, not hardcoded)
# go:S3330 — HttpOnly flag (HttpOnly:false is intentional for CSRF double-submit cookie)
sonar.issue.ignore.multicriteria.e9.ruleKey=go:S2092
sonar.issue.ignore.multicriteria.e9.resourceKey=server/middleware/session_cookie.go
sonar.issue.ignore.multicriteria.e10.ruleKey=go:S3330
sonar.issue.ignore.multicriteria.e10.resourceKey=server/middleware/session_cookie.go
# gosecurity:S5146 — open redirect in test handlers that intentionally redirect
# to an http:// or evil-host URL to verify refuseRedirect blocks them.
sonar.issue.ignore.multicriteria.e11.ruleKey=gosecurity:S5146
sonar.issue.ignore.multicriteria.e11.resourceKey=internal/evidencesink/evidencesink_extra_test.go
# go:S2077 — dynamic SQL; all call sites are guarded by assertSafeUsername
sonar.issue.ignore.multicriteria.e12.ruleKey=go:S2077
sonar.issue.ignore.multicriteria.e12.resourceKey=internal/dynamic/mysql.go
# kubernetes:S5849 — web container adds NET_BIND_SERVICE to bind port 80;
# nginx requires this capability and explicitly drops all others.
sonar.issue.ignore.multicriteria.e13.ruleKey=kubernetes:S5849
sonar.issue.ignore.multicriteria.e13.resourceKey=deploy/helm/keyorix/templates/web-deployment.yaml
# kubernetes:S5332 — test-connection pod uses http:// to reach the internal
# cluster service health endpoint; TLS is not available on the pod-to-pod path.
sonar.issue.ignore.multicriteria.e14.ruleKey=kubernetes:S5332
sonar.issue.ignore.multicriteria.e14.resourceKey=deploy/helm/keyorix/templates/tests/test-connection.yaml
# go:S4036 — exec.Command("git") and exec.Command("go") look up the binary via
# PATH. Both are system-installed tools on every supported platform; there is no
# fixed absolute path that is correct across Linux/macOS dev and CI environments.
# The NOSONAR inline comments on those lines use "//" as separator rather than
# "--", which SonarCloud's parser does not recognise — suppressed here instead.
sonar.issue.ignore.multicriteria.e15.ruleKey=go:S4036
sonar.issue.ignore.multicriteria.e15.resourceKey=internal/cli/secret/scan.go
sonar.issue.ignore.multicriteria.e16.ruleKey=go:S4036
sonar.issue.ignore.multicriteria.e16.resourceKey=server/tools/test_runner.go
# githubactions:S8545 — go install with pinned versions. govulncheck is pinned
# to @v1.1.4 literally; gosec is pinned to v2.26.1 via the GOSEC_VERSION env
# var defined in the same workflow file. SonarCloud cannot resolve env vars at
# static analysis time and flags the interpolated form @${GOSEC_VERSION} as
# unpinned even though the var's value is a fixed semver tag.
sonar.issue.ignore.multicriteria.e17.ruleKey=githubactions:S8545
sonar.issue.ignore.multicriteria.e17.resourceKey=.github/workflows/ci.yml
# githubactions:S8544 — pip install semgrep without a version pin. The version
# is intentionally unpinned so the weekly scheduled scan always uses the latest
# community rules; a pinned version would silently drift behind new detections.
sonar.issue.ignore.multicriteria.e18.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e18.resourceKey=.github/workflows/semgrep.yml
# docker:S8431 — "Use either tag or digest, not both". Using BOTH tag and
# digest is intentional: the tag provides human-readable traceability while the
# digest pins the exact immutable image layer, preventing mutable-tag attacks.
# This is a hardening practice (defense in depth), not a mistake.
sonar.issue.ignore.multicriteria.e19.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.e19.resourceKey=**/Dockerfile
# go:S3776 — cognitive complexity over threshold. Test functions intentionally
# contain complex table-driven test harnesses, branch coverage assertions, and
# setup/teardown logic. Complexity limits make sense for production code;
# test helpers are exempt.
sonar.issue.ignore.multicriteria.e20.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e20.resourceKey=**/*_test.go
# go:S4144 — "Refactor this method so that its implementation is not identical".
# Mock implementations in test files share identical bodies by design: each mock
# needs its own type to satisfy a distinct interface, but the stub body is always
# "return nil" or "return zero value". Refactoring them into shared helpers
# would require generics or reflection, adding complexity without benefit.
sonar.issue.ignore.multicriteria.e21.ruleKey=go:S4144
sonar.issue.ignore.multicriteria.e21.resourceKey=**/*_test.go
# godre:S8242 — "Do not use context.Context as a field in a struct". This rule
# is appropriate for production code but test helpers that embed a context to
# carry request-scoped values across test assertions are a well-established Go
# testing pattern and do not suffer from the lifetime issues the rule guards against.
sonar.issue.ignore.multicriteria.e22.ruleKey=godre:S8242
sonar.issue.ignore.multicriteria.e22.resourceKey=**/*_test.go
# godre:S8196 — single-method interfaces should follow Go's "-er" suffix
# convention. s3PutAPI (evidencesink) and NotificationSink (core) predate this
# rule; NotificationSink is an established domain term used across the codebase,
# and renaming would require updating dozens of call sites with no correctness
# gain. Both are suppressed rather than renamed.
sonar.issue.ignore.multicriteria.e23.ruleKey=godre:S8196
sonar.issue.ignore.multicriteria.e23.resourceKey=internal/evidencesink/objectstore.go
sonar.issue.ignore.multicriteria.e24.ruleKey=godre:S8196
sonar.issue.ignore.multicriteria.e24.resourceKey=internal/core/service.go
# shelldre:S1192 — define a constant for repeated string literals. Shell scripts
# that repeat short string constants (test version tags, fixture paths) cannot
# use typed constants; extracting to a variable is valid but the rule fires even
# on unavoidable repetition (e.g. shell arithmetic expressions). Suppressed for
# the two test entrypoint scripts where this fires.
sonar.issue.ignore.multicriteria.e25.ruleKey=shelldre:S1192
sonar.issue.ignore.multicriteria.e25.resourceKey=integrations/github-action/test/entrypoint_test.sh
sonar.issue.ignore.multicriteria.e26.ruleKey=shelldre:S1192
sonar.issue.ignore.multicriteria.e26.resourceKey=scripts/run-comprehensive-tests.sh
# godre:S8196 — single-method interface StorageFactory predates this rule;
# "StorageFactory" is the established domain term used across the codebase
# and renaming to "StorageCreator" would require updates to many call sites.
sonar.issue.ignore.multicriteria.e27.ruleKey=godre:S8196
sonar.issue.ignore.multicriteria.e27.resourceKey=internal/storage/factory.go
# plsql:* — SonarCloud applies PL/SQL dialect rules to SQLite migration files.
# These are false positives: S1192 (duplicate string literals in DDL that
# cannot be parameterized), CreateOrReplaceCheck (SQLite has no CREATE OR
# REPLACE syntax), and S5141 (SQLite DROP TABLE semantics differ from PL/SQL).
sonar.issue.ignore.multicriteria.e28.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e28.resourceKey=migrations/**
sonar.issue.ignore.multicriteria.e29.ruleKey=plsql:CreateOrReplaceCheck
sonar.issue.ignore.multicriteria.e29.resourceKey=migrations/**
sonar.issue.ignore.multicriteria.e30.ruleKey=plsql:S5141
sonar.issue.ignore.multicriteria.e30.resourceKey=migrations/**
