# Keyorix gitleaks configuration.
#
# The default rules are extended (not replaced). The allowlist below covers paths
# that legitimately contain SAMPLE/FAKE credentials — the "leave Vault" demo, docs
# and API examples, test scripts, test files, and the import CLI's doc-comment
# examples — so the scanner stays a MEANINGFUL gate over real source/config rather
# than being permanently red on known fixtures (which would mask a real leak).
title = "Keyorix"

[extend]
useDefault = true

[allowlist]
description = "Demo / docs / scripts / test fixtures — non-real sample credentials"
# HKDF domain-separation labels (constant info strings used to derive purpose-bound
# keys from the DEK) — public, not secrets, but the generic-api-key heuristic flags
# the `…KeyInfo = "…"` shape.
regexes = [
  '''keyorix-audit-checkpoint-v1''',
  '''keyorix-audit-checkpoint-kek-v2''',
  '''keyorix-audit-checkpoint-kek-id-v2''',
  '''keyorix-evidence-signature-v1''',
  '''keyorix-evidence-signature-kek-v2''',
  '''keyorix-evidence-signature-kek-id-v2''',
]
paths = [
  '''demo/.*''',
  '''.*\.md''',
  '''scripts/.*''',
  '''.*_test\.go''',
  '''internal/cli/secret/import\.go''',
  '''internal/cli/secret/import_parsers\.go''',
  '''internal/cli/secret/source_vault\.go''',
  '''internal/core/setup_consume\.go''',
  # web/ (ADR-070) test fixtures and mock values — merged in from web/'s own
  # (now-superseded) .gitleaks.toml. Path-based, not the SHA-fingerprinted
  # .gitleaksignore entries web/ also had: this repo's gitleaks job scans
  # full history via `--log-opts="HEAD"` (see ci.yml's gitleaks job), and the
  # DCO retrofit (ADR-070 Decision) rewrote every non-bot keyorix-web commit's
  # SHA, so any commit-SHA-keyed suppression from the standalone repo is
  # already stale on arrival. Path/regex rules survive that kind of rewrite;
  # SHA fingerprints don't. See BACKLOG.md if a follow-up scan re-flags a
  # finding these path rules don't cover.
  '''web/.*__tests__.*''',
  '''web/.*\.test\.(ts|tsx)$''',
  '''web/.*\.spec\.(ts|tsx)$''',
  '''web/src/test/.*''',
  '''web/e2e/.*''',
]
