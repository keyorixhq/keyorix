apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kxsync.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kxsync.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kxsync.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when the config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Prometheus scrape hints for the agent's /metrics endpoint.
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.healthPort | default 8080 | quote }}
        prometheus.io/path: /metrics
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kxsync.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kxsync.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532  # matches the distroless:nonroot image user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keyorix-k8s-sync
          image: {{ include "kxsync.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-config", "/etc/keyorix/k8s-sync.yaml"]
          env:
            - name: KEYORIX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "keyorix.tokenSecret.name is required" .Values.keyorix.tokenSecret.name }}
                  key: {{ .Values.keyorix.tokenSecret.key | default "token" }}
          ports:
            - name: health
              containerPort: {{ .Values.healthPort | default 8080 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/keyorix
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kxsync.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
