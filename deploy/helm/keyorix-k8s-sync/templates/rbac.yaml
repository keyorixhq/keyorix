{{/*
The agent needs to read and write Secrets in each target namespace. A single
ClusterRole holds the permission set; a namespaced RoleBinding grants it to the
agent's ServiceAccount in each target namespace (least privilege — no cluster-wide
Secret access).

The target Secret names are fully known and static at render time (the same
.Values.mappings list templates/configmap.yaml renders into the agent's config), so
get/patch/delete are further scoped with resourceNames to exactly those names —
without it, the ClusterRole would grant get/patch (and, when delete is needed at all,
delete) on EVERY Secret in each target namespace, not just the ones this release
actually manages (#Bug5). Two verbs are necessarily left unscoped to the "secrets"
resource type as a whole, both for the same underlying reason — the Kubernetes
authorizer only evaluates resourceNames for requests that target one already-existing,
named object:
  - create: there is no object yet at authorization time, so no name to match.
  - list (cleanup only): a list request targets the whole collection, not one name;
    per the Kubernetes RBAC docs, a rule carrying resourceNames "cannot be used for
    the list, watch, or deletecollection" verbs — orphan discovery still scopes
    itself at the application layer via the managed-by label selector in
    RESTSink.List, just not via RBAC resourceNames.
These two gaps are inherent to Kubernetes RBAC, not an oversight here.
*/}}
{{- $secretNames := list }}
{{- range .Values.mappings }}
{{- $secretNames = append $secretNames .name }}
{{- end }}
{{- $secretNames = $secretNames | uniq }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kxsync.fullname" . }}
  labels:
    {{- include "kxsync.labels" . | nindent 4 }}
rules:
  # create (always) and list (cleanup only) cannot be resourceNames-scoped — see note
  # above — so they are granted on the resource type as a whole.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"{{ if .Values.cleanup }}, "list"{{ end }}]
{{- if $secretNames }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- toYaml $secretNames | nindent 6 }}
    # delete is granted whenever EITHER feature that can actually issue a delete is
    # enabled — not just cleanup (orphan reaping). pruneOnRevoke (values.yaml,
    # default true — the secure default: a confirmed-gone/revoked secret must not
    # stay readable indefinitely) also calls sink.Delete() whenever every mapping for
    # a target Secret is confirmed gone/revoked at once (sync.go: "removing the
    # now-empty Secret entirely"), independent of cleanup. Before this fix, with
    # cleanup off (default) and pruneOnRevoke on (also default), that delete call
    # failed with a 403 every single pass — confirmed live (Session J, 2026-09-28):
    # the agent correctly detected the revoked upstream and decided to remove the
    # now-empty target, logged "failed to remove revoked secret: ... HTTP 403", and
    # left the stale (no-longer-authorized) Secret sitting in the cluster forever,
    # silently defeating the exact guarantee pruneOnRevoke's own doc comment
    # promises. Scoped by resourceNames like get/patch above, so this still never
    # grants secrets:delete cluster-wide (#186's actual concern) — only on the
    # specific Secret names this release manages.
    verbs: ["get", "patch"{{ if or .Values.cleanup .Values.pruneOnRevoke }}, "delete"{{ end }}]
{{- end }}
---
{{- $ns := .Values.targetNamespaces | default (list .Release.Namespace) }}
{{- $root := . }}
{{- range $ns }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kxsync.fullname" $root }}
  namespace: {{ . }}
  labels:
    {{- include "kxsync.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kxsync.fullname" $root }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kxsync.serviceAccountName" $root }}
    namespace: {{ $root.Release.Namespace }}
---
{{- end }}
