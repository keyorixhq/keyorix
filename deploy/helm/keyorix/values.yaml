# Default values for the Keyorix chart.

# ── Required secrets ──────────────────────────────────────────────────────────
# The KEK is derived from masterPassword. Changing it after first boot makes
# every stored secret undecryptable — set it once and keep it. Provide it here,
# or set auth.existingSecret to bring your own Secret (recommended for prod).
auth:
  # The encryption master passphrase. REQUIRED unless existingSecret is set.
  masterPassword: ""
  # Optional first-boot admin bootstrap (idempotent). Leave password empty to
  # run `keyorix system init` manually instead.
  adminUsername: "admin"
  adminEmail: "admin@keyorix.local"
  adminPassword: ""
  # Bring your own Secret instead of the values above. It must contain keys:
  #   KEYORIX_MASTER_PASSWORD, KEYORIX_DB_PASSWORD, and optionally
  #   KEYORIX_ADMIN_PASSWORD.
  existingSecret: ""

# ── API server ────────────────────────────────────────────────────────────────
server:
  image:
    repository: ghcr.io/keyorixhq/keyorix-server
    # `latest`/`main` are MUTABLE — the exact same tag can point at a different
    # image tomorrow, defeating "what did I actually deploy" and any image-scan
    # attestation pinned to this value. Pin to an immutable `sha-<commit>` tag, a
    # `vX.Y.Z` release tag, or (strongest) a digest via `digest:` below for
    # production.
    tag: "latest"
    # digest, when set (e.g. "sha256:abc123..."), pins the exact image content —
    # immune to a tag being retargeted after the fact — and takes precedence over
    # tag.
    digest: ""
    pullPolicy: IfNotPresent
  # The server holds the encryption keys on a single ReadWriteOnce volume and is
  # a single logical instance — do not scale beyond 1 replica.
  replicas: 1
  service:
    port: 8080
  # Persistent volume for the wrapped DEK + KEK salt (/app/keys). MUST persist —
  # losing it makes every stored secret undecryptable. Back it up.
  keysPersistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Web UI ────────────────────────────────────────────────────────────────────
web:
  enabled: true
  image:
    repository: ghcr.io/keyorixhq/keyorix-web
    # See server.image.tag — the same mutable-tag caveat applies here.
    tag: latest
    # digest, when set, takes precedence over tag (see server.image.digest).
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
  # corsAllowedOrigins allowlists origins (exact scheme+host+port, e.g.
  # "https://app.example.com") the nginx-proxied /api, /auth, /system endpoints will
  # accept CREDENTIALED cross-origin requests from. The bundled web UI's own JS calls
  # these same-origin (served by this same nginx) and needs no entry here. Empty by
  # default: no cross-origin API access unless explicitly opted in.
  corsAllowedOrigins: []

# ── Ingress (for the web UI) ──────────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: keyorix.local
  tls: []   # e.g. [{ secretName: keyorix-tls, hosts: [keyorix.example.com] }]

# ── Bundled PostgreSQL ────────────────────────────────────────────────────────
# A minimal in-chart Postgres for evaluation. For production, set enabled:false
# and point externalDatabase at a managed/HA PostgreSQL.
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: keyorix
    database: keyorix
    # Password for the bundled DB. REQUIRED when postgresql.enabled and no
    # auth.existingSecret is set.
    password: ""
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

# Used when postgresql.enabled is false.
externalDatabase:
  host: ""
  port: 5432
  database: keyorix
  user: keyorix
  sslMode: require

# ── Network policy ────────────────────────────────────────────────────────────
# Scopes the server API and the bundled Postgres to same-namespace traffic —
# without this both are reachable from any pod in the cluster that can route to
# their Service. Disable only if your CNI doesn't support NetworkPolicy, or you
# have an equivalent policy managed elsewhere.
networkPolicy:
  enabled: true

imagePullSecrets: []
