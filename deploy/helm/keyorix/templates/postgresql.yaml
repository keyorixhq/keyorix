{{- if .Values.postgresql.enabled -}}
{{- if .Values.postgresql.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "keyorix.postgresql.fullname" . }}
  labels:
    {{- include "keyorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgresql.persistence.size }}
  {{- with .Values.postgresql.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "keyorix.postgresql.fullname" . }}
  labels:
    {{- include "keyorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgresql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keyorix.postgresql.fullname" . }}
  labels:
    {{- include "keyorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    # checkov (helm-chart-security CI job): postgres needs a writable root
    # filesystem for its unix socket (/var/run/postgresql) and temp files outside
    # the PVC-backed data directory -- the container is otherwise fully hardened
    # (allowPrivilegeEscalation: false, capabilities dropped, non-root uid 999,
    # seccomp RuntimeDefault at the pod level), so only this one property is
    # suppressed, not the whole check family.
    checkov.io/skip1: CKV_K8S_22=postgres requires a writable root filesystem for its socket/temp files
    # This is a third-party image (not one this project builds/publishes), already
    # pinned to a specific repository:tag; digest-pinning a bundled upstream
    # dependency is a separate, larger undertaking (tracking and rotating upstream
    # digests) than pinning the images this project builds itself (server, web,
    # operator, k8s-sync -- all of which support .Values.<component>.image.digest).
    checkov.io/skip2: CKV_K8S_43=third-party bundled dependency, already tag-pinned; digest tracking is a separate undertaking from this project's own images
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "keyorix.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # 999 is the postgres user in the official postgres:*-alpine images; fsGroup
        # makes the PVC group-writable by it so a fresh (non-root-initialised)
        # volume doesn't need the entrypoint's root-owned chown step.
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "keyorix.secretName" . }}
                  key: KEYORIX_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          {{- with .Values.postgresql.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          {{- if .Values.postgresql.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "keyorix.postgresql.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end -}}
