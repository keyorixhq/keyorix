{{- if not .Values.auth.existingSecret -}}
{{- if not .Values.auth.masterPassword -}}
{{- fail "auth.masterPassword is required (or set auth.existingSecret). It derives the encryption KEK and must be stable for the life of the install." -}}
{{- end -}}
{{- $dbPass := .Values.postgresql.enabled | ternary .Values.postgresql.auth.password .Values.externalDatabase.password -}}
{{- if not $dbPass -}}
{{- fail "A database password is required: set postgresql.auth.password (bundled DB) or externalDatabase.password (external DB), or use auth.existingSecret." -}}
{{- end -}}
{{- if and .Values.auth.adminPassword (lt (len .Values.auth.adminPassword) 16) -}}
{{- fail "auth.adminPassword must be at least 16 characters -- the server's own POST /system/init validation rejects anything shorter, which otherwise surfaces as a silent first-boot bootstrap failure rather than a chart error." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keyorix.fullname" . }}
  labels:
    {{- include "keyorix.labels" . | nindent 4 }}
type: Opaque
stringData:
  KEYORIX_MASTER_PASSWORD: {{ .Values.auth.masterPassword | quote }}
  KEYORIX_DB_PASSWORD: {{ $dbPass | quote }}
  {{- if .Values.auth.adminPassword }}
  KEYORIX_ADMIN_PASSWORD: {{ .Values.auth.adminPassword | quote }}
  {{- end }}
  # The server refuses POST /system/init without a matching bootstrap token
  # (server/main.go) -- without this, auth.adminPassword's documented
  # first-boot bootstrap silently no-ops (entrypoint.sh logs a WARN and skips
  # it) and manual `keyorix system init` has no token to use either, since the
  # server only ever logs its own self-generated fallback token MASKED
  # (first 8 + last 4 chars). Generated once and read back on every
  # subsequent render via `lookup` so it survives `helm upgrade` unchanged
  # (same idempotent-random-secret pattern as auth.masterPassword is expected
  # to be pinned by the operator) -- `lookup` returns nothing under
  # `helm template`/`--dry-run`, so a fresh value is rendered there each time;
  # that's expected and harmless (no live Secret exists yet to diverge from).
  KEYORIX_BOOTSTRAP_TOKEN: {{ include "keyorix.bootstrapToken" . | quote }}
{{- end -}}
