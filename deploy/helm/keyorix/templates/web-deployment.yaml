{{- if .Values.web.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keyorix.web.fullname" . }}
  labels:
    {{- include "keyorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  annotations:
    # checkov (helm-chart-security CI job): nginx needs a writable root filesystem
    # for /var/cache/nginx, /var/run/nginx.pid and client-body temp files -- the
    # container is otherwise fully hardened (allowPrivilegeEscalation: false,
    # capabilities dropped, non-root uid 101, seccomp RuntimeDefault at the pod
    # level), so only this one property is suppressed, not the whole check family.
    checkov.io/skip1: CKV_K8S_22=nginx requires a writable root filesystem for its cache/pid/temp files
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "keyorix.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/web-config.yaml") . | sha256sum }}
        # kube-score (helm-chart-policy CI job), each with an already-settled reason
        # elsewhere in this file/chart, not a fresh judgment call made here:
        #   - container-security-context-readonlyrootfilesystem: same nginx
        #     cache/pid/temp-file need as the checkov.io/skip1 annotation above.
        #   - container-security-context-user-group-id: fixed uid 101 to match the
        #     nginx image's own user (see the securityContext comment below) -- same
        #     already-reviewed tradeoff as this repo's checkov CKV_K8S_40 exclusion.
        #   - pod-probes-identical: /health (web-config.yaml) is a static "return
        #     200 healthy" location with no dependency check -- readiness and
        #     liveness are tautologically identical here, so differentiating them
        #     would add a distinct probe with zero behavioral difference.
        #   - pod-networkpolicy: this chart's own networkpolicy.yaml already
        #     documents WHY web's ingress is deliberately left unrestricted (the
        #     intended public entry point, often via an Ingress controller whose
        #     pod labels vary by installation).
        kube-score/ignore: >-
          container-security-context-readonlyrootfilesystem,
          container-security-context-user-group-id,
          pod-probes-identical,
          pod-networkpolicy
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # A non-root nginx binding port 80 needs CAP_NET_BIND_SERVICE (below,
        # container-level), not root — UID 101 is nginx's own non-root user in the
        # standard/alpine nginx images this is built from.
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "keyorix.web.image" . | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: ["NET_BIND_SERVICE"]
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- if .Values.web.resources }}
            {{- toYaml .Values.web.resources | nindent 12 }}
            {{- else }}
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
            {{- end }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "keyorix.web.fullname" . }}-config
{{- end -}}
