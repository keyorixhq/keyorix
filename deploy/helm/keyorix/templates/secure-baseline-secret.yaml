{{- if .Values.secureBaseline.enabled -}}
{{- /*
SECURE-DEFAULT-1 (ADR-112 §4): the TLS certificates and the /metrics token the
secure-baseline config references, generated by Helm on first install and kept
on upgrades (lookup): regenerating them on every upgrade would rotate the
token under a running Prometheus and restart nothing that reads them.

- server.crt/server.key: the server's TLS certificate for its Service names
  (self-signed; the web pod trusts exactly this certificate).
- metrics_token: GET /metrics bearer token.
- postgres.crt/postgres.key: TLS for the bundled PostgreSQL (postgresql.enabled).

Pod-to-pod only: browsers reach the web pod (or your Ingress), never these.
To rotate, delete this Secret and run `helm upgrade` (then restart the pods).
`helm template` has no cluster to look up, so it renders fresh values each time.
*/ -}}
{{- $name := printf "%s-secure-baseline" (include "keyorix.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if and $existing $existing.data -}}
{{- $data = deepCopy $existing.data -}}
{{- end -}}
{{- $days := int .Values.secureBaseline.certValidityDays -}}
{{- if not (and (hasKey $data "server.crt") (hasKey $data "server.key")) -}}
{{- $svc := include "keyorix.server.fullname" . -}}
{{- $cert := genSelfSignedCert $svc nil (list $svc (printf "%s.%s" $svc .Release.Namespace) (printf "%s.%s.svc" $svc .Release.Namespace) "localhost") $days -}}
{{- $_ := set $data "server.crt" ($cert.Cert | b64enc) -}}
{{- $_ := set $data "server.key" ($cert.Key | b64enc) -}}
{{- end -}}
{{- if not (hasKey $data "metrics_token") -}}
{{- $_ := set $data "metrics_token" (randAlphaNum 48 | b64enc) -}}
{{- end -}}
{{- if and .Values.postgresql.enabled (not (and (hasKey $data "postgres.crt") (hasKey $data "postgres.key"))) -}}
{{- $pg := include "keyorix.postgresql.fullname" . -}}
{{- $pgCert := genSelfSignedCert $pg nil (list $pg (printf "%s.%s" $pg .Release.Namespace) (printf "%s.%s.svc" $pg .Release.Namespace)) $days -}}
{{- $_ := set $data "postgres.crt" ($pgCert.Cert | b64enc) -}}
{{- $_ := set $data "postgres.key" ($pgCert.Key | b64enc) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "keyorix.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k := keys $data | sortAlpha }}
  {{ $k }}: {{ index $data $k }}
  {{- end }}
{{- end }}
