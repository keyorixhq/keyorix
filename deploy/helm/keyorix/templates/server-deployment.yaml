apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keyorix.server.fullname" . }}
  labels:
    {{- include "keyorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  annotations:
    # kube-score (helm-chart-policy CI job): deployment-strategy/deployment-replicas
    # both assume a horizontally-scalable Deployment -- server is pinned to exactly
    # 1 replica with Recreate (see the replicas/strategy comments right below):
    # RollingUpdate would briefly run 2 pods against the same ReadWriteOnce keys
    # volume, which can't work, and >1 replica would mean 2 processes racing the
    # same per-instance KEK. Not a compromise to relax later -- structurally
    # required by the ReadWriteOnce ownership model.
    kube-score/ignore: "deployment-strategy,deployment-replicas"
spec:
  # Single instance: the keys volume is ReadWriteOnce and the KEK is per-instance.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "keyorix.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/server-config.yaml") . | sha256sum }}
        # kube-score: container-security-context-user-group-id wants a UID/GID >
        # 10000; 1001 is fixed to match the server image's own "keyorix" user (see
        # the securityContext comment below) -- same already-reviewed tradeoff as
        # this repo's checkov CKV_K8S_40 exclusion (CLAUDE.md), applied per-object
        # here since k8s-sync/operator's distroless UID (65532) already satisfies
        # this check on its own and shouldn't have it silenced too.
        kube-score/ignore: "container-security-context-user-group-id"
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # matches the server image's "keyorix" user (server/Dockerfile: addgroup/
        # adduser -u 1001 -g 1001).
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ include "keyorix.server.image" . }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.server.service.port }}
          env:
            - name: KEYORIX_MASTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "keyorix.secretName" . }}
                  key: KEYORIX_MASTER_PASSWORD
            - name: KEYORIX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "keyorix.secretName" . }}
                  key: KEYORIX_DB_PASSWORD
            - name: KEYORIX_ADMIN_USERNAME
              value: {{ .Values.auth.adminUsername | quote }}
            - name: KEYORIX_ADMIN_EMAIL
              value: {{ .Values.auth.adminEmail | quote }}
            {{- if or .Values.auth.adminPassword .Values.auth.existingSecret }}
            - name: KEYORIX_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "keyorix.secretName" . }}
                  key: KEYORIX_ADMIN_PASSWORD
                  optional: true
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/keyorix.yaml
              subPath: keyorix.yaml
              readOnly: true
            - name: keys
              mountPath: /app/keys
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- if .Values.server.resources }}
            {{- toYaml .Values.server.resources | nindent 12 }}
            {{- else }}
            # Kept in sync with values.yaml's own server.resources default --
            # see its comment for the Guaranteed-QoS/measurement derivation.
            requests:
              cpu: 1000m
              memory: 512Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 1000m
              memory: 512Mi
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "keyorix.server.fullname" . }}-config
        - name: keys
          {{- if .Values.server.keysPersistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "keyorix.server.fullname" . }}-keys
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
