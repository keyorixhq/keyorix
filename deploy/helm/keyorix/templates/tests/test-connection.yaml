apiVersion: v1
kind: Pod
metadata:
  name: {{ include "keyorix.fullname" . }}-test
  labels:
    {{- include "keyorix.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
    # checkov (helm-chart-security CI job): this is an ephemeral `helm test` hook
    # pod (deleted after each run), not a long-running production workload -- it
    # doesn't carry the same registry-compromise blast radius that motivates
    # digest-pinning this project's own long-lived server/web/operator/k8s-sync
    # images, and busybox:1.36 is already a specific, well-known pinned tag.
    checkov.io/skip1: CKV_K8S_43=ephemeral test-hook pod on a well-known pinned tag, not a production workload
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    # A plain `wget --spider` needs no elevated privileges at all -- matches the
    # same hardening baseline as the application's own containers (#helm-chart-security).
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: busybox:1.36
      command: ["wget"]
      args:
        - "--spider"
        - "-S"
        - "http://{{ include "keyorix.server.fullname" . }}:{{ .Values.server.service.port }}/health"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
          ephemeral-storage: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
