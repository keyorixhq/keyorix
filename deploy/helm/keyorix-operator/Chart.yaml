apiVersion: v2
name: keyorix-operator
description: Keyorix Kubernetes operator — reconciles KeyorixSecret resources into native Kubernetes Secrets
type: application
# Chart version — tracks the Keyorix release version (published in lockstep).
# release.yml's publish-chart job overrides both this and appVersion from the git tag
# at publish time, so the actually-published OCI chart is always correct regardless of
# what's committed here — but this committed value still governs a local
# `helm install ./deploy/helm/keyorix-operator` without an explicit --set override.
# Found 3 releases behind once already (0.85.0 vs. actual latest 0.89.0) and bumped;
# drifted again since (found 2026-09-28, Session J: still 0.89.0 while
# ghcr.io/keyorixhq/keyorix-operator's actual latest published tag was 0.95.1 —
# confirmed live against the registry, not assumed, and matching deploy/helm/keyorix's
# own Chart.yaml, which had already moved on). Bump this whenever you bump the main
# chart for a release that also ships an operator image — see this chart's README
# "Versioning" section. Recurring a second time suggests the "bump on every relevant PR"
# policy alone isn't sufficient; a machine check comparing this against the main chart's
# version (or against the registry) would catch it earlier, but none exists today.
version: 0.95.1
# The keyorix-operator image tag this chart deploys by default.
appVersion: "0.95.1"
home: https://github.com/keyorixhq/keyorix
sources:
  - https://github.com/keyorixhq/keyorix
keywords:
  - keyorix
  - secrets
  - kubernetes
  - operator
