# A KeyorixSecret materialises Keyorix secrets into a native Kubernetes Secret named
# db-creds, refreshing every 5m. The Secret is owned by this resource, so deleting the
# KeyorixSecret removes the Secret too.
#
# The machine-identity token is read from an existing Secret (create it out-of-band).
# It MUST carry the secrets.keyorix.io/token-secret=true label (only a principal with
# real Secret-write RBAC can set it) — the operator refuses to resolve an unlabeled
# Secret as a token source:
#   kubectl -n app create secret generic keyorix-token --from-literal=token="$TOKEN"
#   kubectl -n app label secret keyorix-token secrets.keyorix.io/token-secret=true
apiVersion: secrets.keyorix.io/v1alpha1
kind: KeyorixSecret
metadata:
  name: db-creds
  namespace: app
spec:
  server: https://keyorix.internal
  tokenSecretRef:
    name: keyorix-token
    key: token
  refreshInterval: 5m
  target:
    name: db-creds
    type: Opaque
  # prunePolicy: Keep (the default -- shown for documentation; omitting this line has
  # the same effect) leaves db-creds' last-known value untouched if app/production/
  # db-password or app/production/api-key is deleted upstream or access is revoked --
  # the Ready condition still reports it (reason UpstreamSecretGone /
  # UpstreamAccessRevoked), it just isn't acted on. Set to Delete to have the operator
  # actively remove db-creds instead. Be aware tokenSecretRef is commonly reused across
  # several KeyorixSecrets: with Delete, one credential rotation/revocation event
  # deletes every target Secret backed by that token, not just this one.
  prunePolicy: Keep
  data:
    - secretKey: DB_PASSWORD
      ref: app/production/db-password   # project/environment/name
    - secretKey: API_KEY
      ref: app/production/api-key
