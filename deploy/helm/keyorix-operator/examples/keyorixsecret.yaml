# A KeyorixSecret materialises Keyorix secrets into a native Kubernetes Secret named
# db-creds, refreshing every 5m. The Secret is owned by this resource, so deleting the
# KeyorixSecret removes the Secret too.
#
# The machine-identity token is read from an existing Secret (create it out-of-band):
#   kubectl -n app create secret generic keyorix-token --from-literal=token="$TOKEN"
apiVersion: secrets.keyorix.io/v1alpha1
kind: KeyorixSecret
metadata:
  name: db-creds
  namespace: app
spec:
  server: https://keyorix.internal
  tokenSecretRef:
    name: keyorix-token
    key: token
  refreshInterval: 5m
  target:
    name: db-creds
    type: Opaque
  data:
    - secretKey: DB_PASSWORD
      ref: app/production/db-password   # project/environment/name
    - secretKey: API_KEY
      ref: app/production/api-key
