# A KeyorixSecret materialises Keyorix secrets into a native Kubernetes Secret named
# db-creds, refreshing every 5m. The Secret is owned by this resource, so deleting the
# KeyorixSecret removes the Secret too.
#
# The machine-identity token is read from an existing Secret (create it out-of-band).
# It MUST carry the secrets.keyorix.io/token-secret=true label (only a principal with
# real Secret-write RBAC can set it) — the operator refuses to resolve an unlabeled
# Secret as a token source:
#   kubectl -n app create secret generic keyorix-token --from-literal=token="$TOKEN"
#   kubectl -n app label secret keyorix-token secrets.keyorix.io/token-secret=true
apiVersion: secrets.keyorix.io/v1alpha1
kind: KeyorixSecret
metadata:
  name: db-creds
  namespace: app
  # keyorix.io/confirm-prune: acknowledges the mass-revocation circuit breaker (see
  # below) if it trips -- set to an RFC3339 timestamp (valid for 1 hour after it's
  # set) ONLY in direct response to an observed "MassRevocationSuspected" Ready
  # condition / Warning Event that you've confirmed is an intentional, expected
  # event (e.g. a planned credential rotation), then remove it again once resolved.
  # Left unset in normal operation -- shown here for documentation only.
  # annotations:
  #   keyorix.io/confirm-prune: "2026-09-25T12:00:00Z"
spec:
  server: https://keyorix.internal
  tokenSecretRef:
    name: keyorix-token
    key: token
  refreshInterval: 5m
  target:
    name: db-creds
    type: Opaque
  # prunePolicy: Delete (the default, restored 2026-09-25 -- shown for documentation;
  # omitting this line has the same effect) actively removes db-creds the moment
  # app/production/db-password or app/production/api-key is deleted upstream or
  # access is revoked -- the Ready condition also reports it (reason
  # UpstreamSecretGone / UpstreamAccessRevoked). Be aware tokenSecretRef is commonly
  # reused across several KeyorixSecrets: a single credential rotation/revocation
  # event reads as the identical failure on every one of them at once -- the
  # MASS-REVOCATION CIRCUIT BREAKER is what stops that from deleting every target
  # Secret backed by that token in one shot (see the CRD's own PrunePolicy
  # description and the annotation above), not this field. Set to Keep to opt OUT of
  # wiping entirely for this Secret, leaving its last-known value untouched instead.
  prunePolicy: Delete
  data:
    - secretKey: DB_PASSWORD
      ref: app/production/db-password   # project/environment/name
    - secretKey: API_KEY
      ref: app/production/api-key
