# keyorix-operator — deploys the Keyorix Kubernetes operator.
#
# The operator watches KeyorixSecret resources and materialises the referenced Keyorix
# secrets into native Kubernetes Secrets, owned by the KeyorixSecret (so deleting the CR
# garbage-collects the Secret). Each KeyorixSecret names its own Keyorix server and a
# machine-identity token Secret; no credentials live in this chart.

image:
  repository: ghcr.io/keyorixhq/keyorix-operator
  # Empty defaults to this chart's own appVersion (a pinned `vX.Y.Z`). `latest`/`main`
  # are MUTABLE -- the exact same tag can point at a different image tomorrow,
  # defeating "what did I actually deploy" and any image-scan attestation pinned to
  # this value -- only set this to a floating tag if you understand that tradeoff. A
  # digest via `digest:` below (strongest pin) takes precedence over either. This
  # operator's ServiceAccount can hold broad Secret-read/write RBAC (see rbac.yaml),
  # so pinning by digest in production matters more here than for a typical workload.
  tag: ""
  # digest, when set (e.g. "sha256:abc123..."), pins the exact image content --
  # immune to a tag being retargeted after the fact -- and takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

# imagePullSecrets: names of existing Secrets (docker-registry type) in the release
# namespace to pull the operator image from a private/mirrored registry -- required for
# air-gapped installs that mirror ghcr.io/keyorixhq/keyorix-operator behind auth. Empty by
# default (matches the keyorix chart's own imagePullSecrets convention).
#   imagePullSecrets:
#     - name: my-registry-cred
imagePullSecrets: []

# replicas: keep at 1 unless leaderElection is enabled (only one replica reconciles).
replicas: 1
# leaderElection: enable to run more than one replica safely (HA standby). Requires the
# leader-election Role this chart installs (leases in the release namespace).
leaderElection: false

# Ports the manager serves Prometheus metrics and health probes on.
metricsPort: 8080
healthPort: 8081

# metricsBearerToken (OPTIONAL): when set, required on the metrics endpoint's
# Authorization: Bearer <token> header -- wired straight to the manager's own
# -metrics-bearer-token flag (KEYORIX_METRICS_TOKEN env var; see
# operator/cmd/main.go for the gate itself). The health probe port is never
# gated by this -- kubelet must reach it unauthenticated, and it exposes no
# secret values. Leave empty to rely on networkPolicy.enabled/metricsAllowFrom
# below, or your own perimeter controls, instead; set both for defense in depth.
metricsBearerToken: ""

# ── Network policy ────────────────────────────────────────────────────────────
# Restricts inbound traffic to the manager's Prometheus metrics port to the
# peers listed in metricsAllowFrom -- without this, any pod in the cluster
# that can route to the operator's pod IP can scrape /metrics for free. The
# health probe port is deliberately left unrestricted (kubelet needs it, and
# it carries no sensitive data). Disable only if your CNI doesn't support
# NetworkPolicy, or you have an equivalent policy managed elsewhere.
networkPolicy:
  enabled: true
  # metricsAllowFrom: a list of NetworkPolicyPeer entries (podSelector /
  # namespaceSelector, in the upstream NetworkPolicy `from` syntax) permitted to
  # reach the metrics port. Defaults to any pod, in any namespace, carrying the
  # Prometheus community Helm chart's standard `app.kubernetes.io/name:
  # prometheus` label -- adjust to match your cluster's actual scrape identity.
  metricsAllowFrom:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
  egress:
    # Restricts the manager's OUTBOUND traffic instead of leaving it reachable to
    # anything the cluster network permits (the default without this). Its real
    # destinations are DNS, the in-cluster Kubernetes API server (via
    # controller-runtime's own client, for every KeyorixSecret/Secret it
    # reconciles), and whichever Keyorix server(s) a KeyorixSecret's spec.server
    # names (validated at reconcile time against --allowed-servers). Neither the
    # API server nor an admin-configured Keyorix server is a podSelector-able
    # destination, so both are allowed by PORT only (443 and 6443 -- the two
    # ports a Kubernetes API server and an https Keyorix server overwhelmingly
    # listen on). If either runs on a different port, add it via extraRules
    # below, or reconciliation will silently stop working (a NetworkPolicy drop
    # looks like a hung/timed-out call, not a clear error).
    enabled: true
    # extraRules: additional egress rules (raw NetworkPolicyEgressRule entries),
    # appended verbatim -- e.g. for an API server or Keyorix server on a
    # non-standard port.
    extraRules: []

# allowedServers (REQUIRED to sync anything): comma-effective list of trusted Keyorix
# base URLs (https://host, no path) a KeyorixSecret's spec.server must match --
# wired straight to the manager's -allowed-servers flag / KEYORIX_ALLOWED_SERVERS env
# var (operator/cmd/main.go). This is the confused-deputy control: without it every
# KeyorixSecret CR is rejected (fail closed -- see
# KeyorixSecretReconciler.validateServer), rather than the operator shipping a
# CR-named token Secret's bytes to a CR-chosen, untrusted destination. Not secret
# data itself (a base URL, not a credential), so it's an ordinary values.yaml list,
# not something that needs an existingSecret indirection.
#   allowedServers: ["https://keyorix.internal"]
allowedServers: []

# watchNamespaces (OPTIONAL, ADR-076): restricts this operator instance to reconciling
# KeyorixSecret CRs (and their target Secrets) in only the listed namespaces, instead of
# the DEFAULT (this release's own namespace only). When set, RBAC is scoped accordingly:
# the chart's ClusterRole is bound via a namespace-scoped RoleBinding in each listed
# namespace instead -- for deployments that run one operator instance per bounded
# namespace/tenant set (more than just its own, but still not cluster-wide). Mutually
# exclusive with rbac.clusterScoped: true (the chart refuses to render if both are set).
#   watchNamespaces: [team-a, team-b]
watchNamespaces: []

rbac:
  # clusterScoped (ADR-076): the ONLY way to get a genuinely cluster-wide instance --
  # watching every namespace in the cluster with no static list, bound via a
  # ClusterRoleBinding. Ignored/rejected when watchNamespaces is also set (mutually
  # exclusive, see watchNamespaces above). Defaults to false: an unmodified `helm install`
  # now gets a namespace-scoped RoleBinding in its own release namespace only, not the
  # broader cluster-wide grant this used to default to. Existing installs upgrading from a
  # prior chart version that relied on the old cluster-wide default must set this to
  # `true` explicitly to preserve that behavior across the upgrade -- see the CHANGELOG's
  # BREAKING entry for this release.
  clusterScoped: false

serviceAccount:
  create: true
  # name overrides the generated ServiceAccount name.
  name: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
    ephemeral-storage: 256Mi
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

nameOverride: ""
fullnameOverride: ""
