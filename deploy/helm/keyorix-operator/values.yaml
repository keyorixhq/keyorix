# keyorix-operator — deploys the Keyorix Kubernetes operator.
#
# The operator watches KeyorixSecret resources and materialises the referenced Keyorix
# secrets into native Kubernetes Secrets, owned by the KeyorixSecret (so deleting the CR
# garbage-collects the Secret). Each KeyorixSecret names its own Keyorix server and a
# machine-identity token Secret; no credentials live in this chart.

image:
  repository: ghcr.io/keyorixhq/keyorix-operator
  # tag defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# replicas: keep at 1 unless leaderElection is enabled (only one replica reconciles).
replicas: 1
# leaderElection: enable to run more than one replica safely (HA standby). Requires the
# leader-election Role this chart installs (leases in the release namespace).
leaderElection: false

# Ports the manager serves Prometheus metrics and health probes on.
metricsPort: 8080
healthPort: 8081

# watchNamespaces (OPTIONAL, #327/#427): restricts this operator instance to reconciling
# KeyorixSecret CRs (and their target Secrets) in only the listed namespaces, instead of
# the default cluster-wide behavior. When set, RBAC is scoped accordingly: the chart's
# ClusterRole is bound via a namespace-scoped RoleBinding in each listed namespace instead
# of a cluster-wide ClusterRoleBinding -- least privilege for deployments that run one
# operator instance per namespace/tenant set. When empty (the default), a single instance
# watches every namespace and needs the broader ClusterRoleBinding to do so.
#   watchNamespaces: [team-a, team-b]
watchNamespaces: []

rbac:
  # clusterScoped: when false (the default), the operator is bound via a RoleBinding
  # scoped to watchNamespaces (if set) or the release namespace — least privilege.
  # Set to true only when the operator must watch CRs across ALL namespaces and a
  # ClusterRoleBinding is genuinely required.
  clusterScoped: false

serviceAccount:
  create: true
  # name overrides the generated ServiceAccount name.
  name: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
    ephemeral-storage: 256Mi
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

nameOverride: ""
fullnameOverride: ""
