{{- $scope := include "kxop.scope" . | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kxop.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kxop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "kxop.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metricsPort | default 8080 | quote }}
        prometheus.io/path: /metrics
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kxop.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kxop.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532  # matches the distroless:nonroot image user
        runAsGroup: 65532  # ditto (Trivy KSV-0021: GID must be > 10000)
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "kxop.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-health-probe-bind-address=:{{ .Values.healthPort | default 8081 }}"
            - "-metrics-bind-address=:{{ .Values.metricsPort | default 8080 }}"
            - "-leader-elect={{ .Values.leaderElection | default false }}"
            # The single flag kxop.scope resolved (_helpers.tpl, ADR-076): either
            # -all-namespaces or -watch-namespaces=a,b,c. Always rendered explicitly here
            # (never left for the binary's own POD_NAMESPACE fallback to decide) for
            # manifest readability, and because the CI chart-render assertion (Commit 3)
            # needs an actual flag value to assert agrees with the rendered RBAC binding.
            - {{ $scope.flag | quote }}
          env:
            # Backs the manager's own fail-closed default (operator/cmd/main.go,
            # ADR-076): if neither -watch-namespaces nor -all-namespaces is set, it
            # watches only this value. Always set, even though this chart always renders
            # an explicit flag above -- this is what makes that default SAFE under a
            # version-skewed chart/image pair (an old chart or hand-rolled deployment
            # that forgets the flag still fails closed to its own namespace instead of
            # falling back to a cluster-wide watch).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.metricsBearerToken }}
            # Backs -metrics-bearer-token's own os.Getenv("KEYORIX_METRICS_TOKEN")
            # default (operator/cmd/main.go) -- only rendered when set, so an
            # unmodified install keeps the metrics endpoint's existing (documented)
            # unauthenticated-by-default behavior.
            - name: KEYORIX_METRICS_TOKEN
              value: {{ . | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsPort | default 8080 }}
            - name: health
              containerPort: {{ .Values.healthPort | default 8081 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- if .Values.resources }}
            {{- toYaml .Values.resources | nindent 12 }}
            {{- else }}
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
