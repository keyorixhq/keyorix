# ClusterSecretStore that lets the External Secrets Operator (ESO) read secret values
# from Keyorix via its generic Webhook provider. One store serves every namespace.
#
# How it works: for each requested key, ESO issues a single authenticated GET to
# Keyorix's secret-read endpoint and extracts the value with the JSONPath in
# result.jsonPath. The Keyorix machine-identity token is injected into the
# Authorization header from a Kubernetes Secret (never inlined here).
#
# Prerequisites:
#   - External Secrets Operator installed in the cluster.
#   - A Keyorix machine-identity token with secrets.read on the target secrets,
#     stored in a Secret carrying the label `external-secrets.io/type: webhook` (see
#     token-secret.example.yaml) -- ESO's webhook provider refuses to read a
#     secrets[].secretRef Secret that lacks this label (a confused-deputy guard: a
#     malicious SecretStore author can't point secrets[] at an arbitrary pre-existing
#     Secret they don't otherwise have RBAC to read). Confirmed live (Session J,
#     2026-09-28): without the label, every sync fails with "secret does not contain
#     needed label 'external-secrets.io/type: webhook'". The label is NOT required on
#     the caProvider Secret below -- only on secrets[] entries.
#   - If Keyorix serves a private/internal TLS cert, a Secret holding its CA bundle
#     (referenced via caProvider below).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: keyorix
spec:
  provider:
    webhook:
      # remoteRef.key is a Keyorix "project/environment/name" reference (ADR-059), e.g.
      # "app/production/db-password". (The numeric-ID form
      # /api/v1/secrets/{id}?include_value=true also works if you prefer.)
      url: "https://keyorix.internal/api/v1/secrets/value?ref={{ .remoteRef.key }}"
      method: GET
      headers:
        Accept: "application/json"
        # NOTE the trailing `.token` -- a secrets[] entry binds its template variable
        # to the referenced Secret's ENTIRE decoded data map (here `{token:
        # "kx_machine_..."}`), not to the single key named by secretRef.key. Using
        # bare `{{ .keyorixToken }}` sends Go's default map stringification
        # ("map[token:kx_machine_...]") as the bearer token, not the token itself --
        # confirmed live (Session J, 2026-09-28): the request reaches Keyorix fine but
        # gets 401 Unauthorized, since "map[token:...]" isn't a valid token. Always
        # index into the specific key: {{ .<varName>.<secretRef.key> }}.
        Authorization: "Bearer {{ .keyorixToken.token }}"
      result:
        # Keyorix wraps responses as {"data": {"secret": {...}, "value": "..."}}.
        jsonPath: "$.data.value"
      secrets:
        # Exposes the token's Secret data as {{ .keyorixToken }} (a map -- see the
        # Authorization header comment above) in url/headers above. For a
        # ClusterSecretStore the secretRef MUST carry a namespace. The referenced
        # Secret MUST carry the label `external-secrets.io/type: webhook` (see the
        # Prerequisites comment above) or every sync fails.
        - name: keyorixToken
          secretRef:
            name: keyorix-machine-token
            key: token
            namespace: external-secrets
      # Trust Keyorix's TLS cert. Omit this block only if Keyorix presents a
      # publicly-trusted certificate.
      caProvider:
        type: Secret
        name: keyorix-ca
        key: ca.crt
        namespace: external-secrets
