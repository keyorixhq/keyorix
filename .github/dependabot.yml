# Dependabot for the github-actions ecosystem (#115). Every action `uses:` line
# is now pinned to a full commit SHA rather than a mutable tag — Dependabot
# natively supports bumping a pinned SHA (opening a PR that updates both the SHA
# and its trailing `# vX.Y.Z` comment) for exactly this reason. Without this
# config, SHA-pinning would silently freeze every action forever.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      # codeql-action ships init/analyze/upload-sarif as separate dependency
      # names (one per sub-action path), so an ungrouped bump lands as
      # separate PRs — merging just one leaves workflows mixing versions,
      # which CodeQL treats as a hard configuration error ("Loaded a
      # configuration file for version X, but running version Y"), failing
      # CI on PRs that have nothing to do with the bump itself (#1257,
      # #1260). Group them so every sub-action bumps atomically in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
  # #478: without a gomod entry, Go dependency/toolchain-minimum drift (e.g. #477)
  # has no automated forcing function and depends on someone noticing manually.
  #
  # ONE gomod entry covers every Go module directory, so a group yields ONE PR
  # across all of them instead of one PR per directory per group. Each PR
  # (regardless of diff size) pays the same fixed CI cost -- CodeQL/SonarCloud/the
  # full test-suite scale with the codebase, not the diff -- so N ungrouped
  # routine bumps cost roughly N times what one grouped PR costs for the same
  # updates. Patch and minor are SEPARATE groups so a breaking minor does not
  # block the patches. Majors are deliberately left ungrouped/individual: they
  # can be breaking and deserve their own review/testing pass, not a bundle that
  # blocks on the slowest one.
  #
  # The nested modules (/operator, /migrate, /cli, /fuzzkit) pin the same
  # libraries as the root module (aws-sdk-go-v2, smithy-go, x/*, cbor, ...) and
  # must follow root; the corobix drift-guard (check-shared-pins.sh) reported
  # ~35 mismatches in migrate/ and operator/ on 2026-11-20. Everything now moves
  # in the same monthly run, so the pins land together instead of lagging.
  #
  # Edits to this file make Dependabot recreate every update at once (bursts of
  # 19 and 10 PRs on 21 and 23 Nov 2026): change it rarely and in one commit.
  - package-ecosystem: gomod
    directories:
      - /
      - /operator
      - /migrate
      - /cli
      - /fuzzkit
    # Indirect dependencies are skipped by default, so a stale transitive pin
    # (e.g. go-toml/v2 via viper) never got a bump PR. They join the same groups.
    allow:
      - dependency-type: all
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      go-patch:
        update-types:
          - "patch"
      go-minor:
        update-types:
          - "minor"
  # ADR-070: web/ (the dashboard, ex-keyorix-web) is now a subtree here.
  # web/.github/dependabot.yml — the pnpm-ecosystem entry that covered it as
  # a standalone repo — is deleted along with the rest of web/.github/ in the
  # same commit; without this entry Dependabot would silently stop updating
  # the frontend's dependency tree entirely.
  #
  # The repo root also has its own package.json/package-lock.json
  # (keyorix-ci-tools: cdxgen, pinned for Scorecard
  # supply-chain compliance). Dependabot's security updates already cover
  # it regardless of this file (PR #1687 bumped fast-uri here without any
  # entry for it) -- listing / here is for routine patch/minor version
  # updates of that tree.
  #
  # npm-patch and npm-minor group routine bumps the same way as go-patch and
  # go-minor above: one PR per group across both directories; majors stay
  # individual.
  - package-ecosystem: npm
    directories:
      - /web
      - /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm-patch:
        update-types:
          - "patch"
      npm-minor:
        update-types:
          - "minor"
