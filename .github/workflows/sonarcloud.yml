name: SonarCloud analysis

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']

permissions:
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'

      - name: Generate coverage report
        run: go test -timeout 600s -coverprofile=coverage.out -covermode=set ./...
        continue-on-error: true

      # web/ (ADR-070) coverage, feeding sonar.javascript.lcov.reportPaths in
      # sonar-project.properties — folded in here rather than kept as a
      # separate SonarCloud project/workflow. --ignore-scripts: see the
      # identical reasoning in web-ci.yml.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Generate web/ coverage report
        working-directory: web
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test:coverage --run
        continue-on-error: true

      # SonarCloud resolves lcov SF: paths relative to sonar.projectBaseDir
      # (this workflow's `.`, i.e. the repo root) -- vitest writes them
      # relative to wherever it ran (web/, via working-directory above), e.g.
      # `SF:src/App.tsx`. Left as-is, every one of those fails to match the
      # actual analyzed path (web/src/App.tsx) and JS coverage silently comes
      # out as zero. Rewrite in place before the scan reads it.
      - name: Fix web/ coverage report paths for SonarCloud
        run: sed -i 's|^SF:|SF:web/|' web/coverage/lcov.info
        if: hashFiles('web/coverage/lcov.info') != ''

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=keyorixhq_keyorix
            -Dsonar.organization=keyorixhq
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.qualitygate.wait=false
          projectBaseDir: .
