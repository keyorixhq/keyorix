name: Hadolint

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    # See ci.yml's own comment: also covers stacked-PR review chains.
    branches: [main, 'adr082/**', 'feat/**', 'fix/**']
    paths-ignore: ['**/*.md', 'docs/**']
  schedule:
    - cron: '26 12 * * 5'

permissions: {}

# Cancel superseded runs on the same ref (matches web-ci.yml's own convention):
# a later push/merge on the same branch makes an in-flight run's result moot
# before it even finishes.
concurrency:
  group: hadolint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Run hadolint on all Dockerfiles
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6
        with:
          recursive: true
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: true

      - name: Upload results
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: hadolint-results.sarif
          wait-for-processing: true
