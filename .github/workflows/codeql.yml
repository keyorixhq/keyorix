name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly deep scan: catches newly-published CodeQL query packs against
    # unchanged code, not just what a push/PR diff touches.
    - cron: '17 3 * * 1'

# Workflow-level default: read-only, except the one permission CodeQL's own
# upload step needs (security-events: write, to publish SARIF results to the
# repo's Security tab). Mirrors ci.yml's least-privilege convention (#115).
permissions:
  contents: read # NOSONAR githubactions:S8264 -- workflow-level read is intentional; job-level permissions further restrict (security-events:write only for the upload step)

env:
  GO_VERSION: '1.26.5'

jobs:
  analyze:
    name: Analyze (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Root module: server, CLI, operator excluded (its own module below).
          - name: server
            working-directory: .
            gowork: auto
          # The operator is a separate Go module (controller-runtime/client-go
          # kept out of the root go.work) — same reasoning as ci.yml's
          # dedicated `operator` job, so it needs its own CodeQL build+analyze
          # pass rather than being swept up by the root module's build.
          - name: operator
            working-directory: operator
            gowork: off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: go
          build-mode: manual
          # `+` appends to (doesn't replace) CodeQL's default Go query suite. The
          # custom pack (.github/codeql/go-queries) covers bug classes the default
          # suite doesn't: an io.Reader from an outbound client response or a stdin
          # parameter reaching json.NewDecoder unbounded, and a path-based
          # chmod/chown that follows an os.Lstat check on the same path (TOCTOU).
          # Applies to both matrix legs (server, operator) -- init always resolves
          # this path against the repo-root checkout, independent of each leg's
          # later build working-directory.
          queries: +./.github/codeql/go-queries

      - name: Build (${{ matrix.name }})
        working-directory: ${{ matrix.working-directory }}
        env:
          GOWORK: ${{ matrix.gowork }}
        run: |
          go build ./...
          go test -run=^$ ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: '/language:go-${{ matrix.name }}'

  # web/ (ADR-070) is JavaScript/TypeScript, not Go -- a separate job rather
  # than a third matrix entry above, since the Go entries' init/build/analyze
  # steps (build-mode: manual, `go build`+`go test -run=^$`) don't apply here
  # at all: JS/TS uses autobuild (no compile step to run) and its own
  # queries suite. Unconditional (no path filter), matching the two Go jobs
  # above -- this is a required-status-check-shaped workflow (see the
  # `summary` fan-in below); a workflow triggered by an unrelated path never
  # produces a check-run at all, which would leave that required check stuck
  # pending forever on a backend-only PR, so exhaustiveness here (always run)
  # is deliberate, not an oversight.
  analyze-web:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: javascript-typescript
          # security-and-quality includes all security queries plus
          # code-quality checks (dead code, error handling, etc.) -- matches
          # what web/'s own (now-superseded) codeql.yml used.
          queries: security-and-quality

      # JS/TS autobuild just discovers source files -- no compile step.
      - uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3

      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:javascript-typescript

  # Fan-in job that satisfies the "CodeQL" required status check in branch
  # protection. The matrix jobs above are each required too (Analyze (server)
  # and Analyze (operator)), but branch protection also requires a "CodeQL"
  # context which this single-name job provides.
  summary:
    name: CodeQL
    needs: [analyze, analyze-web]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check analysis results
        run: |
          if [ "${{ needs.analyze.result }}" != "success" ] || [ "${{ needs.analyze-web.result }}" != "success" ]; then
            echo "CodeQL analysis failed or was cancelled"
            exit 1
          fi
          echo "All CodeQL analyses passed"
