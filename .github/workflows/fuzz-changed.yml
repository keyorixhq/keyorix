# Lightweight regression fuzzing: on each PR, run native `go test -fuzz` briefly
# on the fuzz targets the PR actually affects, seeded from committed
# testdata/fuzz corpus. Deliberately NOT ClusterFuzzLite/libFuzzer — keyorix is
# pure-Go (memory-safe, CGO-free), so the libFuzzer+sanitizer path adds cost
# without benefit here. See claude/2026-09-13-fuzzing-tooling-decisions.md.
# Deep/continuous fuzzing lives on the dedicated rigs, not in CI.
#
# Selection tiers (narrowest change that still covers what could have broken):
#   - go.mod/go.sum changed (dependency churn): a dep bump changes third-party
#     parser behavior without touching any *.go in the target's package, and
#     those parsers are exactly what the targets exist to catch — so fuzz EVERY
#     fuzz-target package, all targets.
#   - any non-test *.go changed: shared production code in a package can affect
#     any target in it — so fuzz ALL targets in each changed package.
#   - only *_test.go changed (harness-only PR): the production code every OTHER
#     target exercises is unchanged, so only the harnesses you touched can behave
#     differently — fuzz ONLY the targets defined in the changed *_test.go files.
#     This is what keeps a 3-harness PR from re-running all 16 targets in
#     internal/core (16 x FUZZTIME, serial). Test files are package-local, so
#     this selection is provably complete for a test-only change.
name: fuzz-changed
#
# Execution: the planned targets are split round-robin across up to FUZZ_SHARDS
# parallel jobs (matrix). Each target still gets the full FUZZTIME; only the
# wall-clock changes (a 27-target PR went from ~45 min serial to ~1/6 of that).
# A final `fuzz-changed` job aggregates the shards so the check keeps one name.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: "Ref/SHA to diff against (default: HEAD~1). Lets a manual run reproduce a PR-sized plan."
        required: false
        default: ""
permissions:
  contents: read
# A new push to the same PR supersedes the previous run instead of stacking.
concurrency:
  group: fuzz-changed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  FUZZTIME: 90s   # per fuzz target
  FUZZ_SHARDS: 6  # max parallel fuzz jobs
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.shard.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Determine fuzz targets to run
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-$(git rev-parse HEAD~1)}"

          dep_changed=0
          if git diff --name-only "$base"...HEAD | grep -qE '^(go\.mod|go\.sum)$'; then
            dep_changed=1
          fi
          prod_go_changed=0
          if git diff --name-only "$base"...HEAD -- '*.go' | grep -vE '_test\.go$' | grep -q .; then
            prod_go_changed=1
          fi

          # emit "pkg|FuncName" for every real fuzz target in a package dir ($1 = ./dir)
          # `grep || true`: a changed package with NO fuzz targets (e.g. a production-code
          # fix touching server/ or a CLI pkg) makes grep match nothing and exit 1, which
          # under `set -o pipefail` would kill the whole planning step. Tolerate it — such a
          # package simply contributes no targets.
          emit_all_in_pkg() {
            # Capture first so a package that cannot be listed at all -- e.g. a dir whose only
            # .go file is `//go:build ignore` (a dev tool like scripts/fuzzing/autofuzzgen), or
            # a genuine build error caught loudly by build-and-test/lint -- contributes nothing
            # instead of killing this planning step under `set -o pipefail`. `local out=$(...)`
            # would mask the failure via the `local` builtin's own status, so assign separately.
            local out
            out="$(go test -list '^Fuzz' "$1" 2>/dev/null)" || return 0
            printf '%s\n' "$out" | { grep '^Fuzz' || true; } | while IFS= read -r fn; do
              printf '%s|%s\n' "$1" "$fn"
            done
          }

          plan_file="$(mktemp)"
          if [ "$dep_changed" = 1 ]; then
            echo "go.mod/go.sum changed — dependency churn: fuzzing ALL fuzz-target packages."
            git ls-files -- '*_test.go' | { xargs -r grep -lE '^func Fuzz' || true; } | xargs -r -n1 dirname | sort -u \
              | while IFS= read -r d; do emit_all_in_pkg "./${d#./}"; done >> "$plan_file"
          elif [ "$prod_go_changed" = 1 ]; then
            echo "Production .go changed — fuzzing ALL targets in each changed package."
            git diff --name-only "$base"...HEAD -- '*.go' | xargs -r -n1 dirname | sort -u \
              | while IFS= read -r d; do emit_all_in_pkg "./${d#./}"; done >> "$plan_file"
          else
            echo "Harness-only change — fuzzing ONLY the targets defined in changed *_test.go files."
            git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*_test.go' \
              | while IFS= read -r f; do
                  [ -f "$f" ] || continue
                  d="./$(dirname "$f")"
                  # targets defined in this file, intersected with real listed targets
                  defined="$(grep -oE '^func +Fuzz[A-Za-z0-9_]+' "$f" | awk '{print $2}' | sort -u || true)"
                  [ -n "$defined" ] || continue
                  listed="$(go test -list '^Fuzz' "$d" 2>/dev/null | grep '^Fuzz' | sort -u || true)"
                  comm -12 <(printf '%s\n' "$defined") <(printf '%s\n' "$listed") \
                    | while IFS= read -r fn; do printf '%s|%s\n' "$d" "$fn"; done
                done >> "$plan_file"
          fi

          sort -u "$plan_file" -o "$plan_file"
          count="$(grep -c . "$plan_file" || true)"
          echo "Planned $count fuzz target(s):"
          sed 's/^/  /' "$plan_file"
          {
            echo "plan<<__FUZZ_PLAN_EOF__"
            cat "$plan_file"
            echo "__FUZZ_PLAN_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Split plan into shards
        id: shard
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
        run: |
          set -euo pipefail
          count="$(printf '%s\n' "$PLAN" | grep -c . || true)"
          n=$(( count < FUZZ_SHARDS ? count : FUZZ_SHARDS ))
          if [ "$n" -lt 1 ]; then echo 'shards=[]' >> "$GITHUB_OUTPUT"; exit 0; fi
          shards="$(printf '%s\n' "$PLAN" | grep . | jq -R -s -c --argjson n "$n" '
            split("\n") | map(select(length > 0)) | to_entries
            | group_by(.key % $n)
            | map({id: (.[0].key % $n), targets: (map(.value) | join(" "))})')"
          echo "Shards: $shards"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    name: fuzz (shard ${{ matrix.shard.id }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Restore fuzz corpus cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}-${{ matrix.shard.id }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-
      - name: Fuzz shard targets
        env:
          TARGETS: ${{ matrix.shard.targets }}
        run: |
          set -euo pipefail
          for entry in $TARGETS; do
            pkg="${entry%%|*}"; fn="${entry#*|}"
            if [ -z "$pkg" ] || [ -z "$fn" ]; then continue; fi
            echo "::group::fuzz $fn ($pkg) for $FUZZTIME"
            go test "$pkg" -run='^$' -fuzz="^${fn}$" -fuzztime="$FUZZTIME"
            echo "::endgroup::"
          done
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers-shard-${{ matrix.shard.id }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  # Single, stable check name regardless of shard count (or zero targets).
  fuzz-changed:
    needs: [plan, fuzz]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate shard results
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          COUNT: ${{ needs.plan.outputs.count }}
        run: |
          echo "plan=$PLAN_RESULT fuzz=$FUZZ_RESULT targets=$COUNT"
          [ "$PLAN_RESULT" = "success" ] || exit 1
          case "$FUZZ_RESULT" in success|skipped) exit 0 ;; *) exit 1 ;; esac
