name: govulncheck (scheduled)

# ci.yml's static-analysis job already runs govulncheck on every push/PR that
# touches Go code -- but only then. Between two PRs that happen not to touch
# Go, a new entry could land in the vulnerability database (vuln.go.dev) for
# a symbol our code already calls, and nothing would notice until the next
# incidental Go change. This closes that gap the same way osv-scanner.yml
# already does for its own (different) database: a schedule-only run of the
# identical check, every 3 hours.
on:
  schedule:
    # Every 3 hours (minute 17: off the round minute, clear of the other
    # scheduled slots). Vulnerability DB entries land at any time of day, not
    # on a weekly rhythm: GO-2026-6859 (stdlib net/http, reachable through
    # CompleteSAML -> PostFormValue) was published 2026-11-11 02:51Z and went
    # unnoticed for ~10 h under the old weekly (Friday) cadence, until a
    # merge-queue build tripped over it. A security product should find that
    # itself within hours.
    #
    # osv-scanner.yml deliberately keeps its own weekly cadence: a different
    # database with a different feed and a much heavier run (a reusable
    # workflow that uploads SARIF), so it does not share this reason.
    #
    # Cost: the job is cheap (cached govulncheck binary; the last scheduled
    # runs took ~2 min wall clock end to end, govulncheck job plus alert job),
    # so 8 runs/day is roughly 25 runner-minutes/day (Linux, per-job rounding
    # up to whole minutes).
    - cron: '17 */3 * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'

      - name: Cache govulncheck binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/govulncheck
          # Deliberately its own cache key, not shared with ci.yml's
          # static-analysis job -- see that job's identical rationale for its
          # own gosec cache key (a save-step race between two jobs sharing
          # one key can silently drop a path neither job re-populates).
          key: govulncheck-scheduled-v1.8.0-${{ runner.os }}

      # Intentionally the EXACT SAME two lines as ci.yml's static-analysis
      # job's own govulncheck step, not a paraphrase: install, then
      # scripts/ci/check-govulncheck.sh (added 2026-11-06, NEEDS ANDREI note
      # in reports/SESSION-REVFIX-3972-4.md -- a bare `govulncheck ./...` has
      # no exclusion mechanism, and GO-2026-6909 has no fixed version). That
      # script replicates govulncheck's own pass/fail rule exactly (a finding
      # is call-graph-reachable, and so blocking, the moment any of its trace
      # entries has more than one frame -- see the script's header for how
      # that was confirmed against this repo's own output) and additionally
      # passes a reachable finding only when docs/govulncheck-exceptions.d/
      # carries a row for its exact ID. Running the identical invocation
      # means this scheduled job inherits that exact rule too: it cannot be
      # red on arrival where the PR-gated job is green, and a real newly-
      # reachable, non-allowlisted finding fails here exactly as it would on
      # a PR.
      - name: govulncheck
        run: |
          [ -x ~/go/bin/govulncheck ] || go install golang.org/x/vuln/cmd/govulncheck@v1.8.0 # NOSONAR githubactions:S8545 -- version is pinned to v1.8.0
          scripts/ci/check-govulncheck.sh

  # Before 2026-09-28 a red scheduled run alerted nobody. Same one-issue-per-
  # job mechanism as e2e-nightly.yml. This job runs every 3 hours, so repeated
  # reds must not become 8 comments a day: failure-issue.sh updates the one
  # open issue, and FAILURE_ISSUE_MIN_COMMENT_HOURS limits its "Failed again"
  # comments to at most one per 24 h (the issue opens on the first red and
  # closes on the first green).
  alert:
    needs: [govulncheck]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open, update or close the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURE_ISSUE_MIN_COMMENT_HOURS: '24'
          OUTCOME: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
        run: ./scripts/ci/failure-issue.sh "$OUTCOME" "Scheduled govulncheck is failing"
