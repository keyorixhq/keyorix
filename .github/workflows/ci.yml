name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: type-check · lint · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # `test` is bare `vitest` (watch mode); --run forces a single pass.
      - name: Test
        run: pnpm test --run

      # Verifies all production dependency licenses are permissive (MIT, Apache-2.0,
      # BSD variants, ISC).  Blocks any accidental GPL/AGPL/LGPL ingestion that
      # would require open-sourcing Keyorix's product code.  Uses pnpm's built-in
      # `licenses list` command — no external tool needed.
      - name: Check dependency licenses
        run: node scripts/license-check.mjs

      # Fails on high/critical known-vulnerable dependencies (govulncheck's
      # equivalent for the npm ecosystem, mirrored from keyorix's CI). Scoped to
      # --prod: dev-only tooling (jsdom/vitest's undici chain) never ships and
      # would make this gate noisy with findings that carry no real exposure.
      # Pipes through scripts/audit-check.mjs so known non-applicable advisories
      # (react-router RSC-mode CVE, not reachable in SPA builds) can be suppressed
      # without silently ignoring all findings.
      - name: Audit dependencies
        run: pnpm audit --json --prod | node scripts/audit-check.mjs

  e2e:
    name: e2e (Playwright)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Chromium-only (playwright.config.ts) to keep this job fast.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  gitleaks:
    runs-on: ubuntu-latest
    env:
      # Pinned + checksum-verified, mirroring keyorix's ci.yml — the tool that
      # scans for leaked secrets is itself a supply-chain surface.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: gitleaks (full history)
        run: |
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          tar -xz -f "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --verbose --redact
