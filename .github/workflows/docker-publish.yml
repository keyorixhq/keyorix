# Builds the Keyorix container images and publishes them to GHCR: the API server
# (self-host docker-compose) and the Kubernetes sync agent (keyorix-k8s-sync).
name: docker-publish

on:
  push:
    branches: [main]
    tags: ['v*']
    # GitHub does not evaluate path filters for tag pushes at all ("Path filters
    # are not evaluated for pushes of tags" -- GitHub Actions docs), so this only
    # constrains the branches:[main] case above: a docs-only merge to main no
    # longer triggers a full 5-image build+push+SBOM+cosign-sign pipeline. A real
    # `v*` release tag always runs this workflow regardless of what it touches.
    paths-ignore: ['**/*.md', 'docs/**']

# Lock down GITHUB_TOKEN defaults: no permissions at the top level; each job
# below requests only what it needs (packages/id-token for image publish).
permissions: {}

env:
  # Pinned, checksum-verified (mirrors gitleaks in ci.yml) — the tool that scans
  # our images for vulnerabilities is itself a supply-chain surface.
  TRIVY_VERSION: 0.72.0
  TRIVY_LINUX_64BIT_SHA256: bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for cosign's keyless (OIDC) signing — no long-lived signing key
      # is stored as a secret; GitHub's OIDC token proves this exact workflow run
      # produced the image, and Sigstore's transparency log makes that provable
      # after the fact (#115).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance/sbom attestations below require the docker-container driver;
      # the runner's default `docker` driver doesn't support them and fails the
      # build with "Attestation is not supported for the docker driver."
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/keyorixhq/keyorix-server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: server/Dockerfile
          push: true
          # BuildKit-native SBOM + provenance attestations (#115) — pushed to GHCR
          # alongside the image, independent of the cosign signature below.
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache backend, scoped per image so the 5 images in
          # this workflow don't evict each other's layers under a shared
          # default scope.
          cache-from: type=gha,scope=keyorix-server
          cache-to: type=gha,mode=max,scope=keyorix-server

      # Cached across runs by TRIVY_VERSION — a version bump naturally busts
      # the cache and re-downloads+re-verifies the checksum.
      - name: Cache Trivy binary
        id: trivy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: trivy
          key: trivy-${{ env.TRIVY_VERSION }}-${{ runner.os }}

      - name: Download Trivy
        if: steps.trivy-cache.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_LINUX_64BIT_SHA256}  trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | sha256sum -c -
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy

      # Scans the pushed image DIGEST before it's signed, so a signature only
      # ever attests to an image that's already cleared this gate.
      - name: Scan image for vulnerabilities (trivy)
        run: ./trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "ghcr.io/keyorixhq/keyorix-server@${{ steps.build.outputs.digest }}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.10.0

      # Signs the image DIGEST (not a mutable tag) keylessly: cosign requests a
      # short-lived certificate from Sigstore's Fulcio CA bound to this workflow's
      # OIDC identity, and records the signature in the public Rekor transparency
      # log — no signing key to provision, rotate, or leak (#115).
      - name: Sign image (keyless)
        run: cosign sign --yes "ghcr.io/keyorixhq/keyorix-server@${{ steps.build.outputs.digest }}"

  # The Kubernetes sync agent image (keyorix-k8s-sync), published alongside the server.
  build-and-push-k8s-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance/sbom attestations below require the docker-container driver;
      # the runner's default `docker` driver doesn't support them and fails the
      # build with "Attestation is not supported for the docker driver."
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/keyorixhq/keyorix-k8s-sync
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: cmd/keyorix-k8s-sync/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=keyorix-k8s-sync
          cache-to: type=gha,mode=max,scope=keyorix-k8s-sync

      - name: Cache Trivy binary
        id: trivy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: trivy
          key: trivy-${{ env.TRIVY_VERSION }}-${{ runner.os }}

      - name: Download Trivy
        if: steps.trivy-cache.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_LINUX_64BIT_SHA256}  trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | sha256sum -c -
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy

      - name: Scan image for vulnerabilities (trivy)
        run: ./trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "ghcr.io/keyorixhq/keyorix-k8s-sync@${{ steps.build.outputs.digest }}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.10.0

      - name: Sign image (keyless)
        run: cosign sign --yes "ghcr.io/keyorixhq/keyorix-k8s-sync@${{ steps.build.outputs.digest }}"

  # The Kubernetes operator image (keyorix-operator). It is a separate Go module, so its
  # build context is the operator/ directory (not the repo root).
  build-and-push-operator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance/sbom attestations below require the docker-container driver;
      # the runner's default `docker` driver doesn't support them and fails the
      # build with "Attestation is not supported for the docker driver."
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/keyorixhq/keyorix-operator
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: operator
          file: operator/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=keyorix-operator
          cache-to: type=gha,mode=max,scope=keyorix-operator

      - name: Cache Trivy binary
        id: trivy-cache
