      - name: Sign image (keyless)
        run: cosign sign --yes "ghcr.io/keyorixhq/keyorix-operator@${{ steps.build.outputs.digest }}"

  # The MCP server image (keyorix-mcp) — read-only Keyorix access for AI agents over
  # stdio. Published alongside the server.
  build-and-push-mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance/sbom attestations below require the docker-container driver;
      # the runner's default `docker` driver doesn't support them and fails the
      # build with "Attestation is not supported for the docker driver."
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/keyorixhq/keyorix-mcp
          tags: |
