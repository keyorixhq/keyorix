name: Semgrep

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    # See ci.yml's own comment: also covers stacked-PR review chains.
    branches: [main, 'adr082/**', 'feat/**', 'fix/**']
    paths-ignore: ['**/*.md', 'docs/**']
  schedule:
    - cron: '34 7 * * 4'

permissions: {}

# Cancel superseded runs on the same ref (matches web-ci.yml's own convention):
# a later push/merge on the same branch makes an in-flight run's result moot
# before it even finishes.
concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Run Semgrep (repo-specific custom rules — blocking)
        # .semgrep/keyorix-rules.yml catches patterns specific to this repo that the
        # community ruleset has no way to know about, each modeled directly on a real
        # historical fix and validated (before being added) to have zero findings on
        # main and to fire on that fix's pre-fix code. WARNING/ERROR severity only. A
        # new rule must be verified zero-noise against main (and any pre-existing
        # findings fixed or annotated with `// nosemgrep: <rule-id> -- <reason>`)
        # before being added here -- that verification is what makes blocking safe;
        # skipping it turns this gate into exactly the noisy, ignored check the
        # non-blocking community scan below is. Structural "every match is expected,
        # old and new" rules do NOT belong in this file -- see .semgrep/keyorix-nudges.yml.
        run: semgrep scan --config=.semgrep/keyorix-rules.yml --severity=WARNING --severity=ERROR --error --quiet

      - name: Run Semgrep (community rules + repo-specific custom rules — advisory)
        # Full run (including --config=auto) for the Security tab's SARIF upload.
        # Non-blocking: the community ruleset hasn't been through the same per-rule
        # triage as .semgrep/keyorix-rules.yml above, so a false positive here
        # shouldn't fail the build. Deliberately excludes .semgrep/keyorix-nudges.yml --
        # those rules match every occurrence of a pattern by design (old and new) and
        # must never be uploaded as SARIF/code-scanning alerts, see that file's header.
        if: always()
        run: semgrep scan --config=auto --config=.semgrep/keyorix-rules.yml --sarif --output=semgrep.sarif . || true

      - name: Upload results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: semgrep.sarif
        if: always()

      - name: Fetch PR base for diff-scoped nudge rules
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Run Semgrep (structural nudge rules — PR summary only, never uploaded)
        # .semgrep/keyorix-nudges.yml rules are expected to match every existing
        # occurrence of a pattern, so --baseline-commit restricts this to lines
        # actually introduced by this PR -- giving each rule its intended UX (a nudge
        # on NEW matches) instead of re-surfacing the entire existing inventory.
        if: github.event_name == 'pull_request'
        run: |
          semgrep scan --config=.semgrep/keyorix-nudges.yml \
            --baseline-commit="$BASE_SHA" \
            --text >> "$GITHUB_STEP_SUMMARY" || true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
