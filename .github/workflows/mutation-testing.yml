name: Mutation Testing

on:
  schedule:
    # Weekly, staggered against the other scheduled scanners (see cron times
    # across .github/workflows/*.yml) so they don't all contend for runners
    # at once.
    - cron: '22 5 * * 2'
  workflow_dispatch: {}

permissions: {}

jobs:
  mutate:
    runs-on: ubuntu-latest
    # Mutation testing re-runs the target package's test suite once per
    # surviving mutant -- on internal/core (a large, heavily-tested package)
    # this is genuinely slow, unlike every other scanner in this repo. A
    # generous ceiling, not a tight one; this job is scheduled/advisory, not
    # a PR gate, so runtime cost is traded for depth deliberately.
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      # Scoped to internal/core and internal/storage/store -- where this
      # repo's security-critical business logic and the storage-layer CAS/
      # expiry-filter invariants live (see .semgrep/RULE-MINING-PROCESS.md
      # for the fix history that motivated this). Coverage % alone can't
      # distinguish "this branch is exercised" from "this branch's outcome
      # is actually asserted" -- a mutant that survives (LIVED) despite
      # covered code is exactly that gap: the test runs the line but
      # wouldn't fail if its logic were subtly wrong (a flipped comparison,
      # an off-by-one, a swapped boolean).
      #
      # Not repo-wide: mutation testing cost scales with mutants x per-mutant
      # test-suite runtime, and a full-repo run would blow well past any
      # reasonable CI budget for the packages that matter least (CLI
      # plumbing, web, generated code). Widen this list deliberately, one
      # package at a time, if/when the two below are in good shape.
      - name: Run mutation testing (internal/core)
        if: always()
        run: |
          gremlins unleash --workers 4 -o mutation-core.json ./internal/core || true

      - name: Run mutation testing (internal/storage/store)
        if: always()
        run: |
          gremlins unleash --workers 4 -o mutation-storage-store.json ./internal/storage/store || true

      - name: Summarize results
        if: always()
        run: |
          for f in mutation-core.json mutation-storage-store.json; do
            [ -f "$f" ] || continue
            echo "## $f" >> "$GITHUB_STEP_SUMMARY"
            python3 - "$f" >> "$GITHUB_STEP_SUMMARY" <<'PYEOF'
          import json, sys
          from collections import Counter
          with open(sys.argv[1]) as fh:
              data = json.load(fh)
          counts = Counter()
          lived = []
          for file in data.get("files", []):
              for m in file.get("mutations", []):
                  counts[m["status"]] += 1
                  if m["status"] == "LIVED":
                      lived.append(f"{file['file_name']}:{m['line']} ({m['type']})")
          total = sum(counts.values())
          killed = counts.get("KILLED", 0)
          died = counts.get("LIVED", 0)
          efficacy = (killed / (killed + died) * 100) if (killed + died) else 0
          print(f"- Total mutants: {total}")
          for status, n in sorted(counts.items()):
              print(f"- {status}: {n}")
          print(f"- Test efficacy (killed / (killed+lived)): {efficacy:.1f}%")
          if lived:
              print("\n**Surviving mutants** (a test covers this line but wouldn't fail if the logic were subtly wrong):")
              for loc in lived[:50]:
                  print(f"- `{loc}`")
              if len(lived) > 50:
                  print(f"- ... and {len(lived) - 50} more (see the uploaded JSON artifact)")
          PYEOF
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-testing-results
          path: mutation-*.json
          retention-days: 90
