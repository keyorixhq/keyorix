name: E2E smoke (nightly)

# The slow / flake-prone fresh-install legs from Session I (2026-09-28): the
# PostgreSQL backend, the in-place upgrade from the previous release binary,
# and the real-backend web UI. The fast SQLite leg is NOT here: it gates
# every merge-queue group in ci.yml's e2e-smoke job instead, so the class of
# bug it exists for (features that 500 on a freshly migrated database, e.g.
# the 7 never-migrated tables fixed in #2258) is blocked before merge rather
# than reported the morning after.
#
# Failure alerting: one GitHub issue per workflow (scripts/ci/failure-issue.sh)
# -- opened on the first red night, commented on each later red night, closed
# automatically by the next green one. No webhook or secret: GitHub's own
# email / mobile notifications deliver it.
on:
  schedule:
    # 03:23 UTC nightly, off the round minute.
    - cron: '23 3 * * *'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  e2e-smoke-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keyorix
          POSTGRES_PASSWORD: keyorix-e2e
          POSTGRES_DB: keyorix
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KEYORIX_TEST_PG_DSN: "host=localhost port=5432 dbname=keyorix user=keyorix sslmode=disable password=keyorix-e2e"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - name: Fresh-install API smoke (PostgreSQL)
        run: make e2e-smoke-postgres

  e2e-smoke-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      # Downloads the previous release's public server binary over HTTPS.
      - name: Upgrade path (previous release -> HEAD, same database)
        run: make e2e-smoke-upgrade

  e2e-web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # --ignore-scripts: same supply-chain rationale as web-ci.yml.
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright browser
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Real-backend web UI smoke
        run: make e2e-web-smoke

  alert:
    needs: [e2e-smoke-postgres, e2e-smoke-upgrade, e2e-web-smoke]
    # Always report, but only for runs on main (a manual dispatch on a
    # feature branch must not open or close the main-branch issue).
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open, update or close the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
        run: ./scripts/ci/failure-issue.sh "$OUTCOME" "Nightly E2E smoke is failing"
