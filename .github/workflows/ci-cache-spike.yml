# THROWAWAY (CI-CACHE-SPIKE-1), run 3: validates the production wiring on this
# branch (entries are branch-scoped, invisible to main and the queue).
# seed:       go-race-cache.yml's steps verbatim (minus its main-only if:).
# seed-again: the same steps once more; must find today's key and skip.
# leg:        ci.yml test-suite's setup-go + "Restore -race -cover build cache"
#             step verbatim, then compile+link the leg (-exec true) and print
#             a SPIKE| line (hit rate from the action graph).
name: CI cache spike (throwaway)

on:
  push:
    branches: ['ci-cache-spike-1/**']

permissions: {}

jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Cache key for today
        id: key
        env:
          GO_VERSION: ${{ steps.setup-go.outputs.go-version }}
          GO_SUM: ${{ hashFiles('go.sum') }}
        run: |
          key="go-race-cover-v1-${RUNNER_OS}-go${GO_VERSION}-${GO_SUM}-$(date -u +%Y%m%d)"
          echo "Cache key: $key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Look up today's entry
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Already seeded today
        if: steps.lookup.outputs.cache-hit == 'true'
        run: echo "Today's -race -cover cache (${{ steps.key.outputs.key }}) already exists; nothing to do."
      - name: Download modules
        if: steps.lookup.outputs.cache-hit != 'true'
        run: go mod download
      - name: Compile every test-suite leg (-race -cover, no tests run)
        if: steps.lookup.outputs.cache-hit != 'true'
        run: scripts/ci/seed-race-cache.sh
      - name: Save
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.key.outputs.key }}

  seed-again:
    needs: seed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Cache key for today
        id: key
        env:
          GO_VERSION: ${{ steps.setup-go.outputs.go-version }}
          GO_SUM: ${{ hashFiles('go.sum') }}
        run: |
          key="go-race-cover-v1-${RUNNER_OS}-go${GO_VERSION}-${GO_SUM}-$(date -u +%Y%m%d)"
          echo "Cache key: $key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Look up today's entry
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Already seeded today
        if: steps.lookup.outputs.cache-hit == 'true'
        run: echo "Today's -race -cover cache (${{ steps.key.outputs.key }}) already exists; nothing to do."
      - name: Must have skipped
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          echo "::error::seed-again did not find the entry the seed job just saved"
          exit 1

  leg:
    needs: seed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        leg: [core-2, server-2, root-4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Restore -race -cover build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-race-cover-v1-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-restore-only
          restore-keys: |
            go-race-cover-v1-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-race-cover-v1-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-
      - name: Compile ${{ matrix.leg }} (production restore)
        run: bash scripts/ci/spike/measure.sh warm-prod ${{ matrix.leg }}
