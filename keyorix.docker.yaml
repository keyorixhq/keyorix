environment: production
server:
  http:
    enabled: true
    port: "8080"
storage:
  type: postgres
  database:
    host: postgres
    port: "5432"
    name: keyorix
    user: keyorix
    ssl_mode: disable
    # Password comes from KEYORIX_DB_PASSWORD (set in .env), never committed here.
  encryption:
    enabled: true
    # The wrapped DEK + KEK salt live on the persisted `keys` volume (see
    # docker-compose.yml). These MUST survive restarts — losing them, or changing
    # KEYORIX_MASTER_PASSWORD, makes every stored secret undecryptable.
    dek_path: "/app/keys/data.key"
    salt_path: "/app/keys/kek.salt"
