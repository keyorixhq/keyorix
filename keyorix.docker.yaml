environment: production
server:
  http:
    enabled: true
    port: "8080"
storage:
  type: postgres
  database:
    host: postgres
    port: "5432"
    name: keyorix
    user: keyorix
    # prefer: uses TLS when the postgres server supports it (default for docker-compose
    # where the server runs on an internal Docker network without server certs). For
    # production deployments with a managed or externally-reachable postgres, set this
    # to verify-full and supply sslrootcert/sslcert/sslkey. Never use disable in prod.
    ssl_mode: prefer
    # Password comes from KEYORIX_DB_PASSWORD (set in .env), never committed here.
  encryption:
    enabled: true
    # The wrapped DEK + KEK salt live on the persisted `keys` volume (see
    # docker-compose.yml). These MUST survive restarts — losing them, or changing
    # KEYORIX_MASTER_PASSWORD, makes every stored secret undecryptable.
    dek_path: "/app/keys/data.key"
    salt_path: "/app/keys/kek.salt"
