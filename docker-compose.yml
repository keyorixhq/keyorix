# Keyorix self-hosted stack: web UI + API server + PostgreSQL.
#
#   1. cp .env.example .env   and fill in the (required) passwords
#   2. docker compose up -d
#   3. open http://localhost:8088  and log in with the admin you set in .env
#
# All secrets come from .env — there are NO baked-in default passwords. See
# docs/SELF_HOSTING.md for production hardening (TLS, backups, upgrades).
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keyorix
      POSTGRES_USER: keyorix
      POSTGRES_PASSWORD: ${KEYORIX_DB_PASSWORD:?KEYORIX_DB_PASSWORD is required (see .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyorix"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/keyorixhq/keyorix-server:latest
    # To build from source instead of pulling the published image, comment out
    # `image:` above and uncomment:
    # build:
    #   context: .
    #   dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      KEYORIX_DB_PASSWORD: ${KEYORIX_DB_PASSWORD:?KEYORIX_DB_PASSWORD is required}
      # Master passphrase for the encryption KEK. REQUIRED. Changing it after
      # first boot makes all stored secrets undecryptable.
      KEYORIX_MASTER_PASSWORD: ${KEYORIX_MASTER_PASSWORD:?KEYORIX_MASTER_PASSWORD is required}
      # Optional first-boot admin bootstrap (idempotent). Omit to initialise
      # manually with `keyorix system init`.
      KEYORIX_ADMIN_USERNAME: ${KEYORIX_ADMIN_USERNAME:-admin}
      KEYORIX_ADMIN_EMAIL: ${KEYORIX_ADMIN_EMAIL:-admin@keyorix.local}
      KEYORIX_ADMIN_PASSWORD: ${KEYORIX_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./keyorix.docker.yaml:/app/keyorix.yaml:ro
      # The encryption keys (wrapped DEK + KEK salt) MUST persist across restarts.
      - keyorix_keys:/app/keys

  web:
    image: ghcr.io/keyorixhq/keyorix-web:latest
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - backend

  # Optional HTTPS front-end. Enable with `docker compose --profile tls up -d`.
  # Caddy terminates TLS and proxies to web. Set KEYORIX_DOMAIN to a real domain
  # (with 80/443 reachable + DNS pointing here) for an automatic, publicly-trusted
  # certificate; the default `localhost` uses Caddy's internal CA. See
  # docs/SELF_HOSTING.md §7. When using this, don't also expose web's 8088 publicly.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      KEYORIX_DOMAIN: ${KEYORIX_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist issued certificates so restarts don't re-request them (ACME has
      # rate limits).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  keyorix_keys:
  caddy_data:
  caddy_config:
