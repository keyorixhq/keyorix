# Keyorix Production Configuration with Web Dashboard
# This configuration is optimized for production deployment

environment: "production"

locale:
  language: "en"
  fallback_language: "en"

server:
  http:
    enabled: true
    port: "8080"
    protocol_versions: ["1.1", "2.0"]
    swagger_enabled: false  # Disable in production for security
    # Web dashboard settings
    web_assets_path: "/app/web/dist"
    domain: "${KEYORIX_DOMAIN:-localhost}"
    allowed_origins:
      - "https://${KEYORIX_DOMAIN:-localhost}"
      - "https://www.${KEYORIX_DOMAIN:-localhost}"
    tls:
      enabled: false  # TLS handled by reverse proxy
      auto_cert: false
    ratelimit:
      enabled: true
      requests_per_second: 50
      burst: 100
  grpc:
    enabled: true
    port: "9090"
    protocol_versions: ["2.0"]
    reflection_enabled: false  # Disable in production
    tls:
      enabled: false  # TLS handled by reverse proxy
    ratelimit:
      enabled: true
      requests_per_second: 25
      burst: 50

storage:
  type: "local"  # options: local (SQLite), postgres, remote
  database:
    path: "/app/data/keyorix.db"
    # PostgreSQL (recommended for production):
    # type: postgres
    # dsn: "host=localhost user=keyorix dbname=keyorix port=5432 sslmode=require"
    # password: ""  # use KEYORIX_DB_PASSWORD environment variable instead
    max_open_conns: 25
    max_idle_conns: 5
    conn_max_lifetime_minutes: 30
  encryption:
    enabled: true
    dek_path: "/app/keys/data.key"
    salt_path: "/app/keys/kek.salt"

secrets:
  chunking:
    enabled: true
    max_chunk_size_kb: 64
    max_chunks_per_secret: 100
  limits:
    max_secrets_per_user: 10000

security:
  enable_file_permission_check: true
  auto_fix_file_permissions: true
  allow_unsafe_file_permissions: false
  # #G37: this file's server.http/grpc.tls.enabled are false above because TLS is
  # expected to be terminated by the reverse proxy in front (see comments there) —
  # so require_transport_tls stays false here too; forcing it true would make the
  # app refuse to start behind that exact, intended topology. If you are NOT
  # terminating TLS at a proxy in front of this listener, set both tls.enabled AND
  # this to true so an accidental cleartext-only deployment fails closed instead of
  # only logging a startup warning.
  require_transport_tls: false

soft_delete:
  enabled: true
  retention_days: 90  # Longer retention in production

purge:
  enabled: true
  schedule: "168h"  # Go duration between runs (NOT cron); 168h = weekly. Default 24h.