syntax = "proto3";

package keyorix.v1;

option go_package = "github.com/keyorixhq/keyorix/server/proto/pb";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// Secret service for managing secrets
service SecretService {
  // Create a new secret
  rpc CreateSecret(CreateSecretRequest) returns (Secret);

  // Get a secret by ID (optionally including the decrypted value)
  rpc GetSecret(GetSecretRequest) returns (Secret);

  // Get a secret's decrypted value (counts against max_reads if set)
  rpc GetSecretValue(GetSecretRequest) returns (SecretValue);

  // Update an existing secret (a new value creates a new version)
  rpc UpdateSecret(UpdateSecretRequest) returns (Secret);

  // Delete a secret
  rpc DeleteSecret(DeleteSecretRequest) returns (google.protobuf.Empty);

  // List secrets with filtering and pagination
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);

  // Get a secret's version history
  rpc GetSecretVersions(GetSecretVersionsRequest) returns (GetSecretVersionsResponse);

  // Enable/disable automated rotation for a secret and set its generated-value shape
  // (ADR-046). Requires scoped secrets.write.
  rpc SetSecretAutoRotate(SetSecretAutoRotateRequest) returns (google.protobuf.Empty);
}

// Share service for managing secret sharing
service ShareService {
  // Share a secret with another user or group
  rpc ShareSecret(ShareSecretRequest) returns (ShareRecord);

  // List shares for a secret
  rpc ListSecretShares(ListSecretSharesRequest) returns (ListSharesResponse);

  // List shares created by the calling user
  rpc ListUserShares(ListUserSharesRequest) returns (ListSharesResponse);

  // List secrets shared with the calling user
  rpc ListSharedSecrets(ListSharedSecretsRequest) returns (ListSecretsResponse);

  // Update share permissions
  rpc UpdateSharePermission(UpdateSharePermissionRequest) returns (ShareRecord);

  // Revoke a share
  rpc RevokeShare(RevokeShareRequest) returns (google.protobuf.Empty);
}

// User service for managing users
service UserService {
  // Create a new user (optionally with a system role + project assignments)
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  // Get a user by ID
  rpc GetUser(GetUserRequest) returns (User);

  // Update an existing user
  rpc UpdateUser(UpdateUserRequest) returns (User);

  // Soft-delete a user
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty);

  // List users with filtering and pagination
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
}

// Role service for managing roles and assignments
service RoleService {
  // Create a new role with its permission set
  rpc CreateRole(CreateRoleRequest) returns (Role);

  // Get a role (with its permissions) by ID
  rpc GetRole(GetRoleRequest) returns (Role);

  // Update a role's description and/or permission set
  rpc UpdateRole(UpdateRoleRequest) returns (Role);

  // Delete a role (built-in roles cannot be deleted)
  rpc DeleteRole(DeleteRoleRequest) returns (google.protobuf.Empty);

  // List roles (with their permissions) and pagination
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);

  // Assign a role to a user, optionally scoped to a project/environment
  rpc AssignRole(AssignRoleRequest) returns (RoleAssignment);

  // Remove a role assignment from a user
  rpc RemoveRole(RemoveRoleRequest) returns (google.protobuf.Empty);

  // Get all roles assigned to a user
  rpc GetUserRoles(GetUserRolesRequest) returns (GetUserRolesResponse);
}

// Audit service for reading audit logs
service AuditService {
  // Read the audit log with filtering and pagination
  rpc GetAuditLogs(GetAuditLogsRequest) returns (GetAuditLogsResponse);

  // Read RBAC-specific audit events
  rpc GetRBACAuditLogs(GetRBACAuditLogsRequest) returns (GetRBACAuditLogsResponse);

  // Stream audit events as they occur
  rpc StreamAuditLogs(StreamAuditLogsRequest) returns (stream AuditLog);
}

// System service for health, info, and metrics
service SystemService {
  // Liveness/readiness check
  rpc HealthCheck(google.protobuf.Empty) returns (HealthResponse);

  // Static + runtime system information
  rpc GetSystemInfo(google.protobuf.Empty) returns (SystemInfo);

  // Operational metrics snapshot
  rpc GetMetrics(google.protobuf.Empty) returns (Metrics);
}

// ---------------------------------------------------------------------------
// Secret messages
// ---------------------------------------------------------------------------

message Secret {
  uint32 id = 1;
  string name = 2;
  uint32 project_id = 3;
  uint32 environment_id = 4;
  // Human-readable names, populated on list/get where resolved.
  string project_name = 5;
  string environment_name = 6;
  string type = 7;
  optional int32 max_reads = 8;
  optional google.protobuf.Timestamp expiration = 9;
  map<string, string> metadata = 10;
  repeated string tags = 11;
  string status = 12;
  string created_by = 13;
  uint32 owner_id = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  // Sharing context relative to the calling user (populated on list).
  bool is_shared = 17;
  bool is_owned_by_user = 18;
  string user_permission = 19; // "read" | "write" | ""
  uint32 share_count = 20;
}

message SecretValue {
  uint32 id = 1;
  string name = 2;
  string value = 3;
  uint32 version_number = 4;
  uint32 read_count = 5;
}

message CreateSecretRequest {
  string name = 1;
  string value = 2;
  uint32 project_id = 3;
  uint32 environment_id = 4;
  string type = 5;
  optional int32 max_reads = 6;
  optional google.protobuf.Timestamp expiration = 7;
  map<string, string> metadata = 8;
  repeated string tags = 9;
}

message GetSecretRequest {
  uint32 id = 1;
  bool include_value = 2;
}

message UpdateSecretRequest {
  uint32 id = 1;
  // A non-empty value rotates the secret to a new version.
  optional string value = 2;
  optional int32 max_reads = 3;
  optional google.protobuf.Timestamp expiration = 4;
  map<string, string> metadata = 5;
  repeated string tags = 6;
}

message DeleteSecretRequest {
  uint32 id = 1;
}

message ListSecretsRequest {
  optional uint32 project_id = 1;
  optional uint32 environment_id = 2;
  optional string type = 3;
  optional string search = 4;
  // "read" | "write" — filter to secrets the user holds this permission on.
  optional string permission = 5;
  bool show_owned_only = 6;
  bool show_shared_only = 7;
  uint32 page = 8;
  uint32 page_size = 9;
}

message ListSecretsResponse {
  repeated Secret secrets = 1;
  uint32 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
  uint32 total_pages = 5;
  uint32 owned_count = 6;
  uint32 shared_count = 7;
}

message GetSecretVersionsRequest {
  uint32 id = 1;
}

message SetSecretAutoRotateRequest {
  uint32 id = 1;
  bool enabled = 2;
  int32 length = 3;  // 0 = default
  string charset = 4; // "" = default alphanumeric
  string backend = 5; // "" = regenerate in Keyorix only (ADR-047)
  string ref = 6;     // upstream identifier (required iff backend set)
}

message SecretVersion {
  uint32 version_number = 1;
  google.protobuf.Timestamp created_at = 2;
  uint32 read_count = 3;
}

message GetSecretVersionsResponse {
  repeated SecretVersion versions = 1;
}

// ---------------------------------------------------------------------------
// User messages
// ---------------------------------------------------------------------------

message User {
  uint32 id = 1;
  string username = 2;
  string email = 3;
  string display_name = 4;
  bool active = 5;
  string account_state = 6; // active | pending_first_login | password_reset_required | suspended
  optional google.protobuf.Timestamp last_login_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  uint32 project_count = 10;
  uint32 active_project_count = 11;
}

// A project-scoped role grant applied atomically at user creation.
message ProjectAssignment {
  uint32 project_id = 1;
  string role = 2;
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
  // Exactly one credential mode: password, deliver_setup_link, or
  // generate_one_time_password.
  optional string password = 3;
  bool deliver_setup_link = 4;
  bool generate_one_time_password = 5;
  optional string display_name = 6;
  optional bool is_active = 7;
  optional string account_state = 8;
  // System role + atomic project assignments (ADR-028).
  optional string role = 9;
  repeated ProjectAssignment project_assignments = 10;
}

message CreateUserResponse {
  User user = 1;
  // Out-of-band credential artifacts, set only for the matching mode.
  optional string setup_link = 2;
  optional string one_time_password = 3;
}

message GetUserRequest {
  uint32 id = 1;
}

message UpdateUserRequest {
  uint32 id = 1;
  optional string username = 2;
  optional string email = 3;
  optional string display_name = 4;
  optional bool active = 5;
}

message DeleteUserRequest {
  uint32 id = 1;
}

message ListUsersRequest {
  uint32 page = 1;
  uint32 page_size = 2;
  optional string search = 3;
  optional bool is_active = 4;
  bool include_deleted = 5;
  // "inactive" = users with no login in the last 30 days.
  optional string filter = 6;
}

message ListUsersResponse {
  repeated User users = 1;
  uint32 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
  uint32 total_pages = 5;
}

// ---------------------------------------------------------------------------
// Role messages
// ---------------------------------------------------------------------------

message Permission {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  string resource = 4;
  string action = 5;
}

message Role {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  repeated Permission permissions = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message CreateRoleRequest {
  string name = 1;
  string description = 2;
  // Named permission strings, e.g. "secrets.read".
  repeated string permissions = 3;
}

message GetRoleRequest {
  uint32 id = 1;
}

message UpdateRoleRequest {
  uint32 id = 1;
  optional string description = 2;
  // If provided, replaces the entire permission set.
  repeated string permissions = 3;
}

message DeleteRoleRequest {
  uint32 id = 1;
}

message ListRolesRequest {
  uint32 page = 1;
  uint32 page_size = 2;
}

message ListRolesResponse {
  repeated Role roles = 1;
  uint32 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
  uint32 total_pages = 5;
}

// Scope semantics: project_id=0 → global; project_id=P,environment_id=0 → all
// environments in P; project_id=P,environment_id=E → only environment E.
message AssignRoleRequest {
  uint32 user_id = 1;
  uint32 role_id = 2;
  optional uint32 project_id = 3;
  optional uint32 environment_id = 4;
}

message RoleAssignment {
  uint32 user_id = 1;
  uint32 role_id = 2;
  uint32 project_id = 3;
  uint32 environment_id = 4;
}

message RemoveRoleRequest {
  uint32 user_id = 1;
  uint32 role_id = 2;
  optional uint32 project_id = 3;
  optional uint32 environment_id = 4;
}

message GetUserRolesRequest {
  uint32 user_id = 1;
}

message GetUserRolesResponse {
  uint32 user_id = 1;
  string username = 2;
  string email = 3;
  repeated Role roles = 4;
}

// ---------------------------------------------------------------------------
// Audit messages
// ---------------------------------------------------------------------------

message AuditLog {
  uint32 id = 1;
  string event_type = 2;
  // Resolved actor username ("system"/"unknown" when not a user).
  string actor = 3;
  string actor_type = 4; // user | machine_identity | system
  optional uint32 user_id = 5;
  optional uint32 project_id = 6;
  optional uint32 secret_id = 7;
  string description = 8;
  string ip_address = 9;
  bool success = 10;
  google.protobuf.Timestamp event_time = 11;
  // Structured before/after for mutation events (JSON; never plaintext values).
  optional string diff = 12;
  bool impersonation = 13;
  optional string impersonated_by = 14;
  optional string acting_as = 15;
}

message GetAuditLogsRequest {
  optional string event_type = 1;
  optional uint32 user_id = 2;
  optional uint32 project_id = 3;
  optional string actor_type = 4;
  optional google.protobuf.Timestamp start_time = 5;
  optional google.protobuf.Timestamp end_time = 6;
  uint32 page = 7;
  uint32 page_size = 8;
}

message GetAuditLogsResponse {
  repeated AuditLog logs = 1;
  uint32 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
  uint32 total_pages = 5;
}

message RBACAuditLog {
  uint32 id = 1;
  string action = 2;
  optional uint32 actor_user_id = 3;
  optional uint32 target_user_id = 4;
  optional uint32 role_id = 5;
  optional uint32 project_id = 6;
  string details = 7;
  google.protobuf.Timestamp created_at = 8;
  // Set for group-role events (role.group_assigned / role.group_removed): the
  // group the role was granted to / removed from.
  optional uint32 group_id = 9;
  // Set for permission-to-role events (permission.assigned / permission.removed):
  // the permission granted to / removed from the role.
  optional uint32 permission_id = 10;
}

message GetRBACAuditLogsRequest {
  optional string action = 1;
  optional uint32 actor_user_id = 2;
  optional uint32 target_user_id = 3;
  uint32 page = 4;
  uint32 page_size = 5;
}

message GetRBACAuditLogsResponse {
  repeated RBACAuditLog logs = 1;
  uint32 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
  uint32 total_pages = 5;
}

message StreamAuditLogsRequest {
  optional string event_type = 1;
  optional uint32 user_id = 2;
  optional uint32 project_id = 3;
  // after_id resumes the tail just after this audit event id: the stream first
  // replays the backlog of matching events with id > after_id, then continues live.
  // Omit (or 0) to tail only new events from the current head. Lets a disconnected
  // SIEM consumer reconnect from its last-seen id without losing the gap.
  optional uint32 after_id = 4;
}

// ---------------------------------------------------------------------------
// Share messages
// ---------------------------------------------------------------------------

message ShareRecord {
  uint32 id = 1;
  uint32 secret_id = 2;
  uint32 owner_id = 3;
  uint32 recipient_id = 4;
  bool is_group = 5;
  string permission = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message ShareSecretRequest {
  uint32 secret_id = 1;
  uint32 recipient_id = 2;
  bool is_group = 3;
  string permission = 4;
}

message ListSecretSharesRequest {
  uint32 secret_id = 1;
}

message ListUserSharesRequest {
  uint32 page = 1;
  uint32 page_size = 2;
}

message ListSharedSecretsRequest {
  uint32 page = 1;
  uint32 page_size = 2;
}

message ListSharesResponse {
  repeated ShareRecord shares = 1;
  uint32 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
  uint32 total_pages = 5;
}

message UpdateSharePermissionRequest {
  uint32 share_id = 1;
  string permission = 2;
}

message RevokeShareRequest {
  uint32 share_id = 1;
}

// ---------------------------------------------------------------------------
// System messages
// ---------------------------------------------------------------------------

message HealthResponse {
  string status = 1;
  google.protobuf.Timestamp timestamp = 2;
  string version = 3;
  map<string, string> services = 4;
}

message SystemInfo {
  string version = 1;
  string build_time = 2;
  string go_version = 3;
  string platform = 4;
  string uptime = 5;
  string environment = 6;
  map<string, bool> features = 7;
  DatabaseInfo database = 8;
  EncryptionInfo encryption = 9;
}

message DatabaseInfo {
  string status = 1;
  string type = 2;
  string version = 3;
  uint32 connections = 4;
}

message EncryptionInfo {
  string status = 1;
  string algorithm = 2;
  bool key_rotation_enabled = 3;
}

message Metrics {
  RequestMetrics requests = 1;
  SecretMetrics secrets = 2;
  UserMetrics users = 3;
  PerformanceMetrics performance = 4;
  SystemMetrics system = 5;
}

message RequestMetrics {
  uint64 total = 1;
  uint64 success = 2;
  uint64 errors = 3;
  double avg_duration_ms = 4;
}

message SecretMetrics {
  uint64 total = 1;
  uint64 active = 2;
  uint64 expired = 3;
  uint64 accessed_today = 4;
}

message UserMetrics {
  uint64 total = 1;
  uint64 active = 2;
  uint64 last_login_24h = 3;
}

message PerformanceMetrics {
  double avg_response_time_ms = 1;
  double requests_per_second = 2;
  double error_rate_percent = 3;
  double db_latency_ms = 4;
}

message SystemMetrics {
  double cpu_usage_percent = 1;
  double memory_usage_percent = 2;
  double disk_usage_percent = 3;
  uint32 goroutines = 4;
}

// Project service for managing projects and their environments. Mirrors the
// HTTP/CLI surface: list/get use secrets.read, create/update use secrets.write,
// delete uses secrets.delete (scoped per project for per-project operations).
service ProjectService {
  // List all projects the caller can read.
  rpc ListProjects(google.protobuf.Empty) returns (ListProjectsResponse);

  // Get a project by ID.
  rpc GetProject(GetProjectRequest) returns (Project);

  // Create a new project.
  rpc CreateProject(CreateProjectRequest) returns (Project);

  // Update a project's name, description, and/or per-project MFA policy.
  rpc UpdateProject(UpdateProjectRequest) returns (Project);

  // Delete a project (soft delete; force also removes its secrets).
  rpc DeleteProject(DeleteProjectRequest) returns (google.protobuf.Empty);

  // List a project's environments.
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);
}

message Project {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  bool require_mfa = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message Environment {
  uint32 id = 1;
  uint32 project_id = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message GetProjectRequest {
  uint32 id = 1;
}

message CreateProjectRequest {
  string name = 1;
  string description = 2;
}

message UpdateProjectRequest {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  optional bool require_mfa = 4;
}

message DeleteProjectRequest {
  uint32 id = 1;
  bool force = 2;
}

message ListEnvironmentsRequest {
  uint32 project_id = 1;
}

message ListEnvironmentsResponse {
  repeated Environment environments = 1;
}

// Machine identity service (ADR-023/030): non-human project members + their
// bearer-token credentials. Mirrors the HTTP surface — list uses users.read,
// all mutations (create/transition/classify/token ops) use roles.assign, scoped
// per project.
service MachineIdentityService {
  // List a project's machine identities.
  rpc ListMachineIdentities(ListMachineIdentitiesRequest) returns (ListMachineIdentitiesResponse);

  // Create a machine identity.
  rpc CreateMachineIdentity(CreateMachineIdentityRequest) returns (MachineIdentity);

  // Advance a machine identity's lifecycle (activate | suspend | revoke).
  rpc TransitionMachineIdentity(TransitionMachineIdentityRequest) returns (MachineIdentity);

  // Set (or clear, with "") a machine identity's data-classification label.
  rpc ClassifyMachineIdentity(ClassifyMachineIdentityRequest) returns (MachineIdentity);

  // Issue a bearer token for a machine identity. The raw token is returned ONCE.
  rpc IssueMachineToken(IssueMachineTokenRequest) returns (IssueMachineTokenResponse);

  // List a machine identity's tokens (metadata only — never the raw token).
  rpc ListMachineTokens(ListMachineTokensRequest) returns (ListMachineTokensResponse);

  // Revoke a machine token.
  rpc RevokeMachineToken(RevokeMachineTokenRequest) returns (google.protobuf.Empty);

  // Set (or clear, with "") a machine token's data-classification label.
  rpc ClassifyMachineToken(ClassifyMachineTokenRequest) returns (MachineToken);
}

message MachineIdentity {
  uint32 id = 1;
  uint32 project_id = 2;
  string name = 3;
  string identity_type = 4;
  string state = 5;
  string description = 6;
  string classification = 7;
  uint32 created_by = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  optional google.protobuf.Timestamp last_seen_at = 11;
  optional google.protobuf.Timestamp revoked_at = 12;
}

message MachineToken {
  uint32 id = 1;
  string name = 2;
  string prefix = 3;
  optional google.protobuf.Timestamp last_used_at = 4;
  optional google.protobuf.Timestamp expires_at = 5;
  bool revoked = 6;
  string classification = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListMachineIdentitiesRequest {
  uint32 project_id = 1;
}

message ListMachineIdentitiesResponse {
  repeated MachineIdentity machine_identities = 1;
}

message CreateMachineIdentityRequest {
  uint32 project_id = 1;
  string name = 2;
  string identity_type = 3;
  string description = 4;
  string classification = 5;
}

message TransitionMachineIdentityRequest {
  uint32 project_id = 1;
  uint32 machine_id = 2;
  string action = 3; // activate | suspend | revoke
}

message ClassifyMachineIdentityRequest {
  uint32 project_id = 1;
  uint32 machine_id = 2;
  string classification = 3;
}

message IssueMachineTokenRequest {
  uint32 project_id = 1;
  uint32 machine_id = 2;
  string name = 3;
  uint32 expires_in_days = 4; // 0 = never expires
  string classification = 5;
}

message IssueMachineTokenResponse {
  string token = 1; // shown once
  uint32 id = 2;
  string prefix = 3;
  optional google.protobuf.Timestamp expires_at = 4;
  string classification = 5;
}

message ListMachineTokensRequest {
  uint32 project_id = 1;
  uint32 machine_id = 2;
}

message ListMachineTokensResponse {
  repeated MachineToken tokens = 1;
}

message RevokeMachineTokenRequest {
  uint32 project_id = 1;
  uint32 machine_id = 2;
  uint32 token_id = 3;
}

message ClassifyMachineTokenRequest {
  uint32 project_id = 1;
  uint32 machine_id = 2;
  uint32 token_id = 3;
  string classification = 4;
}

// Dynamic secrets service (ADR-035): on-demand database credentials. Configs are
// project+environment scoped; lease ops authorize at the owning config/lease scope.
// Mirrors the HTTP surface — reads use secrets.read, mutations use secrets.write.
// The admin DSN is never returned; an issued credential is returned exactly once.
service DynamicSecretService {
  // List dynamic-secret configs in a project (optionally one environment).
  rpc ListConfigs(ListDynamicConfigsRequest) returns (ListDynamicConfigsResponse);

  // Get a config by ID.
  rpc GetConfig(GetDynamicConfigRequest) returns (DynamicSecretConfig);

  // Register a new dynamic-secret target.
  rpc CreateConfig(CreateDynamicConfigRequest) returns (DynamicSecretConfig);

  // Set (or clear, with "") a config's data-classification label.
  rpc ClassifyConfig(ClassifyDynamicConfigRequest) returns (DynamicSecretConfig);

  // Issue a short-lived credential. The username/password are returned ONCE.
  rpc IssueLease(IssueLeaseRequest) returns (IssuedCredential);

  // List a config's leases (never the credential bytes).
  rpc ListLeases(ListLeasesRequest) returns (ListLeasesResponse);

  // Revoke a single lease.
  rpc RevokeLease(RevokeLeaseRequest) returns (google.protobuf.Empty);

  // Renew a lease, extending its expiry (capped by the config's max TTL).
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);

  // Revoke every active lease from a config (incident kill switch).
  rpc RevokeAllLeases(RevokeAllLeasesRequest) returns (RevokeAllLeasesResponse);
}

message DynamicSecretConfig {
  uint32 id = 1;
  string name = 2;
  uint32 project_id = 3;
  uint32 environment_id = 4;
  string backend_type = 5;
  string creation_template = 6;
  int32 default_ttl_seconds = 7;
  int32 max_ttl_seconds = 8;
  string classification = 9;
  string created_by = 10;
  google.protobuf.Timestamp created_at = 11;
}

message DynamicSecretLease {
  string lease_id = 1;
  uint32 config_id = 2;
  string role_name = 3;
  string status = 4;
  string revoke_reason = 5;
  string revoke_error = 6;
  optional google.protobuf.Timestamp issued_at = 7;
  optional google.protobuf.Timestamp expires_at = 8;
  optional google.protobuf.Timestamp revoked_at = 9;
}

message IssuedCredential {
  string lease_id = 1;
  string username = 2;
  string password = 3;
  optional google.protobuf.Timestamp expires_at = 4;
  // fields carries cloud-IAM credentials (e.g. AWS STS access_key_id /
  // secret_access_key / session_token) for backends with no username/password.
  map<string, string> fields = 5;
}

message ListDynamicConfigsRequest {
  uint32 project_id = 1;
  uint32 environment_id = 2; // 0 = all environments in the project
}

message ListDynamicConfigsResponse {
  repeated DynamicSecretConfig configs = 1;
}

message GetDynamicConfigRequest {
  uint32 id = 1;
}

message CreateDynamicConfigRequest {
  string name = 1;
  uint32 project_id = 2;
  uint32 environment_id = 3;
  string backend_type = 4;
  string admin_dsn = 5;
  string creation_template = 6;
  int32 default_ttl_seconds = 7;
  int32 max_ttl_seconds = 8;
  string classification = 9;
}

message ClassifyDynamicConfigRequest {
  uint32 id = 1;
  string classification = 2;
}

message IssueLeaseRequest {
  uint32 config_id = 1;
  int32 ttl_seconds = 2; // 0 = config default
}

message ListLeasesRequest {
  uint32 config_id = 1;
}

message ListLeasesResponse {
  repeated DynamicSecretLease leases = 1;
}

message RevokeLeaseRequest {
  string lease_id = 1;
}

message RenewLeaseRequest {
  string lease_id = 1;
  int32 ttl_seconds = 2;
}

message RenewLeaseResponse {
  string lease_id = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message RevokeAllLeasesRequest {
  uint32 config_id = 1;
}

message RevokeAllLeasesResponse {
  uint32 revoked = 1;
  uint32 failed = 2;
}

// ---------------------------------------------------------------------------
// Compliance posture & control matrix (read-only; gated by system.read).
// Mirrors the HTTP/CLI compliance surface so auditors' automation can pull the
// deployment's control posture over gRPC too.
// ---------------------------------------------------------------------------
service ComplianceService {
  // GetCompliancePosture returns the deployment-wide controls-posture snapshot.
  rpc GetCompliancePosture(google.protobuf.Empty) returns (CompliancePosture);
  // GetComplianceControls returns the evaluated control matrix (per-control
  // status mapped to ISO 27001 / SOC 2 / NIS2 / DORA clauses).
  rpc GetComplianceControls(google.protobuf.Empty) returns (ComplianceControls);
}

message AuditIntegrityPosture {
  bool chain_verified = 1;
  int64 chained_events = 2;
  bool checkpointed = 3;
  string reason = 4;
}

message AccessGovernancePosture {
  int32 projects = 1;
  int32 projects_with_open_campaign = 2;
  int32 projects_never_reviewed = 3;
  int32 open_campaigns = 4;
  int32 pending_items = 5;
  int32 projects_overdue = 6;
  int32 dormant_role_grants = 7;
  int32 sod_violations = 8;
}

message RotationPosture {
  int32 covered_secrets = 1;
  int32 overdue = 2;
  int32 due_soon = 3;
}

message IdentityPosture {
  int32 active_users = 1;
  int32 users_with_second_factor = 2;
  int32 second_factor_percent = 3;
}

message EmergencyAccessPosture {
  int32 active_activations = 1;
  int32 total_activations = 2;
}

message ClassificationCounts {
  int32 total = 1;
  int32 public = 2;
  int32 internal = 3;
  int32 confidential = 4;
  int32 restricted = 5;
  int32 unclassified = 6;
}

message ClassificationPosture {
  int32 total_secrets = 1;
  int32 public = 2;
  int32 internal = 3;
  int32 confidential = 4;
  int32 restricted = 5;
  int32 unclassified = 6;
  ClassificationCounts dynamic_configs = 7;
  ClassificationCounts machine_identities = 8;
  ClassificationCounts machine_credentials = 9;
}

message AnomaliesPosture {
  int32 unacknowledged = 1;
  int32 high_severity_open = 2;
}

message LegalHoldPosture {
  bool active = 1;
  google.protobuf.Timestamp placed_at = 2;
  string reason = 3;
}

message RetentionPosture {
  bool enabled = 1;
  int32 anomaly_alerts_days = 2;
  int32 closed_access_reviews_days = 3;
  int32 break_glass_days = 4;
  int32 resolved_access_requests_days = 5;
}

message RiskPosture {
  int32 active_exceptions = 1;
  int32 expiring_soon = 2;
}

message CompliancePosture {
  google.protobuf.Timestamp generated_at = 1;
  AuditIntegrityPosture audit_integrity = 2;
  AccessGovernancePosture access_governance = 3;
  RotationPosture rotation = 4;
  IdentityPosture identity = 5;
  EmergencyAccessPosture emergency_access = 6;
  ClassificationPosture classification = 7;
  AnomaliesPosture anomalies = 8;
  LegalHoldPosture legal_hold = 9;
  RetentionPosture retention = 10;
  RiskPosture risk = 11;
}

message FrameworkRefs {
  repeated string iso_27001 = 1;
  repeated string soc2 = 2;
  repeated string nis2 = 3;
  repeated string dora = 4;
  // ENS — Spain's Esquema Nacional de Seguridad (RD 311/2022) measure codes.
  repeated string ens = 5;
}

message ControlState {
  string id = 1;
  string name = 2;
  string area = 3;
  string status = 4;
  string detail = 5;
  FrameworkRefs frameworks = 6;
}

message ControlsSummary {
  int32 total = 1;
  int32 pass = 2;
  int32 gap = 3;
  int32 not_configured = 4;
}

message ComplianceControls {
  google.protobuf.Timestamp generated_at = 1;
  repeated ControlState controls = 2;
  ControlsSummary summary = 3;
}

// ---------------------------------------------------------------------------
// Keyorix Connect — read-through federation to external secret stores (ADR-043),
// over gRPC. Read-only; gated by connect.read (ADR-044). Mirrors the HTTP surface.
// ---------------------------------------------------------------------------
service ConnectService {
  // ListConnectors returns the configured connector names.
  rpc ListConnectors(google.protobuf.Empty) returns (ConnectorList);
  // ReadSecret proxies a read-through of a secret's current value from a connector.
  rpc ReadSecret(ReadFederatedSecretRequest) returns (FederatedSecretValue);
  // ListRefGrants returns all per-reference grants (ADR-045). Requires roles.read.
  rpc ListRefGrants(google.protobuf.Empty) returns (ConnectRefGrantList);
  // CreateRefGrant adds a per-reference grant. Requires roles.write.
  rpc CreateRefGrant(CreateConnectRefGrantRequest) returns (ConnectRefGrant);
  // DeleteRefGrant removes a per-reference grant by id. Requires roles.write.
  rpc DeleteRefGrant(DeleteConnectRefGrantRequest) returns (google.protobuf.Empty);
}

message ConnectorList {
  repeated string connectors = 1;
}

message ReadFederatedSecretRequest {
  string connector = 1;
  string ref = 2;
}

message FederatedSecretValue {
  string connector = 1;
  string ref = 2;
  string value = 3;
}

message ConnectRefGrant {
  uint32 id = 1;
  uint32 role_id = 2;
  string connector = 3;
  string ref_prefix = 4;
}

message ConnectRefGrantList {
  repeated ConnectRefGrant grants = 1;
}

message CreateConnectRefGrantRequest {
  uint32 role_id = 1;
  string connector = 2;
  string ref_prefix = 3;
}

message DeleteConnectRefGrantRequest {
  uint32 id = 1;
}
