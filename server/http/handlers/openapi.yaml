  /api/v1/users:
    get:
      tags: [Users]
      summary: List users
      description: Return a paginated list of users with optional filters for search, state, and activity.
      operationId: listUsers
      security: [{bearerAuth: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, default: 20, maximum: 100}}
        - {name: search, in: query, schema: {type: string}}
        - {name: username, in: query, schema: {type: string}}
        - {name: email, in: query, schema: {type: string}}
        - {name: is_active, in: query, schema: {type: boolean}}
        - {name: include_deleted, in: query, schema: {type: boolean}}
        - {name: filter, in: query, description: "Set to `inactive` for users with no login in the last 30 days.", schema: {type: string, enum: [inactive]}}
      responses:
        '200':
          description: "Envelope `data` has `users[]` (each with id, username, email, display_name, project_count, active_project_count), `page`, `page_size`, `total`, `total_pages`."
        '401': {$ref: '#/components/responses/Error'}
    post:
      tags: [Users]
      summary: Create user
      description: Create a new user with credentials, optionally delivering a setup link or one-time password.
      operationId: createUser
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, display_name]
              properties:
                username: {type: string, minLength: 3, maxLength: 50}
                email: {type: string, format: email}
                display_name: {type: string, minLength: 1, maxLength: 100}
                password: {type: string, minLength: 8, description: "Required unless deliver_setup_link or generate_one_time_password is set."}
                is_active: {type: boolean}
                deliver_setup_link: {type: boolean, description: "Provision via account-setup link instead of an admin-set password."}
                generate_one_time_password: {type: boolean, description: "Server-generated one-time password, returned once. Mutually exclusive with deliver_setup_link."}
                role: {type: string, description: "Optional system role override (admin-set-password path only)."}
                project_assignments:
                  type: array
                  description: "Project-scoped role assignments applied atomically (admin-set-password path only)."
                  items:
                    type: object
                    properties:
                      project_id: {type: integer}
                      role: {type: string}
      responses:
        '201':
          description: "Envelope `data` is the created user. With generate_one_time_password it is `{user, one_time_password}`; with deliver_setup_link it is `{user, setup_link}`."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

  /api/v1/users/search:
    get:
      tags: [Users]
      summary: Search users
