      description: Return user accounts stuck in pending_first_login or password_reset_required state beyond the specified age.
      operationId: listStaleUsers
      security: [{bearerAuth: []}]
      parameters:
        - {name: state, in: query, description: "Account state to filter.", schema: {type: string, enum: [pending_first_login, password_reset_required], default: pending_first_login}}
