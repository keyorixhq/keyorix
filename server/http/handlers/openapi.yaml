        - {name: start_time, in: query, schema: {type: string, format: date-time}, description: RFC3339 lower bound (inclusive).}
        - {name: end_time, in: query, schema: {type: string, format: date-time}, description: RFC3339 upper bound (inclusive).}
        - {name: page, in: query, schema: {type: integer, default: 1, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, default: 50, maximum: 100}}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data has logs[] (each: id, event_type, actor,
            actor_type, description, timestamp, optional diff, and impersonation /
            impersonated_by / acting_as when impersonated), plus page, page_size,
            total, total_pages.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/audit/export:
    get:
      tags: [Audit]
      summary: Cursor-paginated full-fidelity audit feed for SIEM pull
      operationId: exportAuditLogs
      security: [{bearerAuth: []}]
      parameters:
        - {name: after_id, in: query, schema: {type: integer}, description: Cursor — pass the last returned event id to fetch the next page.}
        - {name: since, in: query, schema: {type: string, format: date-time}, description: RFC3339 lower bound on event time.}
        - {name: limit, in: query, schema: {type: integer, default: 100, maximum: 1000}}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data has events[] (each: id, event_type, timestamp,
            actor, user_id, project_id, secret_id, description, ip_address, actor_type,
            success, optional diff/impersonation/impersonated_by/acting_as), count, and
            next_cursor (the id for the next after_id, or null when caught up).
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
