      responses:
        '200':
          description: "Envelope `data` has `permissions[]` (id, name, resource, ...) and `total`."
        '401': {$ref: '#/components/responses/Error'}

  /api/v1/permissions/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Permissions]
      summary: Get a single permission by ID
      description: Return a single permission by ID, including its resource, action, and description.
      operationId: getPermission
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope `data` is the permission (id, name, description, resource, action)."
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/user-roles:
    post:
      tags: [UserRoles]
      summary: Assign role to user at a scope
      description: Assign a role to a user at the specified project or global scope, with an optional JIT expiry.
      operationId: assignUserRole
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role_id]
              properties:
                user_id: {type: integer}
                role_id: {type: integer}
                project_id: {type: integer, description: "Scope (0 = global)."}
                environment_id: {type: integer, description: "Scope (0 = global)."}
                expires_at: {type: string, format: date-time, nullable: true, description: "RFC3339; omit or null for a non-expiring grant. JIT access — the assignment is automatically revoked when the timestamp is reached."}
      responses:
        '201':
          description: "Envelope `data` is `{user_id, role_id}`."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      tags: [UserRoles]
      summary: Remove role from user at a scope
      description: Remove a role assignment from a user at the specified project or global scope.
      operationId: removeUserRole
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role_id]
              properties:
                user_id: {type: integer}
                role_id: {type: integer}
                project_id: {type: integer, description: "Scope (0 = global)."}
                environment_id: {type: integer, description: "Scope (0 = global)."}
      responses:
        '204': {description: Role removed from user.}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/user-roles/user/{userId}:
    parameters:
      - {name: userId, in: path, required: true, schema: {type: integer}}
    get:
      tags: [UserRoles]
      summary: Get a user's role assignment
      description: Return the current role assignment for the specified user.
      operationId: getUserRoleAssignment
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope `data` is the user's role assignment."
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/audit/logs:
    get:
      tags: [Audit]
      summary: List audit log entries (UI-oriented, paginated)
      description: Return paginated audit log entries filtered by action, user, project, actor type, or time range.
      operationId: listAuditLogs
      security: [{bearerAuth: []}]
      parameters:
        - {name: action, in: query, schema: {type: string}, description: Filter by event type/action.}
        - {name: user_id, in: query, schema: {type: integer}, description: Filter by acting user ID.}
        - {name: project_id, in: query, schema: {type: integer}, description: Filter by project ID.}
        - {name: actor_type, in: query, schema: {type: string, enum: [user, machine_identity, system]}, description: Segment human vs machine activity (ADR-023).}
        - {name: start_time, in: query, schema: {type: string, format: date-time}, description: RFC3339 lower bound (inclusive).}
        - {name: end_time, in: query, schema: {type: string, format: date-time}, description: RFC3339 upper bound (inclusive).}
        - {name: page, in: query, schema: {type: integer, default: 1, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, default: 50, maximum: 100}}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data has logs[] (each: id, event_type, actor,
            actor_type, description, timestamp, optional diff, and impersonation /
            impersonated_by / acting_as when impersonated), plus page, page_size,
            total, total_pages.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/audit/export:
    get:
      tags: [Audit]
      summary: Cursor-paginated full-fidelity audit feed for SIEM pull
      description: Return a cursor-paginated, full-fidelity audit event feed designed for SIEM ingestion.
      operationId: exportAuditLogs
      security: [{bearerAuth: []}]
      parameters:
        - {name: after_id, in: query, schema: {type: integer}, description: Cursor — pass the last returned event id to fetch the next page.}
        - {name: since, in: query, schema: {type: string, format: date-time}, description: RFC3339 lower bound on event time.}
        - {name: limit, in: query, schema: {type: integer, default: 100, maximum: 1000}}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data has events[] (each: id, event_type, timestamp,
            actor, user_id, project_id, secret_id, description, ip_address, actor_type,
            success, optional diff/impersonation/impersonated_by/acting_as), count, and
            next_cursor (the id for the next after_id, or null when caught up).
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/audit/export.csv:
    get:
      tags: [Audit]
      summary: Download audit events as CSV (compliance hand-off)
      description: >-
        Returns a bounded, human/auditor-friendly CSV attachment with a header
        row. Distinct from the JSON /audit/export SIEM feed — this is a
        single one-shot download capped at 10 000 rows. Gated by audit.read.
      operationId: exportAuditLogsCSV
      security: [{bearerAuth: []}]
      parameters:
        - {name: project_id, in: query, schema: {type: integer}, description: Filter by project ID.}
        - {name: user_id, in: query, schema: {type: integer}, description: Filter by acting user ID.}
        - {name: since, in: query, schema: {type: string, format: date-time}, description: RFC3339 lower bound on event time (inclusive).}
        - {name: until, in: query, schema: {type: string, format: date-time}, description: RFC3339 upper bound on event time (inclusive).}
        - {name: limit, in: query, schema: {type: integer, default: 1000, maximum: 10000}, description: Maximum rows to include.}
      responses:
        '200':
          description: CSV file download (`text/csv`). Columns — id, event_type, actor, actor_type, description, ip_address, project_id, secret_id, success, timestamp.
          content:
            text/csv:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/audit/search:
    get:
      tags: [Audit]
      summary: Rich-filter audit search
      description: >-
        Exposes finer-grained search filters than GET /audit/logs: partial
        actor username match, exact IP address, resource type/ID, success
        flag, RFC3339 time range, and limit/offset pagination. Gated by
        audit.read.
      operationId: searchAuditLogs
      security: [{bearerAuth: []}]
      parameters:
        - {name: actor, in: query, schema: {type: string}, description: Partial username match on the acting principal.}
        - {name: user_id, in: query, schema: {type: integer}, description: Exact numeric user ID.}
        - {name: project_id, in: query, schema: {type: integer}, description: Exact project ID.}
        - {name: action, in: query, schema: {type: string}, description: "Exact event_type (e.g. secret.read)."}
        - {name: resource_type, in: query, schema: {type: string}, description: "Resource kind prefix (e.g. secret)."}
        - {name: resource_id, in: query, schema: {type: integer}, description: Exact secret_node_id.}
        - {name: ip, in: query, schema: {type: string}, description: Exact originating IP address.}
        - {name: success, in: query, schema: {type: string, enum: [true, false]}, description: Filter by operation success/failure.}
        - {name: since, in: query, schema: {type: string, format: date-time}, description: RFC3339 start of time range (inclusive).}
        - {name: until, in: query, schema: {type: string, format: date-time}, description: RFC3339 end of time range (inclusive).}
        - {name: limit, in: query, schema: {type: integer, default: 100, maximum: 1000}, description: Maximum results.}
        - {name: offset, in: query, schema: {type: integer, default: 0, minimum: 0}, description: Pagination offset.}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data has events[] (each: id, event_type, actor,
            actor_type, description, timestamp, ip_address, project_id, secret_id,
            success) and total.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/audit/rbac-logs:
    get:
      tags: [Audit]
      summary: List the role-assignment audit trail
      description: Return paginated records of role, permission, and group assignment changes for RBAC auditing.
      operationId: listRBACAuditLogs
      security: [{bearerAuth: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, default: 1, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, default: 50, maximum: 100}}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data has logs[] (each: id, action, actor_user_id,
            target_user_id, group_id, role_id, permission_id, project_id, details,
            created_at), plus page, page_size, total, total_pages.
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/audit/retention:
    get:
      tags: [Audit]
      summary: Report audit-trail retention coverage (ADR-029)
      description: Return audit-trail retention statistics including oldest event, coverage span, and NIS2 compliance status.
      operationId: getAuditRetention
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: >-
            Envelope {data, message}. data: retention_policy (always "unlimited"),
            total_events, oldest_event, newest_event (nullable timestamps), coverage_days,
            and meets_nis2_12_month (true once the trail spans the NIS2 12-month window).
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/audit/verify:
    get:
      tags: [Audit]
      summary: Verify the tamper-evidence hash chain (ADR-029)
      description: Verify the audit log's tamper-evidence hash chain and report the first broken link if any.
      operationId: verifyAuditChain
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: >-
            Envelope {data, message}. data: valid, chained_events, unchained_events; on
            failure (valid=false) also first_broken_id and reason naming the first
            divergent event.
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/audit/checkpoint:
    post:
      tags: [Audit]
      summary: Write a signed audit-chain checkpoint on demand (ADR-029)
      description: >-
        Signs a checkpoint of the current verified chain head for on-box truncation
        detection. Requires system.write (above the audit group's audit.read) and
        server-side encryption (the signing key is DEK-derived). Use to re-baseline
        immediately after a DEK rotation.
      operationId: writeAuditCheckpoint
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: >-
            Envelope {data, message}. data: {id, chained_events, head_id, head_hash,
            key_version} of the new checkpoint.
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409':
          description: The chain does not verify (broken, or a signed checkpoint proves a truncation); refused.
        '412':
          description: Signed checkpoints require encryption to be enabled.
  /api/v1/audit/anomalies:
    get:
      tags: [Audit]
      summary: List anomaly alerts
      description: Return secret-access anomaly alerts, optionally filtered by acknowledged state.
      operationId: listAnomalyAlerts
      security: [{bearerAuth: []}]
      parameters:
        - {name: acknowledged, in: query, schema: {type: boolean}, description: Filter by acknowledged state; omit to return all.}
        - {name: unacknowledged, in: query, schema: {type: boolean}, description: Legacy alias (CLI) — true returns only unacknowledged alerts.}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data: alerts[] (each: ID, SecretNodeID, SecretName,
            AlertType (off_hours|new_ip|frequency_spike|new_user), Severity (low|medium|high),
            Description, AccessedBy, IPAddress, DetectedAt, Acknowledged, CreatedAt) and total.
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/audit/anomalies/{id}/acknowledge:
    post:
      tags: [Audit]
      summary: Acknowledge an anomaly alert
      description: Mark an anomaly alert as acknowledged, indicating it has been reviewed and triaged.
      operationId: acknowledgeAnomalyAlert
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}, description: Anomaly alert ID.}
      responses:
        '200':
          description: 'Envelope {data, message}. data: {acknowledged: true}.'
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List the authenticated user's notifications
      description: Return in-app notifications for the authenticated user, optionally filtered to unread only.
      operationId: listNotifications
      security: [{bearerAuth: []}]
      parameters:
        - {name: unread, in: query, schema: {type: boolean}, description: true returns only unread notifications.}
        - {name: limit, in: query, schema: {type: integer}, description: Max notifications to return (0/absent = no limit).}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data: notifications[] (each: id, type, title, message,
            link, is_read, created_at, optional project_id), newest first, plus unread_count
            for the bell badge.
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all of the user's notifications read
      description: Mark all in-app notifications for the authenticated user as read in one operation.
      operationId: markAllNotificationsRead
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: 'Envelope {data, message}. data: {all_read: true}.'
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark a single notification read
      description: Mark a specific notification as read by its ID; the notification must belong to the caller.
      operationId: markNotificationRead
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}, description: Notification ID (must belong to the caller).}
      responses:
        '200':
          description: 'Envelope {data, message}. data: {id, is_read: true}.'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Dashboard summary statistics
      description: >-
        The caller's own home dashboard (secret/share counts, expiring secrets).
        Requires the universal system.read baseline (every real principal holds it).
        The deployment-wide aggregate fields (activeUsers, auditEvents30d,
        auditLogins30d, auditSecretReads30d, failedAuthAttempts24h, inactiveUsers) and
        the full recentActivity feed are additionally scoped to audit.read — a
        baseline-only caller gets zeroed aggregates and an activity feed limited to
        their own events.
      operationId: getDashboardStats
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: >-
            Envelope {data, message}. data: totalSecrets, sharedSecrets, secretsSharedWithMe,
            activeUsers, auditEvents30d, auditLogins30d, auditSecretReads30d,
            failedAuthAttempts24h, inactiveUsers; optional trend objects
            (totalSecretsTrend/sharedSecretsTrend/sharedWithMeTrend, each {value, isPositive}),
            expiringSecrets[] (id, name, environment, expiresAt, daysLeft, expired), and
            recentActivity[] (id, type, secretName, timestamp, actor).
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/compliance/posture:
    get:
      tags: [Dashboard]
      summary: Deployment controls-posture report (ISO 27001 / SOC 2 / NIS2 / DORA)
      description: >-
        A deployment-wide, on-demand snapshot of the control posture for auditors,
        rolling up: audit-trail integrity (chain verified, chained events,
        checkpointed), access governance (projects, with-open-campaign,
        never-reviewed, projects overdue for recertification (A.5.18 cadence),
        open campaigns + pending items, dormant role grants,
        separation-of-duties violations), rotation hygiene (covered secrets,
        overdue, due-soon), identity
        (active users, with-second-factor + percent), emergency access
        (active/total break-glass activations), data classification (secret
        counts per sensitivity level + unclassified), anomalies (open /
        high-severity access-anomaly alerts), legal hold (active + reason), and
        data retention (configured per-record-type windows in days; 0 = keep
        forever — A.5.33 storage-limitation). Requires audit.read (not the universal
        system_viewer baseline).
      operationId: getCompliancePosture
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: >-
            Envelope {data}. data: {generated_at, audit_integrity, access_governance,
            rotation, identity, emergency_access} — see the description for each group's fields.
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/compliance/controls:
    get:
      tags: [Dashboard]
      summary: Compliance control matrix (ISO 27001 / SOC 2 / NIS2 / DORA)
      description: >-
        The control matrix: each control Keyorix enforces, mapped to its clause
        references across ISO 27001 Annex A, SOC 2 Trust Services Criteria, NIS2,
        and DORA, with a live status derived from the posture (pass | gap |
        not_configured) and a human-readable detail. Includes a summary tally.
        Requires audit.read (not the universal system_viewer baseline).
      operationId: getComplianceControls
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: >-
            Envelope {data}. data: {generated_at, summary {total, pass, gap,
            not_configured}, controls[] {id, name, area, status, detail, frameworks
            {iso_27001[], soc2[], nis2[], dora[]}}}.
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/compliance/evidence:
    get:
      tags: [Dashboard]
      summary: Auditor evidence pack (posture + supporting records)
      description: >-
        A timestamped, archivable evidence bundle: the posture plus the records that
        substantiate it — the audit-chain anchor {valid, chained_events, head_id,
        head_hash, checkpointed}, the access-review campaigns (per project, with
        tallies), the break-glass register, and the overdue rotations. Requires
        audit.read (not the universal system_viewer baseline).
      operationId: getComplianceEvidence
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: >-
            Envelope {data}. data: {generated_at, posture, audit_anchor, campaigns[],
            break_glass[], rotation_overdue[], sod_violations[]}.
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/compliance/evidence/verify:
    post:
      tags: [Dashboard]
      summary: Verify an exported evidence pack against its signature
      description: >-
        Recomputes the HMAC over the supplied evidence-pack bytes with the server's
        DEK-derived signing key and compares it to the detached signature — proving an
        archived pack was produced by this deployment and is unmodified. The pack is
        base64-encoded in data_b64 so arbitrary JSON can ride in the envelope. A
        signature made under a superseded DEK version (post key-rotation) is reported
        as unverifiable, distinct from a tamper mismatch. Requires audit.read (not the
        universal system_viewer baseline).
      operationId: verifyComplianceEvidence
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data_b64, signature]
              properties:
                data_b64:  {type: string, description: "Base64 of the evidence-pack bytes."}
                signature: {type: string, description: "The detached signature ('<keyVersion>:<hmac-hex>')."}
      responses:
        '200':
          description: >-
            Envelope {data}. data: {valid, key_version, current_version, reason}.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/legal-hold:
    get:
      tags: [Dashboard]
      summary: Legal-hold status (ISO 27001 A.5.34 / eDiscovery)
      description: >-
        Whether a deployment-wide litigation/investigation hold is active. While
        active, the background purge jobs are blocked from hard-deleting records.
        Requires audit.read (not the universal system_viewer baseline).
      operationId: getLegalHold
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Envelope {data}. data: {active} or {active:true, hold:{id, reason, placed_by, placed_at}}."}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Dashboard]
      summary: Place a legal hold (block all purges)
      description: "Activate a hold with a reason; refuses if one is already active. Requires system.write."
      operationId: placeLegalHold
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, description: "Why the hold is placed (recorded for audit)"}
      responses:
        '201': {description: "Envelope {data}. data: {hold}."}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Dashboard]
      summary: Lift the active legal hold (resume purges)
      description: Remove the active deployment-wide legal hold, allowing background purge jobs to resume.
      operationId: liftLegalHold
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Envelope {data, message}. Legal hold lifted."}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/risk-exceptions:
    get:
      tags: [Dashboard]
      summary: Risk register — governed, time-bound exceptions (ISO 27001 A.5.8)
      description: >-
        The risk register: governed acceptances of a known control gap, each with an
        owner, justification, and sunset date. Active only by default; ?all=true
        includes expired exceptions (history). Each carries a computed status
        (active | expired | revoked). Requires audit.read (not the universal
        system_viewer baseline).
      operationId: listRiskExceptions
      parameters:
        - {name: all, in: query, schema: {type: boolean}, description: "Include expired exceptions."}
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Envelope {data}. data: {exceptions[] {id, title, category, reference, justification, status, expires_at, created_by, created_at}}."}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Dashboard]
      summary: Record a risk exception (accept a control gap for a bounded time)
      description: "Accept a known gap with a justification and a required future expiry. Requires system.write."
      operationId: createRiskException
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, justification, expires_at]
              properties:
                title: {type: string}
                category: {type: string, enum: [sod, mfa, rotation, dormant_access, classification, other]}
                reference: {type: string, description: "What it applies to (a user, an SoD pair, a secret)."}
                justification: {type: string}
                expires_at: {type: string, format: date-time, description: "RFC3339; must be in the future."}
      responses:
        '201': {description: "Envelope {data, message}. data: {exception}."}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/risk-exceptions/{id}:
    delete:
      tags: [Dashboard]
      summary: Revoke a risk exception before its expiry (ISO 27001 A.5.8)
      description: Revoke a risk exception before its expiry date, immediately closing the accepted control gap.
      operationId: revokeRiskException
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Envelope {data, message}. Risk exception revoked."}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/sod/policies:
    get:
      tags: [Dashboard]
      summary: List separation-of-duties policies (ISO 27001 A.5.3)
      description: "Toxic permission combinations one principal must not hold together. Requires system.read."
      operationId: listSoDPolicies
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Envelope {data}. data: {policies[] of {id, name, description, permission_a, permission_b, created_at}, count}."}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Dashboard]
      summary: Create a separation-of-duties policy
      description: "Define two permissions that must not be held together. Requires system.write."
      operationId: createSoDPolicy
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, permission_a, permission_b]
              properties:
                name: {type: string}
                description: {type: string}
                permission_a: {type: string, description: "e.g. roles.assign"}
                permission_b: {type: string, description: "e.g. secrets.delete (must differ from permission_a)"}
      responses:
        '201': {description: "Envelope {data}. data: {policy}."}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/sod/policies/{id}:
    delete:
      tags: [Dashboard]
      summary: Delete a separation-of-duties policy
      description: Permanently delete a separation-of-duties policy, removing the toxic-pair constraint.
      operationId: deleteSoDPolicy
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: uint32}}
      responses:
        '200': {description: "Envelope {data, message}. Policy deleted."}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/sod/violations:
    get:
      tags: [Dashboard]
      summary: List separation-of-duties violations
      description: >-
        Principals whose effective permissions include both sides of a policy —
        discloses violator names/emails deployment-wide. Requires audit.read (not the
        universal system_viewer baseline).
      operationId: listSoDViolations
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Envelope {data}. data: {violations[] of {policy_id, policy_name, user_id, username, email, permission_a, permission_b}, count}."}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/dashboard/activity:
    get:
      tags: [Dashboard]
      summary: Paginated activity feed
      description: Return a paginated activity feed of recent secret operations for the dashboard.
      operationId: getDashboardActivity
      security: [{bearerAuth: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, default: 1, minimum: 1}}
        - {name: pageSize, in: query, schema: {type: integer, default: 10, maximum: 100}}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data: items[] (each: id, type, secretName, timestamp,
            actor), total, page, pageSize.
        '401': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Session token, personal access token (kx_pat_…), or machine token (kx_machine_…).
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: {type: integer}
                  message: {type: string}
                  type: {type: string}
  schemas:
    AccessReviewDecision:
      type: object
      description: >-
        Identifies one access-review entry for a recertification decision
        (attest or revoke). Mirrors an entry from GET .../access-review.
      required: [source]
      properties:
        source:
          type: string
          enum: [role, direct_share, group_share]
          description: Which mechanism conferred the grant.
        principal_type:
          type: string
          enum: [user, group]
          description: For a role grant, whether the principal is a user or a group.
        principal_id:
          type: integer
          format: uint32
          description: The user or group ID the grant is for.
        role_id:
          type: integer
          format: uint32
          description: Required when source=role.
        environment_id:
          type: integer
          format: uint32
          description: Environment scope of a role grant (0 = whole project).
        secret_id:
          type: integer
          format: uint32
          description: Required when source=direct_share or group_share.
    SecretACL:
      type: object
      description: >-
        Per-secret ACL grant. Confers the listed permissions on a specific user
        for one secret, independently of project RBAC (RBAC Phase 3).
      properties:
        id: {type: integer}
        secret_id: {type: integer}
        user_id: {type: integer}
        permissions:
          type: array
          items: {type: string}
        granted_by: {type: integer}
        created_at: {type: string, format: date-time}
