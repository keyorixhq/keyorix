        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [Roles]
      summary: Assign permission to role
      description: Add a permission to the specified role, granting it to all users and groups holding that role.
      operationId: assignPermissionToRole
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_id]
              properties:
                permission_id: {type: integer}
      responses:
        '201':
          description: "Envelope `data` is `{role_id, permission_id}`."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/roles/{id}/permissions/{permissionId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      - {name: permissionId, in: path, required: true, schema: {type: integer}}
    delete:
      tags: [Roles]
      summary: Remove permission from role
      description: Remove a permission from the specified role, revoking it for all users and groups holding that role.
      operationId: removePermissionFromRole
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Permission removed from role.}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/permissions:
