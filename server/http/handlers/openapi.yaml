      parameters:
        - {name: page, in: query, schema: {type: integer, default: 1, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, default: 50, maximum: 100}}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data has logs[] (each: id, action, actor_user_id,
            target_user_id, group_id, role_id, permission_id, project_id, details,
