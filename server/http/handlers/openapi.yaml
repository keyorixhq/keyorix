      description: Change a machine identity's lifecycle state by applying an activate, suspend, or revoke action.
      operationId: transitionMachineIdentity
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: machineId, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [activate, suspend, revoke]}
      responses:
        '200':
          description: Envelope with `data.machine_identity` (the updated identity).
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/machine-identities/{machineId}/tokens:
    get:
      tags: [MachineIdentities]
      summary: List machine tokens (metadata only)
      description: Return token metadata (prefix, expiry, last used) for a machine identity; secret values are never returned.
      operationId: listMachineTokens
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: machineId, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: >-
            Envelope with `data.tokens`; each item has `id`, `name`, `prefix`,
            `last_used_at`, `expires_at`, `revoked`, `created_at` (never the raw token).
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [MachineIdentities]
      summary: Issue a machine token (raw token shown once)
      description: Issue a new authentication token for a machine identity; the raw token is returned only once.
      operationId: issueMachineToken
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: machineId, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                expires_in_days: {type: integer, description: Optional; omit or 0 for no expiry}
      responses:
        '201':
          description: >-
            Envelope with `data.token` (raw token, returned ONCE), `data.id`,
            `data.prefix`, and `data.expires_at`.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/machine-identities/{machineId}/tokens/{tokenId}:
    delete:
      tags: [MachineIdentities]
      summary: Revoke a machine token
      description: Permanently revoke a machine token by ID, preventing further authentication with it.
      operationId: revokeMachineToken
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: machineId, in: path, required: true, schema: {type: integer}}
        - {name: tokenId, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope with null `data` and a confirmation message.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/machine-identities/{machineId}/roles:
    post:
      tags: [MachineIdentities]
      summary: Grant a project role to a machine identity
      description: Assign a project-scoped role to a machine identity, granting it the role's permissions.
      operationId: grantMachineRole
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: machineId, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id: {type: integer}
      responses:
        '200':
          description: Envelope with null `data` and a confirmation message.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/machine-identities/{machineId}/roles/{roleId}:
    delete:
      tags: [MachineIdentities]
      summary: Remove a project role from a machine identity
      description: Revoke a previously granted project-scoped role from a machine identity.
      operationId: removeMachineRole
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: machineId, in: path, required: true, schema: {type: integer}}
        - {name: roleId, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope with null `data` and a confirmation message.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/secrets:
    get:
      tags: [Secrets]
      summary: List secrets
      description: List secrets accessible to the caller with optional filters for project, environment, type, and classification.
      operationId: listSecrets
      security: [{bearerAuth: []}]
      parameters:
        - {name: project_id, in: query, schema: {type: integer}}
        - {name: environment_id, in: query, schema: {type: integer}}
        - {name: search, in: query, schema: {type: string}}
        - {name: type, in: query, schema: {type: string}}
        - {name: classification, in: query, schema: {type: string, enum: [public, internal, confidential, restricted, unclassified]}, description: "Data-classification filter (A.5.12); 'unclassified' matches secrets with no label."}
        - {name: expires_before, in: query, schema: {type: string, format: date-time}, description: "RFC3339 — return only secrets with a non-null expiration before this time (expired or expiring soon)."}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, default: 20, maximum: 100}}
        - {name: show_owned_only, in: query, schema: {type: boolean}}
        - {name: show_shared_only, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: >-
            Envelope `{data, message}`. `data` holds the paginated list
            (`secrets` array plus pagination fields).
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Secrets]
      summary: Create a secret
      description: Create a new secret with a name, value, type, and optional metadata in the specified environment.
      operationId: createSecret
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value, environment_id, type]
              properties:
                name: {type: string, minLength: 1, maxLength: 255}
                value: {type: string}
                project_id: {type: integer}
                environment_id: {type: integer}
                type: {type: string}
                max_reads: {type: integer, minimum: 1, nullable: true}
                metadata: {type: object, additionalProperties: {type: string}}
                tags: {type: array, items: {type: string}}
                classification: {type: string, description: "Optional data-sensitivity label (A.5.12): public|internal|confidential|restricted."}
      responses:
        '201':
          description: >-
            Envelope `{data, message}`. `data` is the created secret node
            (`id`, `name`, `project_id`, `environment_id`, `type`).
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}:
    get:
      tags: [Secrets]
      summary: Get a secret
      description: Return a secret by ID; include include_value=true to retrieve the decrypted value.
      operationId: getSecret
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - name: include_value
          in: query
          description: When `true`, response `data` becomes `{secret, value}` with the decrypted value.
          schema: {type: boolean}
      responses:
        '200':
          description: >-
            Envelope `{data, message}`. `data` is the secret node, or
            `{secret, value}` when `include_value=true`.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      tags: [Secrets]
      summary: Update a secret
      description: Update a secret's value, max-read limit, or expiration by ID.
      operationId: updateSecret
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                `expiration` (RFC3339) and `clear_expiration` are mutually
                exclusive.
              properties:
                value: {type: string}
                max_reads: {type: integer, minimum: 1, nullable: true}
                expiration: {type: string, format: date-time}
                clear_expiration: {type: boolean}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the updated secret node.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Secrets]
      summary: Delete a secret
      description: Permanently delete a secret and all its versions by ID.
      operationId: deleteSecret
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '204': {description: Secret deleted (no content).}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/acl:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}, description: Secret ID}
    get:
      tags: [Secrets]
      summary: List ACL grants for a secret
      description: >-
        Returns all per-secret ACL entries for the given secret. Requires
        `secrets.manage` at the secret's project scope.
      operationId: listSecretACLs
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope `data` is an array of SecretACL objects."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/SecretACL'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [Secrets]
      summary: Grant a per-secret ACL entry
      description: >-
        Grants the specified permissions to a user on a single secret. The
        caller must hold `secrets.manage` at the secret's project scope. If
        an entry already exists for the (secret, user) pair it is replaced
        (upsert semantics).
      operationId: grantSecretACL
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, permissions]
              properties:
                user_id:
                  type: integer
                  description: ID of the user to grant access to.
                permissions:
                  type: array
                  items: {type: string}
                  description: "List of permission strings to grant, e.g. [\"secrets.read\"]."
                  minItems: 1
      responses:
        '200':
          description: "Envelope `data` is `{granted: true}`."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/acl/{aclId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}, description: Secret ID}
      - {name: aclId, in: path, required: true, schema: {type: integer}, description: ACL entry ID}
    delete:
      tags: [Secrets]
      summary: Revoke a per-secret ACL entry
      description: >-
        Deletes the ACL entry identified by `aclId` for the given secret.
        Requires `secrets.manage` at the secret's project scope.
      operationId: revokeSecretACL
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope `data` is `{revoked: true}`."
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/classification:
    patch:
      tags: [Secrets]
      summary: Set a secret's data-classification label (ISO 27001 A.5.12)
      description: >-
        Label the secret with its data sensitivity (or empty to clear). Drives the
        compliance classification posture. Requires secrets.write at the secret's scope.
      operationId: classifySecret
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                classification:
                  type: string
                  description: "public|internal|confidential|restricted, or empty to clear."
      responses:
        '200': {description: "Envelope {data, message}. data is the updated secret node."}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/rotate:
    post:
      tags: [Secrets]
      summary: Rotate a secret value
      description: Replace a secret's current value with a new one, archiving the previous version.
      operationId: rotateSecret
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_value]
              properties:
                new_value: {type: string}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the rotated secret node.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/versions:
    get:
      tags: [Secrets]
      summary: List secret versions
      description: Return the full version history for a secret, including previous values' metadata.
      operationId: getSecretVersions
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope `{data, message}`. `data.versions` is the version history array.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/risk:
    get:
      tags: [Secrets]
      summary: Get a secret's risk score
      description: Return the composite risk score for a secret based on expiry, rotation, usage, and exposure factors.
      operationId: getSecretRisk
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: >-
            Envelope `{data, message}`. `data` is the composite risk score
            (expiry / rotation / usage / exposure factors).
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/usage/most-accessed:
    get:
      tags: [Secrets]
      summary: List most-accessed secrets
      description: Return the top secrets ranked by read count within the specified project and time window.
      operationId: getMostAccessedSecrets
      security: [{bearerAuth: []}]
      parameters:
        - {name: project_id, in: query, schema: {type: integer}}
        - {name: days, in: query, schema: {type: integer, default: 30}}
        - {name: limit, in: query, schema: {type: integer, default: 10}}
      responses:
        '200':
          description: >-
            Envelope `{data, message}`. `data.secrets` ranks secrets by read
            count; `data.days` echoes the window.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/usage/unused:
    get:
      tags: [Secrets]
      summary: List unused secrets
      description: Return secrets that have not been read within the specified number of days, never-read first.
      operationId: getUnusedSecrets
      security: [{bearerAuth: []}]
      parameters:
        - {name: project_id, in: query, schema: {type: integer}}
        - {name: days, in: query, schema: {type: integer, default: 30}}
      responses:
        '200':
          description: >-
            Envelope `{data, message}`. `data.secrets` lists secrets unread in
            the last N days (never-read first); `data.days` echoes the window.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/shares:
    get:
      tags: [Shares]
      summary: List a secret's shares
      description: Return all share records for a secret, showing who has been granted access and at what permission level.
      operationId: listSecretShares
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope `{data, message}`. `data.shares` is the share records array.
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/share:
    post:
      tags: [Shares]
      summary: Share a secret
      description: Grant read or write access to a secret for a specific user or group.
      operationId: shareSecret
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient_id, permission]
              properties:
                recipient_id:
                  type: integer
                  description: User ID, or group ID when `is_group` is true.
                is_group: {type: boolean}
                permission: {type: string, enum: [read, write]}
      responses:
        '201':
          description: Envelope `{data, message}`. `data` is the created share record.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/secrets/{id}/access-log/export:
    get:
      tags: [Secrets]
      summary: Download secret access log as a file
      description: >-
        Returns the secret's full access history (secret.read audit events) as
        a downloadable file. Supports JSON (default) and CSV formats via the
        `format` query parameter. Gated by secrets.read at the secret's project
        scope.
      operationId: exportSecretAccessLog
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - name: format
          in: query
          schema: {type: string, enum: [json, csv], default: json}
          description: "Output format. `json` returns a JSON array; `csv` returns a spreadsheet-friendly attachment."
      responses:
        '200':
          description: File download. Content-Type is `application/json` or `text/csv` depending on `format`.
          content:
            application/json:
              schema: {type: string, format: binary}
            text/csv:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/shares:
    get:
      tags: [Shares]
      summary: List shares created by the caller
      description: Return all secret shares that were created by the authenticated user.
      operationId: listShares
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Envelope `{data, message}`. `data.shares` is the share records array.
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/shares/{id}:
    put:
      tags: [Shares]
      summary: Update a share's permission
      description: Change the permission level (read or write) of an existing secret share.
      operationId: updateSharePermission
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission]
              properties:
                permission: {type: string, enum: [read, write]}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the updated share record.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Shares]
      summary: Revoke a share
      description: Remove a secret share, revoking the recipient's access to the secret.
      operationId: revokeShare
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '204': {description: Share revoked (no content).}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/shared-secrets:
    get:
      tags: [Shares]
      summary: List secrets shared with the caller
      description: Return all secrets that other users or groups have shared with the authenticated user.
      operationId: listSharedSecrets
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Envelope `{data, message}`. `data.secrets` is the shared secret nodes array.
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/rotation-policies:
    get:
      tags: [RotationPolicies]
      summary: List rotation policies
      description: Return rotation policies, optionally filtered by project or environment.
      operationId: listRotationPolicies
      security: [{bearerAuth: []}]
      parameters:
        - {name: project_id, in: query, schema: {type: integer}}
        - {name: environment_id, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the rotation policies array.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
    post:
      tags: [RotationPolicies]
      summary: Create a rotation policy
      description: Create a new rotation policy with a name, scope, interval, and optional alert thresholds.
      operationId: createRotationPolicy
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope, interval_days]
              properties:
                name: {type: string, minLength: 1, maxLength: 255}
                description: {type: string}
                scope: {type: string, enum: [project, environment]}
                project_id: {type: integer, nullable: true}
                environment_id: {type: integer, nullable: true}
                interval_days: {type: integer, minimum: 1, maximum: 365}
                alert_days_before: {type: integer, minimum: 0, maximum: 90}
                notify_on_breach: {type: boolean}
      responses:
        '201':
          description: Envelope `{data, message}`. `data` is the created rotation policy.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/rotation-policies/evaluate:
    get:
      tags: [RotationPolicies]
