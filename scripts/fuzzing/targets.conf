# Canonical list of this repo's fuzz targets, validated against the tree by the
# CI drift-guard in .github/workflows/ci.yml: every `func FuzzXxx` in the tree
# must be declared here, and no declared target may be stale. The continuous rig
# itself runs the shared fuzz-harness runner (fuzz-runner.sh), which DISCOVERS
# targets dynamically — this file is the human-maintained cross-check, not
# consumed by the rig. Add a new target by adding a line here.
# Format: <go-package-path>|<FuzzFuncName>|<go-test-fuzztime>
#
# Lines starting with # or blank lines are ignored.
#
# Durations rebalanced 2026-09-13 from live saturation data: cycle was ~22h and
# front-loaded on targets that have long since saturated (CombineKEK/Azure at
# +0..+1 new-interesting per run) while the notary RFC3161/PKCS#7 DoS targets —
# the exact code the strict-DER guard (#1848) reworked, and still finding
# coverage (VerifyReceipt +76, RFC3161Anchor +33 per run) — sat at the end on
# 1h each, reached only ~once/day. Time is now weighted toward where coverage is
# still growing; saturated targets drop to 1h. Cycle ~16h. Re-tune from the next
# saturation snapshot, and raise a target's time when its package or a parsing
# dependency changes (that reopens coverage).
#
# Tier-1 batch added 2026-09-15 (#1889): PAT scope/CIDR decode, SCIM token
# strength, secret ACL/ref parsing, bundle key PEM parsing, encryption envelope
# deserialize, and the SAML response parse path. No saturation data yet (brand
# new); durations below are an initial security-weighted guess, not a
# measurement — re-tune once these have run a few cycles. FuzzParseResponse
# found a real signature-bypass on day one (an XML epilogue after the signed
# root was silently accepted — fixed same PR, internal/saml/provider.go), so it
# gets the largest new allocation.

# Saturated (+1/run) — 1h is enough to re-confirm clean each cycle.
internal/crypto|FuzzCombineKEK|1h
# OIDC id_token verify (golang-jwt). Mildly active (+5/run) and security-relevant
# (untrusted token parse), so 2h.
internal/core|FuzzOIDCVerifierVerify|2h
# SSO id_token signature-bypass rejection invariant (verifyIDToken, #1869): the
# fuzzer can't forge a JWKS-signed token, so any accepted non-genuine token is a
# real bypass. Security-relevant untrusted token parse, sibling to the OIDC target
# above, so 2h.
internal/core|FuzzVerifyIDToken|2h
# PAT scope/CIDR column decode on the request-authentication path (every
# PAT-authenticated request) — fail-closed contract (#r124): a corrupt non-empty
# column must deny, never silently widen to unrestricted. Runs on every request; 2h.
internal/core/rules|FuzzDecodePATScopes|2h
internal/core/rules|FuzzDecodePATCIDRs|2h
# Metamorphic algebra of PATRestriction.Allows — the pure ADR-042 least-privilege
# decision that bounds even an admin's token. Asserts order-invariance,
# subset->superset monotonicity, project/env scope-narrowing (deny), and
# wildcard/empty semantics; a violation is a reorder-sensitive allowlist or a
# scope-confinement escape. Pure + fast (~10k execs/s); 1h.
internal/core|FuzzPATRestrictionAllows|1h
# Real create -> validate -> restrict -> revoke/expire lifecycle for personal
# access tokens, against a real in-memory SQLite store (real CreateOwnPAT/
# RevokeOwnPAT, real ValidatePATToken/CurrentPATRestriction) — the other PAT
# fuzz targets above only cover the pure column decoders and the pure
# authorization algebra, never this real storage-backed path. Mutates a
# byte-exact issued token (flips, truncation, extension, case-fold, prefix
# swap, confusable/whitespace insertion, cross-token splice, encoding
# variant) and checks the result against an independently-built shadow
# fixture: fail-closed identity (only a byte-exact, unexpired, unrevoked
# token ever authenticates, and only as its own owner), revoked/expired
# never authenticate, and the returned restriction always matches that
# token's own creation parameters, never another token's. 1h.
internal/core|FuzzPATValidateLifecycle|1h
# Secret ACL permissions column decode — grant-direction counterpart to the PAT
# decoders above (empty/corrupt must decode to no grant, never fabricate one). 2h.
internal/core/rules|FuzzDecodeSecretACLPerms|2h
# SCIM bearer token strength floor (startup guard, ValidateSCIMTokenStrength) — a
# regression here would silently reweaken provisioning auth. Small, pure function;
# 1h is plenty.
internal/core/rules|FuzzValidateSCIMTokenStrength|1h
# "project/environment/name" secret reference parser — untrusted input from CLI
# args, API paths, and federated-secret lookups. No crypto, small state machine; 1h.
internal/core/rules|FuzzParseSecretRef|1h
# Secret value / password policy Validate() over arbitrary attacker-controlled
# bytes (including invalid UTF-8). Pure validation logic, no parsing surface
# beyond string ops; 1h.
internal/core/rules|FuzzSecretValuePolicyValidate|1h
internal/core/rules|FuzzPasswordPolicyValidate|1h
# Saturated (+0/run) — dropped from 3h to 1h.
internal/rotation|FuzzAzureGenerateUpstreamRef|1h
# Hand-rolled SQL escaping in the Postgres/MySQL rotation backends
# (postgres.go/mysql.go) — the rotation_ref trust boundary. Both saturated
# (+0/run) and the escaping logic is small, so 1h each (down from 2h).
internal/rotation|FuzzPostgresQuoting|1h
internal/rotation|FuzzMySQLQuoteString|1h
# Hand-rolled byte-index parser for "${secret:<ref>}" placeholder syntax
# (internal/secrettemplate/render.go's parse) — small; 1h is plenty.
internal/secrettemplate|FuzzParse|1h
# AES-256-GCM decryption path: arbitrary JSON EncryptedData blobs into
# Decrypt/DecryptWithAAD (nonce-length guard, GCM Open panic surface, AAD
# mismatch). Near-saturated (+2/run), so 1h (down from 2h); the chunked variant
# separately exercises the reorder/splice/duplicate-index guards.
internal/encryption|FuzzDecrypt|1h
internal/encryption|FuzzDecryptChunked|1h
# Metamorphic AEAD contract on the AES-256-GCM core (Encrypt/Decrypt + AAD): sound
# round-trip, single-bit tamper detection on ciphertext/nonce (must fail), AAD
# binding + transplant protection, nonce uniqueness, and cross-key rejection. Adds
# the security-contract oracle the malformed-blob decrypt targets above don't. Pure
# + fast (~19k execs/s); 1h.
internal/encryption|FuzzAEADTamperRoundTrip|1h
# JSON envelope parse that runs BEFORE decryption on data read back from storage or
# a remote backend (a tampered/corrupted stored blob) — isolates the parse step
# from FuzzDecrypt above so a malformed envelope is caught here, not behind the
# KEK. Same tier as the decrypt targets; 1h.
internal/encryption|FuzzDeserializeEncryptedData|1h
# Crash-consistency of KEK-passphrase rotation: interrupts RotateKEKPassphrase at
# each on-disk step (write-pending/rename/fsync of dek.key + kek.salt) and asserts
# the DEK stays recoverable (no data loss) and the old passphrase is retired (no
# stale-key). Sound oracle (known DEK), not never-panic. Deep new area; 1h.
internal/encryption|FuzzKEKRotationCrashConsistency|1h
# Crash-consistency of KEK-provider migration (RewrapDEK, ADR-041): interrupts the
# one-file dek.key rewrap (provider side-effect / write-pending / rename / fsync) and
# asserts the DEK stays recoverable (old provider pre-rename, new provider post) and the
# old wrapping key is retired after completion. Sound oracle (known DEK); 1h.
internal/encryption|FuzzDEKRewrapCrashConsistency|1h
# Crash-consistency of DEK rotation with full re-encryption sweep (RotateDEKWithSweep,
# ADR-010): interrupts the new-DEK + DB-sweep + pending→active rename at each durability
# checkpoint and asserts every committed row still decrypts under the recovered active DEK
# (no data loss) and the old DEK is retired after completion. Verifies the redo-marker
# recovery. Sound oracle (known plaintexts); DB-backed (in-memory SQLite); 1h.
internal/encryption|FuzzDEKSweepCrashConsistency|1h
# Fault injection (distinct from the crash-consistency trilogy above, which only
# interrupts BETWEEN completed steps): drives secret create/update/delete, DEK
# rewrap, KEK rotation, and a backup/export durability primitive with the
# ENVIRONMENT failing mid-operation (clean write error, short write, a real
# rename/fsync that still reports failure, a GORM statement that never runs) and
# asserts fail-closed (an error always surfaces), no data loss/corruption, no
# plaintext spill, and — for faults at/after the durability point — the final
# state is exactly the old or the new model, never a mix. Sound oracle (known
# values, real recovery-model reuse from the trilogy); one known real finding
# (kek:rename-dek's ambiguous case) is deliberately excluded from the decoder —
# see docs/findings/2026-09-19-FINDING-kek-rotation-rename-dek-cleanup-dataloss.md; 1h.
internal/encryption|FuzzFaultInjectedOperations|1h
# SAML IdP metadata XML parsing (crewjam/saml + mattermost/xml-roundtrip-validator).
# Metadata path is saturated (+1/run); 1h.
internal/saml|FuzzSAMLMetadata|1h
# SAML ACS response parse: signature verification against the pinned IdP cert, on
# the unauthenticated /auth/saml/{provider}/acs endpoint — fully attacker-controlled
# bytes. Found a real signature-bypass on day one (see the 2026-09-15 note above);
# highest-severity new target in this batch, so 3h, same tier as the notary parsers.
internal/saml|FuzzParseResponse|3h
# Air-gapped bundle: streaming gzip+tar → manifest JSON → ed25519 sig → per-
# component sha256. Saturated (+0/run); 1h (down from 2h). Raise again on any
# change to the bundle format or its gzip/tar handling. Moved from
# internal/bundle to pkg/bundleverify by #2076 (verify-side logic split out
# for the thin CLI); same targets, same tuning.
pkg/bundleverify|FuzzBundleVerify|1h
pkg/bundleverify|FuzzComponentPathContainment|1h
# PEM/PKCS#8 parse of the operator-supplied ed25519 bundle-signing key. Operator
# input, not a live attacker channel, but classic PEM/x509 panic/OOB surface; 1h.
pkg/bundleverify|FuzzParsePrivateKeyPEM|1h
# License token evaluation: now untrusted CLI-supplied input on a second path
# (`license install`/`status --license`) via pkg/licenseverify, not just the
# server's Gate. New target added by #2076; unsaturated, so 1h to start.
pkg/licenseverify|FuzzEvaluate|1h
# RFC 3161 TimeStampToken: digitorus/timestamp.Parse (RFC 3161 ASN.1) and
# digitorus/pkcs7.Parse (PKCS#7 envelope) inside VerifyReceipt. This is the
# amplification/DoS surface the strict-DER guard (#1848) reworked; still finding
# new coverage (+76/run) against the new guard code, and the highest-severity
# parser we run — so 3h (up from 1h), the largest slice in the cycle.
internal/notary|FuzzVerifyReceipt|3h
# RFC 3161 Anchor(): same digitorus/timestamp.ParseResponse call on the TSA
# response body (network-reachable TSA), same parser family. Still climbing
# (+33/run); 2h (up from 1h).
internal/notary|FuzzRFC3161Anchor|2h
# Fail-closed chain-of-trust invariant for VerifyReceipt: an attacker root R' crafted
# with R's exact Subject/SubjectKeyId bytes, self-signed leaves, cross-signed
# impostor roots, wrong-EKU, and 100-cert chains must never be accepted unless
# crypto/x509 independently agrees against a pool containing ONLY the configured
# root R. New; sibling to FuzzVerifyReceipt (which only proves "empty pool always
# rejects" — this proves "a real root present still rejects a same-subject
# impostor"). 2h.
internal/notary|FuzzCertChainTrustInvariant|2h

# ── Tier-2 (fuzz/tier2-jwk-mcp) — data/inspection-selected walled parsers ─────
# JWKS key parsing from an untrusted/MITM'able IdP endpoint (the RSA/EC bound
# checks; #100 + exponent/coordinate hardening) — not reached by the static-
# resolver OIDC harness. Crypto-key material from the network → 1h.
internal/core/rules|FuzzParseJWK|1h
# MCP stdio JSON-RPC parse/dispatch loop (Server.Serve) — attacker-influenceable
# client wire input; protocol parser, no DB. 30m.
internal/mcp|FuzzMCPServe|30m
# SAML XSW differential: structure-aware signature-wrapping mutations (comment-
# truncation, sibling/wrapped assertion injection) on a validly-signed response;
# invariant = only the signed subject may verify. Complements FuzzParseResponse
# (byte-level) with the structural XSW family. 2h (new; security-critical parser).
internal/saml|FuzzParseResponseXSW|2h

# ── Behind-the-wall soak (fuzz/behind-the-wall-batch) — pour INSIDE the wall ──
# The obvious byte-level entry points are already fuzzed; these three pour past
# the signature/JSON wall so the code behind it (claim semantics, assertion
# extraction, the CBOR/attestation-format family) actually gets wetted.
#
# WebAuthn credential parse: go-webauthn ParseCredential{Creation,Request}
# ResponseBytes on the UNAUTHENTICATED ceremony-finish endpoints — raw browser
# bytes after only a JSON decode + 64 KiB cap, no keyorix schema in front. The
# library is the front line, so a panic/hang here is a pre-auth DoS. 1h.
server/http/handlers|FuzzWebAuthnCredentialResponse|1h
# OIDC claim soak: every token is signed with the trusted key so the signature
# always verifies — the fuzzer explores iss/aud/exp/iat/azp semantics behind the
# signature wall (fail-closed rejection invariant), the surface FuzzOIDCVerifier
# Verify can't reach because it holds no key. 1h.
internal/core|FuzzOIDCVerifierClaims|1h
# SAML content soak: each iteration builds a freshly-signed IDP Response whose
# identity fields are the fuzzed input, so the DSig check always passes and the
# fuzzer soaks assertion extraction + attribute mapping (identity round-trip
# invariant), behind the wall FuzzParseResponse dies at. 1h.
internal/saml|FuzzParseResponseContent|1h
# SSO id_token claim soak (browser login path, verifyIDToken) — sibling of
# FuzzOIDCVerifierClaims; every token trusted-signed so the fuzzer explores
# iss/aud/nonce/exp semantics (incl. the OIDC nonce check the machine path lacks). 1h.
internal/core|FuzzVerifyIDTokenClaims|1h
# JWT algorithm-confusion invariant (golang-jwt/jwt/v5 lib-contract, keyorix call path):
# a token is trusted only if signed with the exact expected alg AND key. Asserts a safe
# RS256-pinned verifier rejects every forgery — alg:none, HS/RS key-confusion, key
# substitution, signature tamper. Supply-chain regression guard for the JWT verify layer. 1h.
internal/libconformance|FuzzJWTAlgorithmConfusion|1h
# Third-party lib invariant harnesses (on keyorix's call path):
# etree round-trip idempotence — a serializer that emits XML it re-reads differently is the
# XSW seam; asserts re-parseability + serialise-is-a-fixed-point. 1h.
internal/libconformance|FuzzEtreeRoundTripIdempotent|1h
# digitorus/pkcs7 bounded-work — the BER parser where the amplification DoS (CVE-2026-45447)
# lived; asserts parse time (Guard) + memory (alloc envelope) stay proportional to input. 1h.
internal/libconformance|FuzzDigitorusPKCS7BoundedWork|1h
# crewjam/saml/xmlenc GCM authenticated-integrity — a tampered EncryptedAssertion ciphertext
# must never decrypt (GCM authenticates); catches an authenticated-encryption bypass. 1h.
internal/libconformance|FuzzXMLEncGCMIntegrity|1h
# Stateful model-based fuzzer: a fuzzed sequence of grant/revoke/read ops with the
# acting principal varied, checked against a shadow model (fail-closed authz — a
# principal with no read grant and no ownership must never read). Catches cross-op
# authz bugs a single-call harness can't (revoke-ineffective, grant-leak). 1h.
internal/core|FuzzCoreOperationSequence|1h
internal/core/rules|FuzzReturnToOpenRedirectDifferential|1h
# Dual-backend differential: the SAME op sequence run against SQLite and PostgreSQL
# in lockstep, compared after normalising ids/timestamps/order — the two backends are
# each other's oracle. Catches 'passes on SQLite, breaks on Postgres' bugs. Rig-only:
# SKIPS unless $KEYORIX_TEST_PG_DSN is set. 1h.
internal/storage/store|FuzzStorageBackendDifferential|1h
internal/storage/store|FuzzPaginationBounds|1h
# Live-API invariant fuzzer: a grant/revoke/read sequence driven against the real,
# fully-wired stack (NewRouter + auth middleware + handlers + core + crypto + storage)
# stood up in-process; reads go over HTTP, mutations via core with a token-cache flush.
# Asserts auth-required / fail-closed / tenant-isolation / no-plaintext-on-deny /
# integrity against a shadow authz model. SQLite-backed + CI-runnable (no PG needed);
# a Postgres-backed rig variant is Phase 2. 1h.
server/http|FuzzKeyorixHTTPAPISequence|1h
# TRUE concurrent (real goroutines) linearizability fuzzer for grant/revoke+read,
# RotateSecret+read, and session-revocation+read, checked against a sequential
# model via porcupine. Generalizes the #121 TOCTOU regression shape
# (concurrency_rotate_secret_test.go) across fuzzer-chosen goroutine counts,
# interleavings, and GOMAXPROCS. SQLite (production pool config) always; PostgreSQL
# when KEYORIX_TEST_PG_DSN is set. DEK/KEK envelope-key rotation is deliberately
# out of scope (exclusive-locked, single-process by construction — see the fuzz
# function's own doc comment). 1h.
server/http|FuzzConcurrentOpsLinearizable|1h
server/http|FuzzMultiTenantIsolation|1h
# gRPC<->REST authz-parity differential: reads the SAME secret over BOTH the real
# HTTP router and the real gRPC server (bufconn) with the same credential + fuzzed
# grants, asserting the authorization DECISION agrees (a mismatch is a
# transport-dependent auth bypass). The two transports are each other's oracle
# (no shadow model). SQLite-backed + CI-runnable; heavier (two live stacks), 1h.
server/http|FuzzGRPCRESTSecretReadAuthzParity|1h
# Canary secret-value leakage: plants unique per-iteration canary values, drives
# hostile op sequences (cross-project reads, malformed/oversized/wrong-content-type
# requests, rotation, version reads, deletes, audit queries, list/CSV-export
# endpoints) through the real HTTP router + gRPC server (bufconn), and scans every
# reachable channel (logs, every HTTP/gRPC response/header/metadata, the full SQLite
# schema via introspection, and the raw on-disk DB file) for the canary after every
# op and at sequence end. Exact-match oracle: a canary may appear only in the `value`
# field of one of three designated, permission-checked read endpoints for a principal
# the live shadow-grant model says may read that exact secret — anywhere else is a
# leak. A real encryption.Service is wired (not a no-op), so the plaintext-at-rest
# assertion is live. SQLite-backed + CI-runnable. 1h.
server/http|FuzzCanarySecretLeakage|1h
internal/csvsafe|FuzzCSVSafeFormulaNeutralization|1h
internal/storage/store|FuzzLikeEscapeInjection|1h
# Encoding-parity SSRF-blocklist invariant: for any IPv4 host, IsPrivateOrLinkLocal
# must give the SAME verdict across raw / IPv4-mapped / NAT64 / IPv4-compatible
# encodings (a private target reachable via one encoding but not another = SSRF gap;
# a public target blocked via one = broken IPv6-only NAT64 egress). Pure-function,
# fast; 1h.
internal/netutil|FuzzIPv4EmbeddingSSRFParity|1h
# Connection-TIME SSRF enforcement (Dialer.DialContext) — the layer the pure
# predicate above and the register-time admin-DSN check never reach. Fake
# resolver/dial seam (Dialer.Resolve/Dial, already overridable, no prod change)
# drives resolve->validate->pin->dial end to end: no dial to a disallowed
# address regardless of resolver sequence (checked on the DIALED IP, not the
# error), the dialed IP always matches the first validated resolution (DNS-
# rebinding TOCTOU), fail-closed on malformed/error/empty resolution, and an
# all-public/allowed round must always succeed (over-block regression guard,
# incl. NAT64, sibling to #1937). New; 1h.
internal/netutil|FuzzEgressDialEnforcement|1h
internal/core|FuzzAdminDSNHostSSRFGuard|1h
internal/identity|FuzzIdentityNormalizationStable|1h
internal/connect|FuzzConnectRefScoping|1h
# Response-side fuzzing of the 4 Connect backends (Vault, AWS Secrets Manager,
# Azure Key Vault, GCP Secret Manager) -- previously 0% fuzz coverage despite
# extensive example-based unit tests, per the mutation-testing coverage map.
# Each injects a REAL backend SDK client (not a hand-written interface fake)
# pointed at a fake endpoint via the existing newClient test seam, so the
# actual wire decode is exercised, not just post-decode field checks. Vault
# and AWS are fast (httptest.Server, ~thousands execs/sec); Azure implements
# the real two-step Key Vault challenge handshake and is fastest of all once
# warmed up; GCP is markedly slower (~500/s) because each execution spins up a
# real bufconn-backed gRPC server+client pair, not an HTTP handler -- New; 2h
# each for the 3 HTTP-family targets, 1h for GCP given the lower achievable
# exec rate.
internal/connect|FuzzVaultConnectorResponse|2h
internal/connect|FuzzAWSSMConnectorResponse|2h
internal/connect|FuzzAzureKVConnectorResponse|2h
internal/connect|FuzzGCPSMConnectorResponse|1h
# JSON request-body decode bounded-work: the stage before ANY handler logic runs,
# on every route incl. every unauthenticated one (login, password-reset, webauthn
# login-finish), plus the shared mustDecodeBody helper and both
# map[string]interface{}-decode routes found (alert-escalation Update,
# notification-channel Update — the only two in server/http/handlers). Asserts
# time+alloc stay linear in min(body, configured size cap), and that nesting past
# encoding/json's maxNestingDepth is rejected, not silently accepted. New; 1h.
server/http/handlers|FuzzJSONDecodeBoundedWork|1h
# Storage-interface-level fault injection (one layer above FuzzFaultInjectedOperations,
# which faults durability seams below the interface): fails/panics the Nth call of
# any storage.Storage method during one real REST/system/gRPC operation, driven
# through the actual router/grpc.Server (RecoveryInterceptor included), and asserts
# atomicity/panic-never-becomes-success/fail-closed-authz/no-mixed-commit/error-hygiene
# via a full-DB canonical snapshot. Each iteration is comparatively expensive (two
# fresh SQLite-backed worlds, a real httptest.Server, a real bufconn grpc.Server) —
# 1h given the lower achievable exec rate, matching this file's own precedent for
# HTTP-stack-dispatch targets above.
server/faultops|FuzzStorageFaultOperations|1h
# --- fuzz/new-surfaces-2026-09-24 ---
# ADR-108 §B admin-dispatch argument handling: isAdminDispatch's own routing
# predicate (server/main.go) plus, whenever it routes to admin, the real
# cobra command tree (server/admin.Execute) — argv-shaped fuzzing, asserting
# the routing decision stays razor-precise (never hijacking the plain
# server's --passphrase-fd/--passphrase-file/--passphrase-stdin flags),
# admin.Execute never panics/hangs (the "no admin command starts a listener"
# promise — a listener would manifest as a call that never returns), and an
# unrecognized subcommand always errors instead of silently no-op'ing. New;
# small, pure dispatch surface; 1h.
server|FuzzAdminDispatch|1h
# Standalone admin-CLI fault fuzzer for `keyorix-server admin encryption ...`
# (server/admin/fuzz_encryption_command_fault_test.go): drives the real
# runEncXxx/runAuthXxx entry points against a temp SQLite DB + temp keydir,
# faulting at the encryptionops call boundary -- real externally-observable
# failure conditions (corrupt key material, wrong passphrase, encryption
# disabled), not an injected test-only hook. Asserts the exclusive DB lock
# always releases, an audit event is written iff durable state actually
# changed, the command's error return matches whether the operation failed,
# and no success glyph appears on a failure path. Real SQLite DB + temp
# keydir per iteration, matching FuzzStorageFaultOperations' exec-rate
# precedent above; 1h.
server/admin|FuzzAdminEncryptionCommandFaultHandling|1h
# ADR-108's version-skew rule (cli/internal/skew, docs/cli-split-inventory.md
# §5): fuzzes the CLI/server version-identity tuple against Check's own
# documented contract -- the minimum_cli_version policy floor refuses only
# when BOTH sides parse as semver and either the major line differs or the
# CLI is below the floor, an unparseable side deliberately fails OPEN to the
# api_version epoch check (which itself can only allow or warn, never
# refuse), and Result's Reason/Warning fields stay mutually exclusive with
# Refuse. Pure, loop-bounded string comparison, no I/O; 1h.
cli/internal/skew|FuzzSkewCheck|1h
# Thin-CLI credentials file (cli/internal/credstore, ADR-108 PR 0): fuzzes
# FileStore.Load against arbitrary file bytes and arbitrary Unix permission
# bits on a real temp file, plus a symlink at the same path every iteration.
# Asserts the exact refusal threshold file.go's Load enforces
# (perm&0o077 != 0), unconditional symlink refusal, and that a refused/failed
# Load never returns a non-zero Credentials (no token/URL leak on the
# fail-closed path). Small, self-contained file-permission decode surface;
# 1h.
cli/internal/credstore|FuzzCredstoreLoad|1h
# Offline audit-chain verification (internal/auditverify, ADR-108 §B4,
# docs/design-b4-offline-audit-verify.md §3): fuzzes ParseExternalAnchorBundle
# against arbitrary bytes as the `--anchor` bundle JSON -- the one
# externally-supplied artifact this package parses that isn't already covered
# by FuzzAuditChainRowDecode's raw-SQLite-file target. Asserts a non-nil
# bundle is returned if and only if the input parses as JSON with non-empty
# head_hash/signature, and a nil bundle whenever err != nil. Small, pure JSON
# decode surface; new, no saturation data yet; 1h.
internal/auditverify|FuzzParseExternalAnchorBundle|1h
# `keyorix-server admin verify-audit --checkpoint-key-file` (server/admin,
# ADR-108 §B4): fuzzes readCheckpointKeyFile against arbitrary bytes written
# to a real temp file under fuzzed content, matching FuzzCredstoreLoad's
# write-fuzzed-bytes-to-a-real-file pattern. Asserts the documented hex-then-
# base64 decode precedence, refusal on empty/unparseable content, and that a
# refused read never returns a non-nil key. Small, self-contained file-content
# decode surface; new, no saturation data yet; 1h.
server/admin|FuzzCheckpointKeyFileParse|1h
# `keyorix-server admin restore --input` (server/admin, ADR-108 §B3, #2099
# coordinator review item 6): fuzzes readBackupArchive against arbitrary
# bytes written to a real temp file. The archive is operator-supplied input
# that may come from untrusted/removable media, so this asserts the two
# properties that matter most: never panics on malformed input, and never
# allocates beyond the (deliberately tiny, fuzz-configured) per-entry/total
# caps regardless of what the input claims to decompress to. New, no
# saturation data yet; 1h.
server/admin|FuzzReadBackupArchive|1h

# GET /api/v1/users/{id}/shared-secrets (#2025, ListSharedSecretsForUser) — a
# read query, so it can't join opCatalog (whose keys are checked against the
# mutating-only knownOperations registry). Same fault-injection world as
# FuzzStorageFaultOperations, narrower oracle (no non-AuditEvent state may
# ever change, success or failure) and a much smaller state space (one route,
# not the whole catalog) — 30m, no saturation data yet.
server/faultops|FuzzSharedSecretsViewNeverWrites|30m
# --- fuzz/jwt-single-constraint-violation-v2 ---
# Single-constraint-violation harness for the two JWT/OIDC verifiers: builds a
# fully valid token signed with the harness key, violates exactly one
# verification constraint per the fuzz input, asserts 0 violations => accept
# with the right identity, 1 violation => reject. Already found and closed one
# real gap (future-dated iat bypassing the max-age check) and one RFC 7515
# compliance gap (unrecognized crit header accepted) — see
# docs/findings/2026-09-23-FINDING-oidc-future-iat-and-crit.md. No saturation
# data yet (brand new); 1h each, matching this file's precedent for
# claims-semantics-focused JWT targets (FuzzOIDCVerifierClaims/FuzzVerifyIDTokenClaims
# above, not re-tuned here since they're owned by another session).
internal/core|FuzzOIDCIDTokenSingleConstraintViolation|1h
internal/core|FuzzSSOIDTokenSingleConstraintViolation|1h
# B4 offline audit-chain verifier (ADR-108, docs/design-b4-offline-audit-verify.md):
# feeds arbitrary bytes as a raw SQLite file to OpenSQLiteReadOnly ->
# StreamAuditEvents -> Verify. This is the one genuinely new attack surface the
# design calls out — a corrupted or adversarially crafted DB file handed to a
# read-only offline tool that must not crash or silently report VALID on
# malformed input, unlike every other read path in this codebase, which trusts
# the file it opens. New; 1h given the small, self-contained decode surface
# (no network, no auth, a single SELECT-and-scan loop).
internal/auditverify|FuzzAuditChainRowDecode|1h
# B2 admin recovery-key (docs/design-b2-recover-admin.md §2/§6's own explicit
# fuzz-target ask: "recovery-key decode/format parsing — malformed groupings,
# wrong length"). Normalize/Hash/Verify against arbitrary re-typed-key-shaped
# input — found and fixed a real Normalize idempotency bug on day one (a dash
# could shield an interior whitespace rune like \v from the strip pass,
# leaving it exposed only after a SECOND Normalize call — see
# internal/recoverykey/recoverykey.go's doc comment). Small, pure, no I/O; 1h.
internal/recoverykey|FuzzHashAndVerify|1h
