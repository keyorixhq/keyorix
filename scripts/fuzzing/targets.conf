# Canonical list of this repo's fuzz targets, validated against the tree by the
# CI drift-guard in .github/workflows/ci.yml: every `func FuzzXxx` in the tree
# must be declared here, and no declared target may be stale. The continuous rig
# itself runs the shared fuzz-harness runner (fuzz-runner.sh), which DISCOVERS
# targets dynamically — this file is the human-maintained cross-check, not
# consumed by the rig. Add a new target by adding a line here.
# Format: <go-package-path>|<FuzzFuncName>|<go-test-fuzztime>
#
# Lines starting with # or blank lines are ignored.
#
# Durations rebalanced 2026-09-13 from live saturation data: cycle was ~22h and
# front-loaded on targets that have long since saturated (CombineKEK/Azure at
# +0..+1 new-interesting per run) while the notary RFC3161/PKCS#7 DoS targets —
# the exact code the strict-DER guard (#1848) reworked, and still finding
# coverage (VerifyReceipt +76, RFC3161Anchor +33 per run) — sat at the end on
# 1h each, reached only ~once/day. Time is now weighted toward where coverage is
# still growing; saturated targets drop to 1h. Cycle ~16h. Re-tune from the next
# saturation snapshot, and raise a target's time when its package or a parsing
# dependency changes (that reopens coverage).
#
# Tier-1 batch added 2026-09-15 (#1889): PAT scope/CIDR decode, SCIM token
# strength, secret ACL/ref parsing, bundle key PEM parsing, encryption envelope
# deserialize, and the SAML response parse path. No saturation data yet (brand
# new); durations below are an initial security-weighted guess, not a
# measurement — re-tune once these have run a few cycles. FuzzParseResponse
# found a real signature-bypass on day one (an XML epilogue after the signed
# root was silently accepted — fixed same PR, internal/saml/provider.go), so it
# gets the largest new allocation.

# Saturated (+1/run) — 1h is enough to re-confirm clean each cycle.
internal/crypto|FuzzCombineKEK|1h
# OIDC id_token verify (golang-jwt). Mildly active (+5/run) and security-relevant
# (untrusted token parse), so 2h.
internal/core|FuzzOIDCVerifierVerify|2h
# SSO id_token signature-bypass rejection invariant (verifyIDToken, #1869): the
# fuzzer can't forge a JWKS-signed token, so any accepted non-genuine token is a
# real bypass. Security-relevant untrusted token parse, sibling to the OIDC target
# above, so 2h.
internal/core|FuzzVerifyIDToken|2h
# PAT scope/CIDR column decode on the request-authentication path (every
# PAT-authenticated request) — fail-closed contract (#r124): a corrupt non-empty
# column must deny, never silently widen to unrestricted. Runs on every request; 2h.
internal/core|FuzzDecodePATScopes|2h
internal/core|FuzzDecodePATCIDRs|2h
# Secret ACL permissions column decode — grant-direction counterpart to the PAT
# decoders above (empty/corrupt must decode to no grant, never fabricate one). 2h.
internal/core|FuzzDecodeSecretACLPerms|2h
# SCIM bearer token strength floor (startup guard, ValidateSCIMTokenStrength) — a
# regression here would silently reweaken provisioning auth. Small, pure function;
# 1h is plenty.
internal/core|FuzzValidateSCIMTokenStrength|1h
# "project/environment/name" secret reference parser — untrusted input from CLI
# args, API paths, and federated-secret lookups. No crypto, small state machine; 1h.
internal/core|FuzzParseSecretRef|1h
# Secret value / password policy Validate() over arbitrary attacker-controlled
# bytes (including invalid UTF-8). Pure validation logic, no parsing surface
# beyond string ops; 1h.
internal/core|FuzzSecretValuePolicyValidate|1h
internal/core|FuzzPasswordPolicyValidate|1h
# Saturated (+0/run) — dropped from 3h to 1h.
internal/rotation|FuzzAzureGenerateUpstreamRef|1h
# Hand-rolled SQL escaping in the Postgres/MySQL rotation backends
# (postgres.go/mysql.go) — the rotation_ref trust boundary. Both saturated
# (+0/run) and the escaping logic is small, so 1h each (down from 2h).
internal/rotation|FuzzPostgresQuoting|1h
internal/rotation|FuzzMySQLQuoteString|1h
# Hand-rolled byte-index parser for "${secret:<ref>}" placeholder syntax
# (internal/secrettemplate/render.go's parse) — small; 1h is plenty.
internal/secrettemplate|FuzzParse|1h
# AES-256-GCM decryption path: arbitrary JSON EncryptedData blobs into
# Decrypt/DecryptWithAAD (nonce-length guard, GCM Open panic surface, AAD
# mismatch). Near-saturated (+2/run), so 1h (down from 2h); the chunked variant
# separately exercises the reorder/splice/duplicate-index guards.
internal/encryption|FuzzDecrypt|1h
internal/encryption|FuzzDecryptChunked|1h
# JSON envelope parse that runs BEFORE decryption on data read back from storage or
# a remote backend (a tampered/corrupted stored blob) — isolates the parse step
# from FuzzDecrypt above so a malformed envelope is caught here, not behind the
# KEK. Same tier as the decrypt targets; 1h.
internal/encryption|FuzzDeserializeEncryptedData|1h
# SAML IdP metadata XML parsing (crewjam/saml + mattermost/xml-roundtrip-validator).
# Metadata path is saturated (+1/run); 1h.
internal/saml|FuzzSAMLMetadata|1h
# SAML ACS response parse: signature verification against the pinned IdP cert, on
# the unauthenticated /auth/saml/{provider}/acs endpoint — fully attacker-controlled
# bytes. Found a real signature-bypass on day one (see the 2026-09-15 note above);
# highest-severity new target in this batch, so 3h, same tier as the notary parsers.
internal/saml|FuzzParseResponse|3h
# Air-gapped bundle: streaming gzip+tar → manifest JSON → ed25519 sig → per-
# component sha256. Saturated (+0/run); 1h (down from 2h). Raise again on any
# change to the bundle format or its gzip/tar handling.
internal/bundle|FuzzBundleVerify|1h
# PEM/PKCS#8 parse of the operator-supplied ed25519 bundle-signing key. Operator
# input, not a live attacker channel, but classic PEM/x509 panic/OOB surface; 1h.
internal/bundle|FuzzParsePrivateKeyPEM|1h
# RFC 3161 TimeStampToken: digitorus/timestamp.Parse (RFC 3161 ASN.1) and
# digitorus/pkcs7.Parse (PKCS#7 envelope) inside VerifyReceipt. This is the
# amplification/DoS surface the strict-DER guard (#1848) reworked; still finding
# new coverage (+76/run) against the new guard code, and the highest-severity
# parser we run — so 3h (up from 1h), the largest slice in the cycle.
internal/notary|FuzzVerifyReceipt|3h
# RFC 3161 Anchor(): same digitorus/timestamp.ParseResponse call on the TSA
# response body (network-reachable TSA), same parser family. Still climbing
# (+33/run); 2h (up from 1h).
internal/notary|FuzzRFC3161Anchor|2h
