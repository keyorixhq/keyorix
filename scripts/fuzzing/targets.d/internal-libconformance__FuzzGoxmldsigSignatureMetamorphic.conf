# goxmldsig signature metamorphic (task XM1): drives goxmldsig's signer+validator directly — the
# only target that does. Oracle SIG-1 (gated, sound): sign the fuzzed element enveloped, serialise,
# Validate; IF it verifies, add an attribute to the signed root (included by exclusive-C14N in the
# digest) and Validate again — the tampered document must NOT verify. A tampered document that
# still verifies is a TAMPER-ACCEPTED (signature-integrity) candidate. The "sign always verifies"
# and "equivalent re-serialisation keeps the verdict" directions are deliberately NOT asserted
# (both can fail benignly). RSA sign per input bounds the exec rate; small coverage map: 1h.
internal/libconformance|FuzzGoxmldsigSignatureMetamorphic|1h
