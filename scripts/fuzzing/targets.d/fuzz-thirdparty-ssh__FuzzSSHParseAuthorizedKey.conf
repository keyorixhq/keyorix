# Round-trip-stability fuzz of golang.org/x/crypto/ssh.ParseAuthorizedKey, the
# path server/admin/recovery_key_encrypt.go uses to accept an admin-supplied
# recovery-key recipient. Oracle: parse -> MarshalAuthorizedKey -> parse is a
# stable fixed point (same wire form + type), and arbitrary bytes never panic.
# Does NOT check key-acceptance policy / weak-key rejection / comment round-trip
# (see fuzz/thirdparty/ssh). 5m.
fuzz/thirdparty/ssh|FuzzSSHParseAuthorizedKey|5m
