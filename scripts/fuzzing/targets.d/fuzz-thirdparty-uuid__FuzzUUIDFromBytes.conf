# Byte-path oracle for github.com/google/uuid: FromBytes errors iff len!=16 and
# round-trips (String -> Parse) to the same 16 bytes. This IS the AAGUID path
# that go-webauthn drives from attacker attestation bytes (the reachable sink),
# though uuid is well-maintained so yield is expected low. 5m.
fuzz/thirdparty/uuid|FuzzUUIDFromBytes|5m
