# LIB-FUZZ-1: pquerna/otp at keyorix's exact configuration (SHA1/6/30s, +-1 step done
# by keyorix). validateTOTPStep is checked against an independent RFC 4226 HMAC-SHA1
# implementation: a code verifies iff it belongs to the current step or one either
# side, the returned step is the step that produced the code (the value replay
# protection marks), non-digit/non-ASCII text never verifies, and a corrupted stored
# secret never verifies anything the reference cannot derive. ~800 execs/s locally
# (40s, no finding); 30m on the rig is ~1.4M execs.
internal/core|FuzzValidateTOTPStep|30m
