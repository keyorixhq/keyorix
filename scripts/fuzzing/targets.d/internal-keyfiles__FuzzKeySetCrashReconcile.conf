# FS1 storage-fault campaign: crash-RECONCILE fuzzing of the key-set manifest
# (#2900/ADR-112) reader path — the canonical "no torn key material is ever
# accepted as valid" seam. Manufactures post-crash/tampered on-disk key sets
# (clean, foreign/mixed-generation, partial, finishable interrupted rotate-kek,
# completed-commit-lost, stuck-incoherent, torn manifest) and drives the real
# InspectKeySet / VerifyKeySetConsistency / ReconcileKeySet. Asserts a set that
# is not one coherent generation is always refused, a successful reconcile
# leaves every file hashing to its committed manifest entry, and a refused one
# leaves old files unchanged (old-or-new). Reader counterpart to
# internal/encryption's WRITE-seam fault fuzzing. Red-proofed. Fast reconcile
# surface; 30m.
internal/keyfiles|FuzzKeySetCrashReconcile|30m
