# --- fuzz/agp1-airgap-egress ---
# AGP1: fuzzes parseProcNetLine against arbitrary bytes — the /proc/<pid>/net/
# {tcp,tcp6,udp,udp6} row parser the OS-level air-gap sampler uses to detect a
# child's direct (non-proxy) egress attempts. Must never panic and must not
# mis-decode a loopback row into a routable address (which would make the sampler
# miss a real egress). New target, no saturation data; 1h to start.
internal/fuzzutil/osairgap|FuzzProcNetParser|1h
