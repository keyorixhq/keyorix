# Red-proof arm for swarm testing of FuzzAuthzSeq, not a regression target: it
# decodes the input like FuzzAuthzSeq but runs only the decoder and a planted
# harness-level oracle (no 3-world build). Every execution is skipped unless
# KEYORIX_SWARM_PLANT=1, which the rig does not set, so a rig run is an inert
# seed pass; it is declared only because the fuzz-targets drift guard requires
# every FuzzXxx function in the tree to have a targets.d entry. The short
# duration is deliberate. See server/authzdiff/seq_swarm_test.go.
server/authzdiff|FuzzAuthzSeqSwarmPlant|1m
