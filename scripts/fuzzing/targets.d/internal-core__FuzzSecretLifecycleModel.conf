# Op-sequence fuzzer over secret version history and lifecycle: create / update /
# rotate / rollback / soft-delete / restore / retention purge on three slots,
# against a per-slot model of the plaintext version list; after every op the
# real store must agree on state, version numbers, every version's plaintext,
# "soft-deleted serves no value but keeps its history" and "purged leaves no
# node, version or ACL row". SQLite only, no bcrypt/KDF. Red-proofed with 3
# planted bugs (rollback-to-current accepted, purge keeps ciphertext versions,
# purge ignores the frozen purge date). The store
# stamps real time, so purge dates are moved by an explicit expire op.
# ~100 execs/s: 30m on pve01/vCD; the Mac runs at most 60s.
internal/core|FuzzSecretLifecycleModel|30m
