# KEYCOMMIT-2: pqwrap keyset v1 KEK slot, deny direction. For fuzzer-chosen (KEK A,
# KEK B, DEK, kek_id A, kek_id B), a keyset sealed by the real pqwrap.SealKeyset must
# open under A to its DEK and kek_id (positive control), must not open under B != A,
# and must not open under A once its stored kek_id is rewritten (every single byte,
# then replaced by B's id) with the MAC untouched. kek_id is NOT in the slot AAD; the
# keyset MAC is what binds it. Red-proofed by planted openers that drop the MAC and
# KCV or ignore the KEK (TestKeyCommitmentPQWrap_RedProof). A regression guard for
# the keyset format, not a search; pure, ~800 execs/s; 15m.
internal/encryption|FuzzPQWrapKEKSlotDeny|15m
