# SP1: the key-Secret manifest serializer (renderKeySecret) and its inverse
# parser (UnpackKeySecret) as a render/unpack ROUND-TRIP over real key material.
# `admin encryption key-secret` renders a DEK/salt/wrapped-key set to a k8s
# Secret manifest; `… unpack` base64-decodes it back onto disk — these files ARE
# the key material that decrypts the DB, so a round-trip that drops or mangles a
# byte is silent key loss. Oracle: for any validly-named key set with arbitrary
# bytes, render->unpack must succeed and reproduce the exact file-name set with
# byte-identical contents (exercises YAML quoting of names + base64 of contents
# for every byte pattern). resguard meters disk_bytes/disk_files + alloc (bounded
# work; UnpackKeySecret writes the decoded files). Disk-bound (fsync per file),
# so lower exec/s; 1h. Committed red/green: TestResguardKeySecretRoundTripRedGreen.
