# TLS-LIFECYCLE (concurrent load): the Reloader's lock and pair-swap invariants under
# concurrent GetCertificate callers. N=4 goroutines (2 direct GetCertificate readers,
# 2 real TLS handshakes against an in-process loopback listener) run against a
# fuzz-driven program of cert/key file mutations: full pair write, cert-only or
# key-only replacement (the half-rotation window), truncated cert, empty cert, delete,
# symlink swap, in-place and rename-based replacements with preserved mtime. CheckInterval
# pinned to 0; reloads driven explicitly, no sleeps. Race detector enabled (-race). 1h.
internal/tlsreload|FuzzReloaderConcurrentLoad|1h
