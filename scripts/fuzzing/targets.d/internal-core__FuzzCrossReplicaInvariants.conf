# GUARD-4: a strict-PAIR two-replica Postgres fuzzer purpose-built for the
# CTA-parent class of cross-replica check-then-act gaps (#2646-#2660): a
# destructive op (delete/suspend/revoke/disable) on one replica racing a
# constructive op (create/restore/grant/enable) on the other, with GLOBAL
# invariants re-checked after EVERY PAIR, not once at the end of a whole
# fuzzed program the way FuzzCrossReplicaOps (this directory's other
# two-replica fuzzer) checks its own, disjoint oracle set. Checks: at least
# one live global admin; no live share/ACL/lease/environment under a deleted
# parent; no revoked membership with a live role grant; a suspended user
# stays so; the secret-dependency graph stays acyclic; an access-review
# decision's effect is actually applied; the audit hash chain verifies.
# Postgres-only; skips cleanly when KEYORIX_TEST_PG_DSN is unset.
#
# Already caught (this exact fuzzer, blind concurrent racing, no forced
# interleave): #2650 (SetSecretAutoRotate vs DeleteSecret), reliably within a
# 40-iteration local burst — see testdata/fuzz-pending/2650/ and this
# session's PR body for the red/green proof (GUARD-4).
#
# 1h: matches internal-core__FuzzCrossReplicaOps.conf's own budget for the
# same two-independent-*gorm.DB-pool shape; a local 90s burst already found
# one real open issue (#2650) and reliably reproduces five more
# (#2651-#2654, #2656) given ~100 reps, so a 1h nightly run has substantial
# room to also hit the narrower-window pairs (#2646/#2647/#2649/#2655/#2657/
# #2659) that blind racing did not reproduce within a few hundred attempts
# locally — see testdata/fuzz-pending/ for all eleven open-issue seeds.
# GUARD-5 (2026-10-05), READ THIS BEFORE TRUSTING A CLEAN RUN FROM THE SHARED
# RIG: this target needs a real multi-connection PostgreSQL server and SKIPS
# OUTRIGHT without KEYORIX_TEST_PG_DSN, which the shared fuzz-harness rig does
# not provide. On that rig it reports a clean run forever -- indistinguishable
# from working. Its real long run is a separate systemd unit with its own
# throwaway Postgres: scripts/fuzzing/nightly-cross-replica.sh, documented in
# docs/fuzzing/cross-replica-nightly.md. The 1h budget below applies only
# where a DSN is actually set.
#
# Also GUARD-5: the "did not reproduce within a few hundred attempts" note
# above had four causes in the fuzzer itself, not in the width of the race
# window -- the replica was picked from the op kind (so half of all pairs ran
# on ONE replica), the whole share/ACL op family could not execute for want of
# a project role, InviteMember was dead after its first success, and two seeds
# had no oracle at all. All fixed in #2768. With those fixed, blind fuzzing
# reproduces #2649 in about SEVEN SECONDS, so until the #2664/#2667/#2668/
# #2669/#2671-#2675 fix stack lands, a long run needs the nightly script's
# KNOWN_OPEN_CLASSES suppression or it will only ever re-report those.
internal/core|FuzzCrossReplicaInvariants|1h
