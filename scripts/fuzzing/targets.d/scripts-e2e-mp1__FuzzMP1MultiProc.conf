# MP1 multi-process PostgreSQL race fuzzer (backlog I1). Boots 3 real
# keyorix-server OS processes against ONE shared PostgreSQL database (the
# ADR-039 HA shape) and drives a fuzz-chosen interleaving of concurrent secret
# writes across the replicas. Per iteration it checks cross-replica convergence
# (post-return visibility — secret VALUES are DB-authoritative, not cached
# cross-replica) and the single-register serial-equivalence necessary condition
# (the surviving value was set by some acknowledged write). REAL fuzzing needs
# `-tags e2e` AND KEYORIX_TEST_PG_DSN; a tag-less rig run hits a skip stub
# (fuzz_noe2e_test.go) so this stays listable for the fuzz-targets guard without
# requiring the rig to boot a cluster. 10m.
scripts/e2e/mp1|FuzzMP1MultiProc|10m
