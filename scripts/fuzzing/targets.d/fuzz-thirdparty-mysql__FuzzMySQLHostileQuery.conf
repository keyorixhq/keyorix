# Hostile-server fuzzing of go-sql-driver/mysql PAST the handshake (session h5):
# a fixed valid handshake + native-password auth, then fuzz-controlled result-set
# response groups (prepare-OK, column definitions, EOF, text rows, binary rows
# with NULL bitmaps, OK/ERR headers) while the client runs a text query, a binary
# prepared-statement query (COM_STMT_PREPARE + COM_STMT_EXECUTE — the path
# internal/dynamic killUserConnections reaches on revoke) or an exec, all through
# the database/sql public API. Oracles: no panic (confirmed library bugs
# allowlisted with reproducers), no hang, bounded alloc, canary never in an error
# or decoded value, truncated row must error. Loopback TCP; hostile inputs that
# stall the handshake cost up to ~1s each, so effective exec rate is modest.
fuzz/thirdparty/mysql|FuzzMySQLHostileQuery|10m
