# Backup / restore / key-rotation as one state machine (C2): a random sequence
# over {rotate-dek, rotate-kek, backup, restore-to-clean-host, kill-at-a-seam,
# start-the-server-once, read-all-secrets} against one single-key-dir SQLite
# install, with two oracles that cannot false-positive -- the backup contract
# (refuse-no-archive, or restore+decrypt on a clean host) and ledger equality
# (same secret names/versions/values before and after). Each exec drives real
# admin backup/restore round trips, so a few seconds per op; 15m.
server/admin|FuzzBackupRotationSequences|15m
