# PostgreSQL leg of FuzzProcessCrashRecovery: a re-executed child runs one real
# admin or core operation against a per-exec clone database and SIGKILLs itself,
# or cuts its connection, at the Nth write seam (a wire-protocol forwarder inside
# the child, plus the key-file durability seams). Skips without
# KEYORIX_TEST_PG_DSN. On a low-latency server an exec is seconds; through a
# high-latency tunnel it is minutes. The kill-point sweep
# (TestProcessCrashPGExhaustive) is what covers every seam, not this budget.
internal/encryption|FuzzProcessCrashRecoveryPG|15m
