# WIRE-PROTOCOL (B1): gRPC MESSAGE framing on a valid HTTP/2 stream to the real gRPC
# server. Fuzzes the 5-byte length-prefix (compression flag + 4-byte length): bad
# declared lengths (longer than payload, 4 GiB claim), compressed-flag-without-
# encoding, truncated messages, multiple messages + trailing partial prefix,
# oversized payloads, mismatched content-type. Oracles: no panic/hang/bounded alloc
# (a 4 GiB prefix must not pre-allocate 4 GiB — MaxRecvMsgSize must bound it); secret
# plaintext never returned without an authorizing credential on the wire.
server/wirefuzz|FuzzWireGRPCFraming|20m
