# WIRE-PROTOCOL (B1): gRPC MESSAGE framing on a valid HTTP/2 stream to the real gRPC
# server. Fuzzes the 5-byte length-prefix (compression flag + 4-byte length): bad
# declared lengths (longer than payload, 4 GiB claim), compressed-flag-without-
# encoding, truncated messages, multiple messages + trailing partial prefix,
# oversized payloads, mismatched content-type, and a valid GetSecretRequest for secret
# A or B (the only shape that can reach a secret). Oracles: no panic/hang/bounded
# alloc (a 4 GiB prefix must not pre-allocate 4 GiB — MaxRecvMsgSize must bound it);
# secret plaintext never returned unless the stream's credential is authorized to
# read it; after the abuse a fresh connection must complete a real unauthenticated
# RPC. The connection is never half-closed before the response is read.
server/wirefuzz|FuzzWireGRPCFraming|20m
