# Storage-interface-level fault injection (one layer above FuzzFaultInjectedOperations,
# which faults durability seams below the interface): fails/panics the Nth call of
# any storage.Storage method during one real REST/system/gRPC operation, driven
# through the actual router/grpc.Server (RecoveryInterceptor included), and asserts
# atomicity/panic-never-becomes-success/fail-closed-authz/no-mixed-commit/error-hygiene
# via a full-DB canonical snapshot. Each iteration is comparatively expensive (two
# fresh SQLite-backed worlds, a real httptest.Server, a real bufconn grpc.Server) —
# 1h given the lower achievable exec rate, matching this file's own precedent for
# HTTP-stack-dispatch targets above.
server/faultops|FuzzStorageFaultOperations|1h
