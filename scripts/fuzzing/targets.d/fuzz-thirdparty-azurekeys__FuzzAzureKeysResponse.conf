# Hostile-SERVER fuzz of azure-sdk-for-go keyvault/azkeys response decode (the Azure
# Key Vault KMS provider in internal/crypto/azurekms: WrapKey at first run, UnwrapKey
# on every secret read, against an operator-configured vault URL). Drives a real
# azkeys.Client (transport override) at an httptest TLS server returning fuzzer-
# controlled JSON bodies (status + body), with a fake TokenCredential handing out a
# bearer-token canary (azcore refuses to attach a token over plaintext http, so TLS is
# required to reach the decode path). Oracles: no panic, bounded time, no goroutine/fd
# leak, fail-closed on non-2xx, no retry storm, no bearer token in error. Does NOT
# verify the redirect SSRF guard (a dial-time transport property) or envelope MAC. 5m.
fuzz/thirdparty/azurekeys|FuzzAzureKeysResponse|5m
