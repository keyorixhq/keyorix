# KEYCOMMIT-1: key-commitment deny direction. For fuzzer-chosen (K1, K2, plaintext,
# AAD), a value sealed by the real EncryptWithAAD and a DEK sealed by the real
# wrapKey under K1 must never authenticate under K2 != K1 (positive control: K1
# opens). Red-proofed by a planted key-ignoring AEAD in the same file. AES-GCM
# gives this by construction, so this is a regression guard for a change of
# primitive or wrapper, not a search; pure, fast (~2k execs/s); 15m.
internal/encryption|FuzzKeyCommitmentDeny|15m
