# Hostile-SERVER fuzz of wneessen/go-mail's SMTP dialogue parser (the client Keyorix
# uses for setup-link/notification email via an operator-configured relay). Drives a
# real mail.Client (NoTLS, auth configured with a password canary) against a loopback
# server whose entire server-side script is fuzzer-controlled: mutated greeting, EHLO
# capability lists, multiline continuations, over-long lines. Oracles: no panic,
# bounded time, no goroutine/fd leak, and the password is NEVER sent in cleartext nor
# echoed in an error. Does NOT fuzz TLS transport or error-on-malformed. 5m.
fuzz/thirdparty/smtp|FuzzSMTPDialogue|5m
