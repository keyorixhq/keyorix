# FUZZ-GAPS G5: single-node auth-cache-vs-DB differential (K9 part 1; the
# two-replica part is a separate, later track). Drives random sequences of
# login / PAT create / machine-token issue, interleaved with revoke / suspend
# / role-change / password-change / session-delete / expiry mutations and
# authenticated requests, over a real sqlite-backed *core.KeyorixCore and the
# real Authentication middleware chain. Oracle: the cache-serving decision for
# a request must equal the decision the same request gets with that token's
# cache entry forced out (straight to storage) -- any divergence is a stale/
# wrong cached auth decision. Regression coverage for #1955 (re-verify on
# every cache hit), #1878 (session-expiry clamp), and #1985 (role-lookup
# error fails closed) by construction of that oracle, not by re-deriving each
# fix's own mechanism. Found a real, separately-fixed divergence within
# seconds of its first fuzzing run (see docs/security-closures.tsv's
# account-state-reactivate-pat-tombstone-001, PR #2206) -- not reachable from
# this harness's own seed corpus, only from its random mutation, so this PR's
# CI stays independent of that fix's merge order. Small, pure in-process
# world (no HTTP-stack dispatch); 1h.
server/middleware|FuzzAuthCacheDifferential|1h
