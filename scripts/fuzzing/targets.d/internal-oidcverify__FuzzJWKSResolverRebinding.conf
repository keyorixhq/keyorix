# EGRESS-REBIND-1 DNS rebinding at a link-local egress site: OIDC JWKS fetch client (S11, E09).
# Dials a hostname through the REAL transport's DialContext while an in-process DNS stub
# (internal/fuzzutil/egressref RebindDNS, installed behind net.DefaultResolver) answers
# {first, second} to the first lookup and 169.254.169.254 to every later one. Oracle: the
# whole first set is refused when the link-local tier refuses ANY address in it; a permitted
# set connects to the validated address (loopback, the harness's own listener), never to the
# later answer; one A and one AAAA query per dial. Reference verdicts come from octet
# arithmetic, no netutil call. Does NOT verify a real DNS server, the cgo resolver or the
# egress-proxy case.
# New; pure and fast (about 2k-6k execs/s), 5m.
internal/oidcverify|FuzzJWKSResolverRebinding|5m
