# FS1 storage-fault campaign: crash-replay fuzzing of the thin-CLI credential
# store. Save() writes in place (no fsync, no temp+rename) so a crash mid-Save
# can leave a torn credentials.yaml; this fuzzes what Load() does with it.
# Asserts Save then Load round-trips, an existing file that does not decode as
# YAML is surfaced as an error (never a silently-returned zero/partial
# Credentials), and Load never panics or leaks fds. Complements the existing
# FuzzCredstoreLoad (which fuzzes Load against arbitrary bytes/permissions):
# this adds the Save->Load round-trip and the non-atomic-Save angle (FS1-F1).
# Red-proofed. Fast YAML surface; 30m.
cli/internal/credstore|FuzzCredStoreCrashReplay|30m
