# TOTP verify-path mutation oracle (pquerna/otp lib-contract, keyorix MFA call path:
# internal/core/mfa.go validateTOTPStep). With the verifier configured as keyorix
# configures it (SHA1, 6 digits, 30s, +/-1 step window), a code is accepted only if it
# equals a window code; a one-digit mutation that is not a window code must be rejected.
# Pins RFC 4226/6238 conformance (companion KATs) and guards against a loosened window.
# Leaf package, saturates fast; 20m.
internal/libconformance|FuzzTOTPMutation|20m
