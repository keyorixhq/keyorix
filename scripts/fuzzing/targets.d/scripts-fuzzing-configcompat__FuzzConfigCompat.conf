# CONFIG-COMPAT (scripts/fuzzing/configcompat, RULES.md): a cross-release config
# compatibility differential. Seeds are the shipped example configs pulled from old
# release tags; the target checks, against the real config.Load/Validate at HEAD,
# that an old-rev config still loads or is refused by name (I1), never has a security
# posture holding that no explicit key or documented default explains (I2), and that a
# deprecated key keeps its old meaning and warns by name (I3). Pure in-memory plus one
# temp dir. Initial 30m, not a measurement: re-tune from the first saturation snapshot.
scripts/fuzzing/configcompat|FuzzConfigCompat|30m
