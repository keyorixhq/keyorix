# WIRE-PROTOCOL (B1): raw HTTP/1.1 bytes to the production net/http parser with the
# real router + auth + handlers stood up in-process on a loopback listener. Two lanes.
# STRUCTURED (first byte < 0x80): fixed framing variants selected by the input
# (absolute/authority-form targets, Host mismatches, duplicate & obs-fold headers,
# CL/TE combinations CL.TE/TE.CL/TE.TE with a canary request embedded in the declared
# body, chunk extensions, trailers, pipelining, oversized headers, encoded CRLF
# payloads in ref=, a path segment and Origin). RAW (first byte >= 0x80): fuzz bytes
# become framing bytes (Content-Length off by k / odd forms, chunk-size tokens incl.
# hex overflow, CR / bare-LF terminators, whitespace before the colon, TE value
# variants, a raw header, a verbatim tail). Oracles: no panic/hang/bounded alloc;
# structured lane only: handler invocations <= top-level requests, a body-embedded
# canary is never dispatched, no injected response header / extra 2xx; both lanes:
# secret plaintext never returned in the response to a request that did not present
# an authorizing credential (paired per request, not per connection). Clients never
# half-close before reading. In-memory SQLite-backed; moderate per-exec cost (real
# TCP + bcrypt-seeded stack built once).
server/wirefuzz|FuzzWireHTTP1|30m
