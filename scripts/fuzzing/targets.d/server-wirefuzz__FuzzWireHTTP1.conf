# WIRE-PROTOCOL (B1): raw HTTP/1.1 bytes to the production net/http parser with the
# real router + auth + handlers stood up in-process on a loopback listener. Attacks
# request framing/smuggling: absolute/authority-form targets, Host mismatches,
# duplicate & obs-fold headers, CL/TE combinations (CL.TE/TE.CL/TE.TE) with a
# canary request embedded in the declared body, chunk extensions, trailers,
# pipelining, oversized headers. Oracles: no panic/hang/bounded alloc; handler
# invocations <= top-level requests (smuggling); a body-embedded canary request is
# never dispatched; secret plaintext never returned without an authorizing
# credential on the wire; no injected response header / extra 2xx. In-memory
# SQLite-backed; moderate per-exec cost (real TCP + bcrypt-seeded stack built once).
server/wirefuzz|FuzzWireHTTP1|30m
