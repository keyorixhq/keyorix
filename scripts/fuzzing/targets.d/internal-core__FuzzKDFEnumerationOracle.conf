# Account-enumeration-by-difference oracle on the local bcrypt login path
# (VerifyPasswordCredentials). For a fuzzer-chosen (password, absent-username) it
# drives every account-existence class — known-active, known-wrong, locked,
# deactivated, suspended, reset-required, guaranteed-absent — over a real world
# (SQLite always, PostgreSQL when KEYORIX_TEST_PG_DSN is set) and asserts via the
# KDF1 counter (internal/kdfmeter, read through resguard's KDFMeter) that EVERY
# class spends exactly 1 bcrypt compare and 0 generates, plus DB-round-trip parity
# across the classes that must match the absent baseline. Catches the classic
# enumeration bug (not-found path skipping the dummy-hash equaliser) deterministically
# where a wall-clock test is flaky. New (KDF1). 1h.
internal/core|FuzzKDFEnumerationOracle|1h
