# LIB-FUZZ-1: filippo.io/age recipient strings as `admin recovery-key rotate
# --recipient` parses them (age1... X25519, age1pq1... hybrid). Oracles: one of
# (recipient, error); dispatch by prefix gives the right type and never falls through to
# the file branch; an accepted spec is canonical; a spec 1..4 characters away from a
# valid X25519 recipient is refused (bech32 BCH guarantee), so the key is never
# encrypted to a recipient the operator did not name. ~4K execs/s locally (30s). 15m.
server/admin|FuzzRecoveryKeyRecipientSpec|15m
