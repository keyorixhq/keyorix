# Operator reconcile run TWICE over a fake cluster that also holds a populated second
# tenant (tenant-b): the reconcile must converge (target Secret ResourceVersion and Ready
# reason stable on the second pass over a stable upstream), must only ever Get/Update/
# Create/Delete in its own namespace and List scoped to it (every op's namespace recorded
# by an interceptor), must never touch tenant-b's identically-named victim/token Secrets,
# never leak the canary, and keep upstream fetches + goroutines bounded. Closes the
# idempotence/convergence and strong-scope gaps the other two reconcile targets leave open.
# Full reconcile twice per input, 10m.
operator/internal/controller|FuzzReconcileIdempotentScopeConfined|10m
