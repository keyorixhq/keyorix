# SP1: the GORM SQLite DDL parser (parseDDL) + printer (ddl.compile) as a
# parse/print ROUND-TRIP and DIFFERENTIAL-vs-real-engine target. The migrator
# reads persisted CREATE TABLE text out of sqlite_master, parses it, mutates the
# ddl and compiles it back to run against the live DB, so a parse/compile
# disagreement corrupts a migration. Oracles: (1) compile()'s output must
# re-parse, preserve parsed column metadata, and be an idempotent fixed point;
# (2) on engine-valid input, the recompiled DDL must be accepted by the real
# modernc SQLite engine with the same column names in order. resguard meters
# alloc/mallocs (bounded-work on the regex-heavy, O(n^2)-shaped parser). Scoped
# to valid-UTF-8 input (the ddlmod []rune conversion is lossy on non-UTF-8 — a
# documented third-party quirk, not reachable for ASCII Keyorix identifiers).
# Stateless, high exec/s; 30m.
internal/storage/sqlitedialect|FuzzSqliteDDLRoundTrip|30m
