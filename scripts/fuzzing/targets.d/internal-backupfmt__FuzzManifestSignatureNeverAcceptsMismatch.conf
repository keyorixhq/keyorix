# Backup v2 manifest signature (internal/backupfmt, design-b3-backup-v2.md
# §5.2/§5.4): the v2 manifest's own HMAC-SHA256 had zero fuzz coverage before
# this target -- server/admin's FuzzReadBackupArchive only exercises the v1
# physical-format path. Differentially checks the fixed point SignManifest/
# VerifyManifestSignature imply for ANY JSON that parses as a Manifest: a
# fresh re-sign under the real key always verifies, and the ORIGINAL's own
# stored signature verifies if and only if it equals that recomputation --
# never for a mismatch. Small, pure HMAC/JSON surface; new, no saturation
# data yet; 1h.
internal/backupfmt|FuzzManifestSignatureNeverAcceptsMismatch|1h
