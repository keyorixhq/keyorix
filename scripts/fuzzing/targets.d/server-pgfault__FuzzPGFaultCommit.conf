# FS-PG: REAL PostgreSQL fault coverage. A TCP fault proxy sits between keyorix's
# storage layer and a real PostgreSQL server and cuts or stalls the connection at
# an input-chosen point of the v3 wire protocol — including the ambiguous-commit
# window (COMMIT sent, acknowledgement not yet received). It drives keyorix's
# production audit-commit path (store.LocalStorage.LogAuditEvent: hash-chained,
# group-committed) through the cut and asserts the durability oracles: no
# acknowledged commit is lost, the audit hash chain stays intact (no torn row),
# and an ambiguous commit is never reported as a false success. This is the
# real-fault counterpart to server/faultops (interface-level mock faults) and the
# PostgreSQL counterpart to scripts/powercut (SQLite-only, block-device cut).
#
# PG-GATED: skips without KEYORIX_TEST_PG_DSN; every write lands in a throwaway
# fspg_<pid>_<n> database that is dropped on cleanup — the server process is never
# signalled. Low exec throughput by nature (each input runs real remote commits
# plus, for stall inputs, a real timeout), so this is a soak target, not a
# high-exec one; per-input time and allocation are bounded (see the fuzz file's
# header). 30m.
server/pgfault|FuzzPGFaultCommit|30m
