# KEYCOMMIT-2: pqwrap keyset v1 KEK slot, partition direction. For fuzzer-chosen (KEK
# A, KEK B, nonce, ciphertext prefix, kek_id) it crafts a GHASH key-multi-collision for
# the slot's real AAD (header||0), checks with stock crypto/cipher GCM that it opens
# under both keys (a failure is a harness bug), wraps it in a keyset MACed under A and
# requires that the real OpenKeyset does not open it under both. Red-proofed by a
# planted slot-only opener (TestKeyCommitmentPQWrap_RedProof); where the real open
# stops (KCV under the MACing KEK, MAC under the other) is pinned by
# TestKeyCommitment_PQWrapPartitionedSlot_RefusedAtMACAndKCV. Recipient-free keysets
# only. Pure, ~900 execs/s; 15m.
internal/encryption|FuzzPQWrapKEKSlotPartition|15m
