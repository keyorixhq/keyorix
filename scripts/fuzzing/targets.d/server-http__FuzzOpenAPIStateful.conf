# Schema-driven STATEFUL REST fuzzer. The operation set AND the request shapes come from
# the live OpenAPI document (server/http/handlers/openapi.yaml, loaded with kin-openapi),
# not a hand-written table: 307 operations across 246 paths are enumerated from the spec,
# request args are generated from the schemas (valid / boundary / schema-violating), and
# ids returned by a 2xx response are bound into per-resource pools and fed to later calls'
# path params and *_id body fields (a successful DELETE feeds the use-after-delete shapes),
# so a 1-12 operation sequence reaches deep states no static table lists. Driven against the
# real in-process NewRouter stack over a seeded SQLite store with fixed principals (no-token,
# garbage, no-role, viewer, project-admin-on-A, global-admin, machine-token, expired-grant).
# Oracles: (1) no undeclared 5xx, (2) response conformance (kin-openapi ValidateResponse),
# (3) unauthenticated-layer authorization monotonicity, (4) canary non-leakage, (5)
# idempotent reads. SQLite-backed + CI-runnable; a Postgres variant is reachable by swapping
# the core's DB as the sibling live-API fuzzers do. 1h.
server/http|FuzzOpenAPIStateful|1h
