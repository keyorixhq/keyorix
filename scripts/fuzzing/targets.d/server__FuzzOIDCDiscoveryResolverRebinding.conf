# EGRESS-REBIND-1 DNS rebinding at a link-local egress site: SSO OIDC discovery GET (S09, E08).
# Dials a hostname through oidcDiscoveryTransport.DialContext while an in-process DNS stub
# (internal/fuzzutil/egressref RebindDNS, installed behind net.DefaultResolver) answers
# {first, second} to the first lookup and 169.254.169.254 to every later one. Oracle: the
# whole first set is refused when the link-local tier refuses ANY address in it; a permitted
# set connects to the validated address (loopback, the harness's own listener), never to the
# later answer; one A and one AAAA query per dial. Does NOT verify a real DNS server, the
# cgo resolver, the egress-proxy case, or the inline client of the discovery call (it
# drives the transport variable).
# New; pure and fast (about 1k-2k execs/s), 5m.
server|FuzzOIDCDiscoveryResolverRebinding|5m
