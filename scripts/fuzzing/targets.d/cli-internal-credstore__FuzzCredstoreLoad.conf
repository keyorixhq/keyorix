# Thin-CLI credentials file (cli/internal/credstore, ADR-108 PR 0): fuzzes
# FileStore.Load against arbitrary file bytes and arbitrary Unix permission
# bits on a real temp file, plus a symlink at the same path every iteration.
# Asserts the exact refusal threshold file.go's Load enforces
# (perm&0o077 != 0), unconditional symlink refusal, and that a refused/failed
# Load never returns a non-zero Credentials (no token/URL leak on the
# fail-closed path). Small, self-contained file-permission decode surface;
# 1h.
cli/internal/credstore|FuzzCredstoreLoad|1h
