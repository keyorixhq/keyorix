# RESP3 large-declared-bulk fuzz: two independent fuzzer dimensions — declared bulk
# count (uint64, capped to 16MB to avoid pre-alloc OOM) and actual payload bytes.
# Separates the RESP3 length header from the body so the fuzzer can explore
# count=16MB with empty body independently of the base FuzzRedisReply harness.
# Oracles: bounded time (2s client read timeout + 6s outer wall-clock), no panic,
# credential token not in error text. Finding LF3-F3: go-redis pre-allocates
# make([]byte, N) based on declared bulk length before reading; at N≥~512MB this
# OOMs before any timeout fires (confirmed by crash at count=1<<40) — upper bound
# capped in test, documented for upstream reporting. 5m.
fuzz/thirdparty/redis|FuzzRESP3BulkDeclared|5m
