# Schema-aware gRPC fuzzer (fuzzer inventory item #6): a generic, protoreflect-
# driven mutator picks a registered keyorix.v1 service+method from the live
# *grpc.Server's own registry, walks its descriptor to build a well-typed
# request (scalars, enums incl. unknown values, repeated, maps, oneofs, nested
# messages, field presence, injected unknown fields), and runs it against the
# real in-process gRPC server (bufconn) + real core + SQLite world, as
# zero-grant / read-only / admin identities. Four oracles: no panic / no
# leaking Unknown-or-Internal status; zero-grant and read-only never get OK on
# a call that mutates the DB or returns the canary secret's plaintext;
# non-OK leaves the DB unchanged outside a documented best-effort write; work
# stays proportional to request size. SQLite-backed + CI-runnable, 1h.
server/grpc|FuzzGRPCProtoreflectInvariants|1h
