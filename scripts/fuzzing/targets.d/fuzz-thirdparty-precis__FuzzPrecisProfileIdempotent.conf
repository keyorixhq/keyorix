# Idempotence/determinism fuzz of golang.org/x/text/secure/precis for the two
# profiles internal/identity uses to normalize machine-identity names and
# address names (foldedProfile = NewFreeform(LowerCase, Norm(NFC)), and
# OpaqueString). Oracle: enforcing an enforced string is a no-op, and enforce
# is deterministic (RFC 8264/8265). Does NOT check reject-completeness or fold
# collisions (see fuzz/thirdparty/precis). 5m.
fuzz/thirdparty/precis|FuzzPrecisProfileIdempotent|5m
