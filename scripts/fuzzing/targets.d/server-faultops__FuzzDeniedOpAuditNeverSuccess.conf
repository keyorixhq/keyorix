# FUZZ-MECH M1-AUDIT (AUD1): audit-log TRUTHFULNESS for DENIED operations.
# Reuses FuzzMixedPrincipalAuthority's independent authorization reference model
# (modelVerdict) and faultops world, over random (principal, operation,
# target-project) triples the model DENIES. M1 already asserts the denial causes
# no NON-audit state change but deliberately excludes the AuditEvent table; this
# target closes that gap: a denied, no-effect operation must never leave a
# Success=true AuditEvent row (a FALSE-SUCCESS audit certifies an unauthorized
# action as completed -- the same class as a false OK, a compliance defect for an
# EU-first product). Soundness-gated on "non-audit state unchanged" so it only
# asserts where a Success=true row would genuinely be a lie. Red/green proven by a
# throwaway middleware plant (see docs/findings / the AUD1 report). Small,
# deterministic input space (6 principal classes x 12 ops x 2 projects) that
# saturates fast; one full REST+gRPC world per call, same cost shape as
# FuzzMixedPrincipalAuthority. 20m.
server/faultops|FuzzDeniedOpAuditNeverSuccess|20m
