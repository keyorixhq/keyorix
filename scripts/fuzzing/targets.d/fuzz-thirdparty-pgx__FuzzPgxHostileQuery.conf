# Hostile-server fuzzing of pgx/v5 past the handshake (session n4): a fixed valid
# startup, then a fuzz-controlled backend stream (RowDescription, DataRow,
# CopyOut/CopyIn/CopyBoth, ParameterDescription, ErrorResponse, NoticeResponse,
# ParameterStatus, NotificationResponse) while the client runs one of eight
# public-API query operations (simple/exec/cached-prepared Query, Exec, CopyTo,
# CopyFrom, multi-result Exec, typed scans). Oracles: no panic/hang, TotalAlloc
# budget, canary never in errors or decoded values. Loopback TCP, ~ms per exec.
fuzz/thirdparty/pgx|FuzzPgxHostileQuery|10m
