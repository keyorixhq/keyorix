# diffkit Instance B (fuzz/ module, GOWORK=off): differential X.509 chain-trust
# oracle. The SAME Frankencert-style generated chain (name constraints, EKU,
# path length, basic constraints, SAN/CN, validity, critical unknown extensions)
# is handed to Go crypto/x509 (Certificate.Verify) AND to `openssl verify`; any
# accept/reject disagreement the documented-differences table does not explain is
# a reported divergence. Purpose checking is OFF on both sides so the structural
# trust signal is not drowned by the well-known Go-vs-openssl purpose-model gaps
# (see fuzz/certdiff/certdiff.go package doc). Reference for the Keyorix call
# path: internal/notary VerifyReceipt (x509 chain + TimeStamping EKU). Modest
# knob space, exec-bound by the openssl child process; 30m.
fuzz/certdiff|FuzzCertChainDifferential|30m
