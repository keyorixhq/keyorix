# RESTORE-XVER-1: cross-version restore round-trip over a FROZEN v2 archive whose
# canary plaintexts + metadata are committed next to it (server/admin/testdata/xver/).
# Per exec: write the mutated archive, restore it through the real `admin restore`
# CLI path (migrations + verify-audit + staged-then-atomic commit), then assert O1
# (every recorded secret decrypts to its recorded plaintext on a successful restore),
# O2 (a refusal is explicit, leaks no secret, leaves no half-restored rows), and O4
# (no canary/key byte in output). This is an END-TO-END target: a full restore is
# seconds, so throughput is low by design -- it complements, not replaces, the fast
# byte-level FuzzI6OldArchiveMutation / FuzzResguardExtractArchive at the
# internal/backupfmt layer. The deterministic companions (TestXverRestore_O1/_O2/_O3)
# carry the enumerated structural mutations and the red proofs. SQLite only. 20m.
server/admin|FuzzXverRestore|20m
