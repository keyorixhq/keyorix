# PostgreSQL leg of the skip-version upgrade fuzzer: replays a snapshot written by
# a real old release's own core on PostgreSQL (v0.91.0-v0.96.3,
# internal/storage/testdata/upgrade-snapshots-pg), adds generated state, runs HEAD's
# real startup migration and checks the SQLite leg's oracles plus column types,
# defaults, constraints and indexes against a fresh install. Needs
# KEYORIX_TEST_PG_DSN; each exec is one throwaway database.
internal/storage|FuzzUpgradePGFromOldSchema|1h
