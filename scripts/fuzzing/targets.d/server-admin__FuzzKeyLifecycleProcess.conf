# Process-level key-lifecycle fuzzer (server/admin). The sibling
# FuzzBackupRestoreRoundTrip drives rotation/backup/restore IN PROCESS; the
# internal/encryption crash fuzzers (FuzzDEKSweepCrashConsistency,
# FuzzKEKRotationCrashConsistency, TestCrashHelperProcess) cover in-rotation
# NUMBERED crash points. None of them drive the cross-process dek.lock flock:
# in production the CLI runs rotation/passphrase-change/backup/restore as
# SEPARATE OS processes serialised by that flock, which an in-process fuzzer
# cannot hold (the op-9 limitation; issues #4104/#4105). This target drives a
# fuzz-byte-encoded program (3 bytes/step) of lifecycle steps as REAL child
# processes (re-exec of the test binary): create/update/delete secret, rotate
# DEK (+sweep), rotate KEK (passphrase change), backup, restore into a fresh
# store, SIGKILL a rotation child at a process-granularity point, run two
# writers concurrently, SIGKILL a lock holder, run the documented recovery
# command (encryption upgrade-aad), reopen. Oracles: (a) the store opens or
# fails with a documented typed error, never a panic; (b) every acknowledged
# write decrypts to its exact recorded plaintext; (c) a restore of a (possibly
# pending-rotation) backup starts or fails with a documented error, never
# undecryptable secrets; (d) after the documented recovery command the store is
# usable with no hand repair; (e) two concurrent rotations never both proceed
# and a killed holder never blocks the lock forever. SQLite always; Postgres
# when KEYORIX_TEST_PG_DSN is set (isolated v3_<pid>_<n> databases, dropped on
# cleanup). New. Process-heavy, low-rate: each step forks a real child (storage
# + migration + 600k-iteration PBKDF2 encryption init), so exec counts are low
# and the value is depth-per-exec, not throughput.
server/admin|FuzzKeyLifecycleProcess|1h
