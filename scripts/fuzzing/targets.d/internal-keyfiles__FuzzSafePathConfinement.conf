# Path-confinement gate for the filesystem-path sinks reached via
# securefiles.FixFilePerms (Lstat/Chmod/Chown) over config-driven key-material
# paths (salt, DEK, per-provider wrapped-key / shamir-share paths, recursively
# through Fallbacks). keyfiles.SafePath is what every such path passes through
# first. Oracle: if SafePath accepts a path, the cleaned result has no ".."
# segment and (when relative) stays inside any base directory it is joined
# under — an independent check, not SafePath's own substring test.
# Sink-guided (scripts/fuzzing/sinkmap). 5m: pure lexical path function.
internal/keyfiles|FuzzSafePathConfinement|5m
