# SQL sink in rotation.PostgresExecutor.Rotate: a non-parameterisable
# `ALTER ROLE <id> WITH PASSWORD <lit>` DDL sent over pgx's simple query
# protocol (which runs every ;-separated statement). A recording pgConn (the
# executor's own injection seam) captures the exact statement; an independent
# decoder asserts the role ref and password each occupy exactly their quoted
# slot and decode back to the input — no byte escapes into executable SQL.
# Complements the leaf FuzzPostgresQuoting (escaper semantics) by covering the
# sink's statement ASSEMBLY. Sink-guided (scripts/fuzzing/sinkmap). 5m: pure,
# fake connection, no database.
internal/rotation|FuzzPostgresRotateRecordingDriver|5m
