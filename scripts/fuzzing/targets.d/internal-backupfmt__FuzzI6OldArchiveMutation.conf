# Old-release backup restore, fail-closed (internal/backupfmt, task I6):
# mutates a v2 logical archive that a REAL older released binary (v0.96.3,
# built from its git tag) actually wrote -- NOT a synthetic archive built from
# current main's models, which is all every other backupfmt fuzz target seeds
# from. Drives the full extract+load path: ExtractArchive then (on accept)
# LoadArchive into a fresh, fully-migrated current-main database inside one
# always-rolled-back transaction. Asserts three things on every input: a
# damaged archive is REFUSED at extraction (fail-closed); a load that fails
# leaves the target completely empty (no half-restored rows -- the transaction
# must confine every write); and a load that SUCCEEDS reproduces exactly the
# pristine archive's restored content (no silently-altered backup accepted).
# Harness caps input to 64 KiB / 2000 declared rows so amplified shapes do not
# starve coverage (the product's own caps are operator-set and fuzzed by
# FuzzExtractArchive). Does NOT cover the HMAC manifest-signature gate
# (manifest_sign_fuzz_test.go) or key-material writes (server/admin). New;
# 30m -- the extract+load surface on a real old-release seed is self-contained
# (no network, no auth) and saturates coverage well within it.
internal/backupfmt|FuzzI6OldArchiveMutation|30m
