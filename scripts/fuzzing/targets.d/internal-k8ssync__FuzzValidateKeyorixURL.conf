# k8ssync sync-agent cleartext-token transport gate (K8SSYNC-007): the agent sends
# KEYORIX_TOKEN as a bearer header to keyorix_url on every request, so an accepted URL
# must be https (http only for the literal host "localhost"). Pure string/URL validator,
# saturates fast; 10m is comfortably past saturation for the nightly rig.
internal/k8ssync|FuzzValidateKeyorixURL|10m
