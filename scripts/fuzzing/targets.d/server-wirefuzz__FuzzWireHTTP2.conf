# WIRE-PROTOCOL (B1): raw HTTP/2 frames to the production gRPC server's framing
# layer (x/net/http2 as embedded in grpc-go), stood up in-process on a loopback
# listener with the full interceptor chain. After a valid preface+SETTINGS it emits
# a fuzz-controlled frame sequence: HEADERS (with or without a credential) to the
# secret methods, DATA on the last opened stream (junk, or a valid length-prefixed
# GetSecretRequest for secret A or B), pseudo-header abuse (missing/duplicate/
# out-of-order/injected :method/:path/:authority), CONTINUATION chains, RST_STREAM
# floods, SETTINGS abuse, PRIORITY cycles, WINDOW_UPDATE storms. Oracles: no
# panic/hang/bounded alloc; secret plaintext never returned on a stream whose own
# HEADERS did not carry an authorizing credential (per stream); after the abuse a
# fresh connection must complete a real unauthenticated RPC. Robustness + leak target
# (HTTP/2 stream multiplexing is grpc-managed, so no handler-count smuggling oracle
# here). The connection is never half-closed before the response is read.
server/wirefuzz|FuzzWireHTTP2|20m
