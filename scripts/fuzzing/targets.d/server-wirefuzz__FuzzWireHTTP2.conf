# WIRE-PROTOCOL (B1): raw HTTP/2 frames to the production gRPC server's framing
# layer (x/net/http2 as embedded in grpc-go), stood up in-process on a loopback
# listener with the full interceptor chain. After a valid preface+SETTINGS it emits
# a fuzz-controlled frame sequence: HEADERS pseudo-header abuse (missing/duplicate/
# out-of-order/injected :method/:path/:authority), CONTINUATION chains, DATA with
# wrong lengths, RST_STREAM floods, SETTINGS abuse, PRIORITY cycles, WINDOW_UPDATE
# storms. Oracles: no panic/hang/bounded alloc; secret plaintext never returned
# without an authorizing credential on the wire. Robustness + leak target (HTTP/2
# stream multiplexing is grpc-managed, so no handler-count smuggling oracle here).
server/wirefuzz|FuzzWireHTTP2|20m
