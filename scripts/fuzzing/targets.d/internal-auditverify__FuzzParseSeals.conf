# I7 small-parser sweep: ParseSeals (internal/auditverify/seal.go), the parser
# of the "audit_seals" value (accepted audit losses). Feeds arbitrary bytes
# through base64 decode -> JSON unmarshal -> shape and chain-linkage checks.
# Oracle: never panics, and a record set it ACCEPTS is a well-linked chain
# (Seq 1-based consecutive, first Prev empty, each later Prev == previous
# record's Digest) — a mis-linked set reading as valid would let one
# acceptance's digest chain to another's. MACs are NOT checked here (loadSeals'
# job). New; 10m (base64+JSON per line, bounded).
internal/auditverify|FuzzParseSeals|10m
