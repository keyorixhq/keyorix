# --- fuzz/agp1-airgap-egress ---
# AGP1: fuzzes the OS-level air-gap harness's egress CLASSIFIER and /proc/net
# address decode — the oracle's eyes. The whole child-process air-gap verdict
# (internal/fuzzutil/osairgap) rests on correctly deciding "is this remote peer
# loopback/the-configured-DB (allowed) or egress", so a classifier/parser bug
# would silently blind it. Asserts fail-closed classification (never allow a
# non-loopback, non-exact-DB endpoint) and panic-free decode of adversarial hex
# rows. New target, no saturation data yet; 1h to start (pure in-process
# parser/classifier, ~12k execs/s locally).
internal/fuzzutil/osairgap|FuzzEgressClassifier|1h
