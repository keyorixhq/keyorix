# diffkit Instance A (fuzzkit/ module, GOWORK=off): differential JWT-verification
# oracle. The same attacker-controlled token and pinned verifier config (expected
# algorithm family + one genuine key + required audience + fixed clock, mirroring
# internal/core/sso.go verifyIDToken) are handed to github.com/golang-jwt/jwt/v5
# AND to an independent spec-derived stdlib reference verifier (RFC 7515/7519);
# any accept/reject or extracted-subject disagreement the documented-differences
# table does not explain is reported. Covers alg:none, RS/HS confusion, wrong
# key, signature tamper, expired, nbf, aud string/array, kid. NOTE: the intended
# second reference lestrrat-go/jwx is offline in this environment (only module
# metadata cached), so the stdlib reference stands in as a genuinely independent
# implementation (see fuzzkit/jwtdiff/jwtdiff.go). In-process and fast; 30m.
fuzzkit/jwtdiff|FuzzJWTVerifyDifferential|30m
