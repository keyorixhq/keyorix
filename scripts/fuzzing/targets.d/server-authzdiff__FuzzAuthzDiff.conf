# Cross-layer authz differential: one fuzzer-chosen (operation, principal,
# target, grant-role arg, custom-role permission subset/scope) case runs on core
# called directly, the real REST router and the real gRPC server, each on its own
# fresh copy of a seeded SQLite template. Oracle 1: the layers agree. Oracle 2:
# each layer matches a reference model over the role's actual permissions.
# A case no known waiver covers (partition_test.go) fails the run; waived
# cases are logged. ~30ms per case; 30m covers the case space many times.
server/authzdiff|FuzzAuthzDiff|30m
