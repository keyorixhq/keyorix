# FAULT-IO-1: environment faults BENEATH the storage layer, at a fuzz-chosen SQL
# statement or COMMIT of one real REST/gRPC operation: ENOSPC, EIO (before and
# after the write took effect), a dropped connection (a really terminated backend
# on PostgreSQL), a stalled write that hits its deadline, a COMMIT whose
# acknowledgement is lost, and a sticky full/failing disk. Reuses the storage-fault
# oracles (atomicity, no mixed commit, error hygiene) and adds: audit chain still
# verifies, no leaked connection, the same op runs again, a success keeps its audit
# event, no canary in logs. Same per-iteration cost as FuzzStorageFaultOperations
# (two worlds, real httptest + bufconn servers; measured about 7 inputs/s on
# SQLite), so the same 1h budget. Run it on SQLite and, with KEYORIX_TEST_PG_DSN
# set, on PostgreSQL (the connection-drop faults really terminate the backend there).
server/faultops|FuzzIOFaultOperations|1h
