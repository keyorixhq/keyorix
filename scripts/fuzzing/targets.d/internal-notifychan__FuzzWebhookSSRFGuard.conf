# SSRF guard for the outbound-HTTP sink in notifychan WebhookSink.send /
# ChatSink.send (http.NewRequestWithContext + client.Do to an operator/event-
# derived URL). validateEndpoint -> refuseDisallowedHost -> isDisallowedIP is
# the pre-dial gate; it had table tests and an SSRF matrix test but no fuzzer.
# Differential oracle: an independent reference classifier flags SSRF-class
# addresses (RFC1918, link-local incl. 169.254.169.254, unspecified/0.0.0.0/8,
# IPv6-embedded IPv4), and the harness fails if the guard accepts one the
# reference refuses. Sink-guided (scripts/fuzzing/sinkmap). 5m: pure classifier
# over a small synthesised-address + hostname input, no network, no auth.
internal/notifychan|FuzzWebhookSSRFGuard|5m
