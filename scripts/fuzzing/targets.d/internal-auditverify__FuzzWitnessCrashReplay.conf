# FS1 storage-fault campaign: crash-replay fuzzing of the audit high-water
# witness file (rollback-protection reference, design-b3-backup-v2 §6.3).
# Manufactures post-crash/tampered on-disk witness states (truncated,
# bit-flipped, byte-appended, forged-higher under a wrong key, rewound, empty)
# and drives the real ReadWitness / WriteWitnessIfHigher. Asserts a torn/forged
# witness never verifies under the real key (HMAC integrity), an existing
# unparseable witness is surfaced as an error (never silent "no witness"), an
# acknowledged mark is never lowered on replay, and no fd leak. Complements
# INV-AUDITVERIFY-10 (unit monotonicity) and -15 (row decode). Red-proofed.
# Fast parse/HMAC surface; 30m.
internal/auditverify|FuzzWitnessCrashReplay|30m
