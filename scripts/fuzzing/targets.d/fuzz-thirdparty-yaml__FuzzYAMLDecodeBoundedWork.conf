# Bounded-work fuzz of gopkg.in/yaml.v3 decoding, the parser internal/config and
# cli/internal/credstore run on operator-provided config/credential files.
# Oracle: arbitrary bytes decode without panic, within a time bound, and a
# successful decode re-marshals to a bounded size (an anchor/alias "billion
# laughs" the decoder EXPANDED would blow it; yaml.v3 rejects it instead). Does
# NOT check round-trip fidelity or Keyorix's schema layer (see fuzz/thirdparty/yaml). 5m.
fuzz/thirdparty/yaml|FuzzYAMLDecodeBoundedWork|5m
