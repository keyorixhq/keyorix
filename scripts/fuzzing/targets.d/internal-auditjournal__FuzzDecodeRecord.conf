# PERF-4 (ADR-115): the local audit journal's on-disk record decoder is the
# one genuinely new attack surface this prototype introduces -- Validate/Open
# trust a journal file written by this same process under normal operation,
# but a disk fault, a storage-layer bug, or deliberate tampering can hand the
# decoder anything. decodeRecord must never panic and must never allocate
# more than maxPayloadLen for attacker-controlled input; garbage in must
# always produce a typed error (ErrIncomplete/ErrPayloadTooLarge/ErrCorrupt/
# ErrChainMismatch), never a crash and never a false "valid" on malformed
# bytes. New; 1h given the small, self-contained, O(1)-bounded decode
# surface (no network, no auth, a single fixed-size-header-then-payload
# parse with no internal loops over attacker-controlled length).
internal/auditjournal|FuzzDecodeRecord|1h
