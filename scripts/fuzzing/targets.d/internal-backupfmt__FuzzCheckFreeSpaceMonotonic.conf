# Backup v2 free-space preflight (internal/backupfmt, design-b3-backup-v2.md
# §7.4): CheckFreeSpace's own int64-overflow fail-open bug (requiredBytes
# near math.MaxInt64 wrapped the margin computation negative, silently
# reporting "enough space" -- reported to keyorix-private's coordinator
# inbox 2026-10-02, fixed in the same PR that added this target) had no fuzz
# coverage. Monotonicity oracle (increasing requiredBytes can never turn a
# refusal into an acceptance) -- sound across arbitrary magnitudes without
# needing to know the real machine's actual free-space number, and directly
# red-proofed against the fixed bug (fails on pre-fix code, passes on
# current). Small, pure-arithmetic-plus-one-statfs surface; new; 1h.
internal/backupfmt|FuzzCheckFreeSpaceMonotonic|1h
