# evidence-pack object store in internal/evidencesink: ForwardEvidence -> PutObject
# against an operator-configured, free-form endpoint URL — the most attacker-
# influenceable AWS surface in the codebase). Drives a real s3.Client via BaseEndpoint
# + UsePathStyle at an httptest server returning fuzzer-controlled XML bodies (status +
# body: garbage/truncated/nested XML error docs), exercising the smithy-go REST-XML
# error deserializer. Oracles: no panic, bounded time, no goroutine/fd leak, fail-
# closed on non-2xx, no retry storm, no access-key in error, no cross-host redirect.
