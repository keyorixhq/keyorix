# GRPC-EXISTENCE-ORACLE (PBG2, PR #4792): ADR-096 §4 existence-leak oracle.
# For every unary RPC whose request descriptor has a primary uint32 "id" field,
# checks that a zero-grant identity gets the same gRPC error code and message
# for a known-existing resource ID and the known-non-existing ID (999999). An
# unauthenticated caller is held to the same rule. ANY difference (code or
# message) is an ADR-096 violation classified as VULNERABILITY. Also covers:
# ResGuard heap oracle (RESOURCE-AMP is logged for review, not asserted).
# Red/green-proofed:
# planting codes.NotFound for all callers on missing resource triggered 5
# oracle failures; restoring production code returns to green.
server/grpc|FuzzGRPCExistenceOracle|1h
