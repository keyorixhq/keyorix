# KL1 key-lifecycle leak oracle under REAL SIGKILL + a post-kill backup. Forks a
# child that performs a DEK rotation or a KEK rotation (== passphrase change),
# SIGKILLs it at a random write seam, recovers the install the way a restart
# does, takes a backup of the recovered install, and asserts that NO file under
# the install tree or inside the produced backup archive contains any raw
# KEK/DEK-derived key-material value byte-for-byte (evidence-sign, audit-
# checkpoint, backup-manifest keys — all documented as memory-only, never
# persisted). Extends FuzzProcessCrashRecovery (same fork/kill world) with the
# key-material leak oracle it lacks; the recover+backup region is metered by
# resguard (disk_bytes, absolute). SQLite; the leak oracle is DB-independent
# (local key files), proven once on PostgreSQL by TestKeyLifecycleKeyLeakBackends.
# Fork-heavy (seconds/input): 1h.
internal/encryption|FuzzKeyLifecycleCrashKeyLeak|1h
