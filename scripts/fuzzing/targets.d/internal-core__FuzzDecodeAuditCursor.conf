# I7 small-parser sweep: DecodeAuditCursor (internal/core/audit_page.go), the
# parser of the `cursor=` query parameter of GET /audit/logs and GET
# /audit/search and the gRPC AuditService page token — directly
# attacker-controlled request input. The cursor is deliberately unsigned
# ("it has no authority ... only strictly parsed"), so crash-free strict
# parsing is the whole guarantee. Oracle: never panics; fails closed (id>=1,
# length<=64); and any cursor it accepts re-encodes to one that decodes back
# identically (it only accepts cursors it could itself have issued). New; 10m.
