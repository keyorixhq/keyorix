# Op-sequence fuzzer over the audit hash chain: append / checkpoint / retention
# purge / clock advance through the REAL writer on a SQLite file, then BOTH
# verifiers (online core.VerifyAuditChain and the independent offline
# auditverify.Verify, with and without the checkpoint key) must agree with a
# slice-of-rows model after every op (chained and purged counts, no-key purge gap
# is INDETERMINATE never VALID); a program may end in one tamper (rewrite a row,
# delete an interior row, truncate a checkpointed tail, overwrite an entry hash)
# that neither verifier may pass. Red-proofed with 2 planted bugs (purge cutoff
# edge, offline entry-hash comparison skipped). Real findings: a purge that empties
# the table, and a purge that removes the latest checkpoint's head row, both read
# as tampering afterwards (#4351; the harness steps around them with a
# documented guard, remove it when #4351 is fixed). ~100 execs/s: 45m on pve01/vCD; the Mac runs at most 60s.
internal/auditverify|FuzzAuditChainOpSequence|45m
