# CL1 hostile-server target (branch fuzz/cl1-cli-hostile-server). Drives the REAL CLI
# transport stack -- newAPIClient -> apiclient.NewHardenedHTTPClient (10 MiB response
# cap, refuseRedirect, request timeout) -> the generated oapi-codegen decode ->
# checkVersionSkew/apiError/httpStatusError/statusExitCode/classifyError -- against a
# REAL httptest server that returns fuzzed/mutated/truncated/oversized/slow/redirecting/
# type-confused replies. Complementary to FuzzApiError, which fuzzes apiError in
# isolation and never exercises the transport (size cap, redirect refusal, content-type
# gating) nor the end-to-end decode. Oracles: no panic/hang, air-gap (no non-loopback
# dial -> SSRF), no credential forwarding to a redirect target, fail-closed on malformed
# replies, 10 MiB size cap, no terminal injection or secret echo in printed text, exit
# codes match the documented table. Uses internal/fuzzutil/resguard (NetMeter air-gap +
# Probe wall/alloc meters) as a TEST-ONLY dependency of the cli module. Each exec spins a
# fresh httptest server (slower than a pure-parser target), so 1h is an initial guess, not
# a measurement. Synthetic data and local loopback servers only -- New; 1h.
cli/cmd|FuzzCLIHostileServer|1h
