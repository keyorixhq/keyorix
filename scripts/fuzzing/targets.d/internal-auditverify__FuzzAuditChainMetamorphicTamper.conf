# ACH1 metamorphic audit-chain tamper target. Builds a FRESH, VALID, fully-
# checkpointed audit chain through the real writer (store.LocalStorage +
# core.KeyorixCore), applies ONE fuzz-driven structured mutation from a family
# (byte-flip, timestamp change, delete, truncate-tail, duplicate-id0,
# content-reorder, splice-from-another-log, replace-last-N, numeric nudge, plus
# two VALID-control kinds) and asserts the offline verifier's metamorphic
# relation: a mutation that changes the authenticated 16-column read-set must
# make Verify non-VALID (or a typed error), while a change confined to an
# unauthenticated column (machine_identity_id) or a true no-op must stay VALID.
# Generalizes differential_test.go's FIXED tamper matrix into a random-chain,
# random-mutation fuzzer. Oracle decision has a red/green proof
# (TestMetamorphicOracle_RedGreen) and per-family live detection proof
# (TestMetamorphicOracle_EndToEnd_PerFamily). Secondary resguard tripwire
# (wall+alloc, absolute ceilings) bounds Verify work. Heavy fixture (full gorm
# DB + checkpoint per exec, ~1 exec/sec), so 30m to accumulate corpus across the
# small structured mutation space.
internal/auditverify|FuzzAuditChainMetamorphicTamper|30m
