# Fail-stops the real locked PostgreSQL upgrade path at a fuzz-chosen write
# statement, asserts the rollback left the database byte-identical (schema, rows
# and sequences) and that a restart completes the upgrade with every oracle of
# FuzzUpgradePGFromOldSchema intact. Needs KEYORIX_TEST_PG_DSN.
internal/storage|FuzzUpgradePGInterrupted|1h
