# WIRE-PROTOCOL (B1): raw HTTP/2 frames to net/http's OWN HTTP/2 server (the REST
# router served over TLS with ALPN "h2"), reaching the HTTP/2-on-the-HTTP-listener
# surface the other HTTP/2 target cannot (it drives grpc-go's h2 on the gRPC listener).
# After an ALPN-negotiated h2 handshake + preface+SETTINGS it emits a fuzz-controlled
# frame sequence against REST endpoints: HEADERS to secret/health paths with/without
# credentials, DATA on no-body methods, CONTINUATION chains, RST_STREAM floods,
# SETTINGS abuse, WINDOW_UPDATE storms. Oracles: no panic/hang/bounded alloc; secret
# plaintext never returned without an authorizing credential; the ALPN selection must
# actually be h2 (anti-vacuity); and a fresh TLS+h2 connection is still served after the
# abusive exchange (post-abuse health). Robustness + leak target.
server/wirefuzz|FuzzWireHTTP2TLS|20m
