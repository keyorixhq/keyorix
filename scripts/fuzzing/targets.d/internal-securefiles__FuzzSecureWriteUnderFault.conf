# FS1 storage-fault campaign: SecureWriteFileSync / SecureOpenBeneath under
# REAL filesystem faults (read-only leaf, symlinked or non-directory ancestor,
# path escaping the base, deep/traversal paths). Unlike the other FS1 targets
# this injects a real fault rather than a manufactured byte state, exercising
# the real open/chmod/write/sync/close error handling. Asserts a failing/unsafe
# write surfaces a non-nil error and is never written through a symlink or
# outside the base (c); a pre-existing target stays exactly old-or-new, never a
# partial prefix (d); and the per-component O_NOFOLLOW walk leaks no fd on any
# error path (e, the star oracle). Red-proofed against a planted missing
# unix.Close(dirFd). Fast walk surface; 30m.
internal/securefiles|FuzzSecureWriteUnderFault|30m
