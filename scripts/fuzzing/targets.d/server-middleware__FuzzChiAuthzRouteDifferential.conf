# CH1 differential: go-chi routing vs. the authorization path (server/middleware).
# Property: for any method+path, the route chi dispatches to is the one the
# authorization policy was evaluated for — a request must never be authorized as
# route A and served by route B. Keyorix applies permission gates PER ROUTE (inside
# the matched route's own chain), so the ONLY independent route matcher that feeds an
# authz decision is RefuseRestrictedPATUngatedWrites, which calls routes.Find(...) to
# refuse a restricted PAT on ungated writes from core's refusal table. This fuzzer
# drives that REAL middleware + REAL chi + REAL table over percent-encoded, encoded-
# slash, dot-segment, double-slash, trailing-slash, case and unicode paths, and fails
# on (CH1-A) a refused route reachable by a restricted PAT, (CH1-B) a refusal made on
# a route chi did not serve, or (CH1-C) a NEW routing-vs-reference disagreement class.
# Red/green-proved by a planted decoded-path defect (TestChiAuthzRouteDifferential_RedProof).
#
# Medium (default, no BUDGET.tsv entry): the surface is authenticated (/api/v1 only),
# and the first run found only a harness bug, not a Keyorix defect — the mechanism is
# sound. Input space (method index + path string over a fixed 386-route table)
# saturates fast, so 30m per rig cycle; re-tune from a saturation snapshot.
server/middleware|FuzzChiAuthzRouteDifferential|30m
