# FS1 storage-fault campaign: crash-replay fuzzing of the restore journal's
# durability layer (Read/Write/HashFile), which every `admin restore --recover`
# decision rests on. Manufactures post-crash journal-file states (truncated,
# bit-flipped, appended, wrong-version, empty) and staged-file states
# (unchanged, truncated, tampered, deleted). Asserts a journal round-trips, an
# existing torn/wrong-version journal is surfaced as an error (never silent
# not-found, never a usable zero-value journal), and the recovery install-gate
# HashFile==Entry.SHA256 rejects torn staged files. Does not drive the
# install/undo decision itself (needs a full server config + DB). Red-proofed.
# Fast JSON/hash surface; 30m.
internal/restorejournal|FuzzRestoreJournalCrashReplay|30m
