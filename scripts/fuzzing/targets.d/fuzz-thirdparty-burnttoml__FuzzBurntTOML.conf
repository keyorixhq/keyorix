# Hostile-document fuzz of BurntSushi/toml (transitive dep via go-i18n). Public
# API: toml.Unmarshal + toml.Marshal. Oracles: no-panic, bounded-work (15s
# watchdog on <=64KiB input), and decode/encode/decode round-trip BYTE-stability
# of the library's own output. The round-trip oracle found a real defect
# (zone-less local date/time/datetime drift by host UTC offset per cycle on
# non-UTC hosts; see .scratch/records/burntsushi-toml-1.md) — equality is scoped
# to skip values containing a time.Time so the target stays green while still
# checking no-panic/bounded/round-trip-of-non-temporal-values. ~21m clean after
# the find (v1.6.0). 5m.
fuzz/thirdparty/burnttoml|FuzzBurntTOML|5m
