# Hostile-argv fuzz of spf13/pflag (the flag parser under spf13/cobra, which the
# Keyorix CLI is built on). Builds a FlagSet with ContinueOnError + a mix of flag
# types, then calls FlagSet.Parse on a fuzzed argv. Crash-only oracle: no-panic +
# bounded-work (10s watchdog). argv is the untrusted surface for any CLI. ~21m
# clean, no defect (v1.0.10). Kept as a regression tripwire. 5m.
fuzz/thirdparty/spf13pflag|FuzzPflagParse|5m
