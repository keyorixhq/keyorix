# FUZZ-MECH M7b: bundle decompression-bomb bounded work (K4). Generalizes two
# existing fixed-value unit tests (writeRawBundleOversizedEntry) into a
# fuzzed one: a tar header DECLARES a size with no body bytes present,
# fuzzed across the full int64 range, for both the manifest entry and a
# component entry. Verify must reject any declared size past the relevant
# cap, and never scale time/memory with the declared value (bounded by a
# fixed ceiling, not the declared size) -- proving the check reads the tar
# header's Size field alone, never attempts the corresponding read. Pure, no
# real network/large I/O; 1h.
pkg/bundleverify|FuzzBundleDecompressionBounded|1h
