# Two-replica cross-instance fuzzer: two *KeyorixCore instances, each with its
# OWN *gorm.DB connection pool, share ONE real PostgreSQL schema (the
# TestConcurrency_BootstrapSystem_CrossReplicaPostgres_ExactlyOneAdmin
# multi-pool pattern, generalized from bootstrap alone to a fuzzer-chosen mix
# of role grant/revoke, session revoke, PAT revoke, machine-token
# issue/revoke, secret rotate, dynamic-secret lease issue/revoke, and user
# suspend). Checks (a) single-winner/uniqueness on a dynamic-secret-config
# name race, (b) revocation-honored-on-next-check via porcupine
# linearizability (bound 0 — none of the credential-validation paths this
# fuzzer drives cache anything at the KeyorixCore layer), and (c) final DB
# state equals a serial replay in real Postgres commit order, for the
# role-grant and rotate-secret registers. Postgres-only; skips cleanly when
# KEYORIX_TEST_PG_DSN is unset. See the fuzz function's own doc comment
# (cross_replica_ops_fuzz_test.go) for why the HTTP-layer tokenCache's real
# 30s cross-replica staleness window is NOT what oracle (b) tests here (that
# cache is a single process-wide map — two replicas in one Go test binary
# would trivially share it, which would not model two independent production
# replicas at all; testing that layer needs two separate OS processes). 1h.
internal/core|FuzzCrossReplicaOps|1h
