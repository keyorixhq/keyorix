# Soak operation-sequence fuzzer (task I5): drives a fuzzer-chosen SEQUENCE of the
# soak operation mix (create/read/update/rotate/delete secrets, login/logout churn,
# audit reads, project/env churn) against the same fully-wired in-process stack the
# long soak uses (NewRouter + auth middleware + handlers + core + crypto + storage),
# file-backed SQLite and PostgreSQL when KEYORIX_TEST_PG_DSN is set. After every
# sequence it re-verifies the audit hash chain is intact (no gap/dup/break) and the
# goroutine count has not run away -- the scaled-down slice of the bounded-growth
# oracles a per-input fuzzer can assert. The long-run growth oracles (goroutines,
# fds, heap-after-GC, DB/WAL per record, latency drift) live in
# TestSoakBoundedGrowth. 30m.
server/http|FuzzSoakOperationSequence|30m
