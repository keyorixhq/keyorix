# GE1 server-edge target: the SHARED httpx request decoder (httpx.MustDecodeBody)
# driven behind the REAL body-size middleware (server/middleware.MaxBodyBytes)
# with a sentinel business handler behind the decode. Fuzzes (selector,
# content-type, body): content-type confusion, charset tricks, trailing data,
# huge numbers, duplicate keys, unknown fields, deep nesting, invalid UTF-8, and
# oversized bodies via declared-length and chunked (unknown-length) paths.
# Non-duplicative of FuzzJSONDecodeBoundedWork (which already covers bounded-work
# + nesting depth): this adds the leak guard on the decode-error response, the
# fail-closed-through-the-real-cap invariant (handler reached IFF decode
# succeeded), status discipline ({200,400,413}), and a resguard bounded-memory
# budget. Stateless, high exec/s. 20m.
server/http/handlers/httpx|FuzzHTTPXDecodeEdge|20m
