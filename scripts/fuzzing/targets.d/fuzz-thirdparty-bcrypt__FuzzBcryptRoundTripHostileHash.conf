# Round-trip + fail-closed + hostile-hash fuzz of golang.org/x/crypto/bcrypt,
# the hasher internal/core uses on every login/password-change. Oracle:
# GenerateFromPassword(MinCost) then CompareHashAndPassword verifies the right
# password and rejects a wrong one; an arbitrary hostile hash must not panic
# (cost-bombed hashes are bounded out before the compare, not hung on). Does
# NOT test constant-time/timing or cost>MinCost (see fuzz/thirdparty/bcrypt). 5m.
fuzz/thirdparty/bcrypt|FuzzBcryptRoundTripHostileHash|5m
