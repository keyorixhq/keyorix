# Whole-router secret-leak canary sweep: one (route, principal, request shape) per
# execution over every chi route of the real router, with fuzzer bytes mutating the
# body or an extra header. Secret-class canaries (raw, JSON, URL, hex, base64,
# truncated fragments, hostile charset) are planted in query, headers, basic-auth,
# JSON, form, XML and path params; every response, header, server log, stdout and
# stderr is scanned after each request and metrics, all DB cells and temp files every
# 200 executions. A planted-leak self-test (TestCanaryOracle_PlantedLeaksAreDetected)
# must pass in the same run. World rebuilt every 2000 execs. SQLite-backed. 1h.
server/http|FuzzCanaryRouteSweep|1h
