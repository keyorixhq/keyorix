# Hostile-server fuzzing of mongo-driver/v2 (session h5, h1 follow-up): a fake
# server completes the connect handshake (OP_QUERY isMaster -> OP_REPLY hello;
# OP_MSG hello -> OP_MSG hello) then streams a fuzz-controlled wire reply
# (opcode-onward) to a marker RunCommand, driving the driver's wiremessage /
# OP_MSG (kind-0/kind-1 sections, checksum & moreToCome flags) / OP_COMPRESSED
# parser and cursor-batch decode. Oracles: no panic/hang, bounded alloc (reply
# capped at 64 KiB, OP_COMPRESSED uncompressedSize clamped for host safety),
# canary never in an error or decoded value, truncated wire message must error.
# Credential-free client (the SCRAM auth path cannot be faked without the
# password, so it is not fuzzed). Loopback TCP.
fuzz/thirdparty/mongodb|FuzzMongoReply|10m
