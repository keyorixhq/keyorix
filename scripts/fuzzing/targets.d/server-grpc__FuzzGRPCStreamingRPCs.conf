# GRPC-STREAMING (PBG2, PR #4792): streaming RPC harness + ResGuard heap oracle.
# Grammar-generated first message + wire mutations (7 kinds) on all
# server-streaming and bidi-streaming RPCs registered in the live server
# (currently: keyorix.v1.AuditService/StreamAuditLogs).
# Oracles: (stream-auth) unauthenticated/zero-grant callers never receive data
# frames; (stream-no-panic) codes.Unknown, non-status errors and leak-looking
# codes.Internal messages are fatal; (stream-client-error) a clean codes.Internal
# on malformed bytes is only logged as HARDENING-2; (stream-bounded) a denied
# stream must not hit the 10s hang-detector deadline; (stream-amp) allocation
# oracle, logged only.
# Red/green-proofed: sending a dummy frame before the auth check triggered
# STREAM-DATA-LEAK for 4 seeds; restoring returns to green.
