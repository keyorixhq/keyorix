# GE1 server-edge target: hostile gRPC metadata driven through the REAL unary
# interceptor chain in production order (Recovery -> Timeout -> WriteContention
# -> Auth -> RateLimit -> ShareElevationAudit) in front of a sentinel handler.
# Fuzzes the authorization-metadata PARSING edge (oversized / repeated / binary /
# odd-encoding headers, malformed Bearer/PAT/session/machine forms) plus junk
# neighbour metadata, and the context mode (normal / peer-IP / cancelled /
# past-deadline) for the deadline/cancellation path. Oracles: no caught panic;
# fail-closed (a handler is reached IFF a full authenticated principal is on its
# context, never partial-evaluation); bounded work/memory (resguard alloc/mallocs/
# live-heap, factor 8); no server secret or bearer-token echo in the client error
# or server log; every non-OK result is a well-formed fail-closed gRPC status.
# SQLite-backed, CI-runnable. 30m (stateless-ish, high exec/s; the credential-
# parsing + chain-ordering surface saturates faster than the schema-aware target).
server/grpc/interceptors|FuzzGRPCEdgeAuthMetadata|30m
