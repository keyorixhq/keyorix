# Wire-level mutation fuzzer on top of the descriptor-driven grammar model
# (fuzzer inventory item #7). Builds a valid proto message via the shared
# grammar builder (protoreflect_builder_fuzz_test.go), then applies one of
# seven wire-level mutations: wrong wire type for a known field, truncated
# varint/length, overlarge length prefix (2^31-1), duplicate field, invalid
# UTF-8 in string field, conflicting oneof members, raw high-bit junk bytes.
# Exercises three coverage gaps the grammar-only target has: oracle (c)
# malformed-encoding → client-error code, oracle (d) idempotency for zero-grant,
# and wire-layer error code classification (HARDENING-1). Real in-process
# gRPC server (bufconn) + SQLite world, same as item #6. 1h.
server/grpc|FuzzGRPCProtobufGrammarWireInvariants|1h
