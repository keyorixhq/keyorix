# CONFIG-SPACE (scripts/fuzzing/configspace, RULES.md): config.Load + Config.Validate on
# arbitrary YAML plus secret-source environment toggles. Must never panic (I1), never put
# a secret value in an error string (I4), must give a deterministic verdict, and an
# accepted configuration must survive a Save/Load round trip. Pure in-memory plus one
# temp dir; seeds are the shapes of the covering-array rows. Initial 30m, not a
# measurement: re-tune from the first saturation snapshot.
scripts/fuzzing/configspace|FuzzConfigLoadValidate|30m
