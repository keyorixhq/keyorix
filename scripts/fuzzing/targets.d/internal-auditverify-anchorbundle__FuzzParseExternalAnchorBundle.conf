# Offline audit-chain verification (internal/auditverify, ADR-108 §B4,
# docs/design-b4-offline-audit-verify.md §3): fuzzes ParseExternalAnchorBundle
# against arbitrary bytes as the `--anchor` bundle JSON -- the one
# externally-supplied artifact this package parses that isn't already covered
# by FuzzAuditChainRowDecode's raw-SQLite-file target. Asserts a non-nil
# bundle is returned if and only if the input parses as JSON with non-empty
# head_hash/signature, and a nil bundle whenever err != nil. Small, pure JSON
# decode surface; new, no saturation data yet; 1h.
# Moved to internal/auditverify/anchorbundle (Session M, leaf-package move):
# the package's coverage map dropped from 212,417 to 15,223 bytes (measured
# with scripts/fuzzing/mapsize_of_bin.sh) -- ParseExternalAnchorBundle is a
# thin wrapper in internal/auditverify/anchor_bundle.go now, zero behaviour
# change.
internal/auditverify/anchorbundle|FuzzParseExternalAnchorBundle|1h
