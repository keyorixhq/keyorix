# Resguard-metered resource bound for the k8ssync Keyorix fetcher: wraps the shared
# resguard resource layer (NetMeter air-gap + dials/net_bytes_in + sampled alloc) around
# FetchWithExpiry against a fuzz-shaped httptest server. Oracles: the fetcher never dials a
# non-loopback host, and no bounded-page response shape drives net/alloc past the
# calibrated absolute ceiling, and no goroutine/fd leaks. The UNBOUNDED-pagination case
# (resolveID has no client-side page ceiling) is a documented HARDENING finding proven by
# TestResguardK8sSyncPaginationRedGreen, not left to the fuzzer. Each exec starts an
# httptest server; 30m.
internal/k8ssync|FuzzK8sSyncFetcherResource|30m
