# MP1 uniqueness fuzzer (backlog I1, oracle #1). Boots 3 real keyorix-server
# OS processes against ONE shared PostgreSQL database and races a fuzz-chosen
# number of concurrent creates of the SAME project name across the replica
# processes. The partial unique index uniq_projects_name_active must resolve
# every race to EXACTLY ONE winner and EXACTLY ONE active row (read straight
# from the shared DB with pgx, past any per-replica cache). REAL fuzzing needs
# `-tags e2e` AND KEYORIX_TEST_PG_DSN; a tag-less rig run hits a skip stub
# (fuzz_noe2e_test.go) so this stays listable for the fuzz-targets guard. 10m.
scripts/e2e/mp1|FuzzMP1UniqueCreate|10m
