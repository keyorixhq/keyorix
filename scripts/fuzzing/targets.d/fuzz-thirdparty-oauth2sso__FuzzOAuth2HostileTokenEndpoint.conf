# Hostile token-endpoint fuzz of golang.org/x/oauth2's authorization-code Exchange, on
# Keyorix's SSO/OIDC call path. Keyorix is the OAuth2 CLIENT: core.CompleteSSO
# (internal/core/sso.go:255) calls (*oauth2.Config).Exchange against the IdP token endpoint
# on every SSO login callback — an UNAUTHENTICATED route — and oauth2 parses the
# network-controlled response (JSON or form-urlencoded, up to two auth-style round-trips).
# A fuzzer-controlled loopback server writes raw HTTP responses (status/content-type/body,
# and a LYING Content-Length for the truncation oracle); the real Exchange parses them, wired
# exactly as CompleteSSO wires it (server/wire_sso.go:220 Config shape + VerifierOption).
# Oracles: no panic (fuzz engine) / no hang (Guard); fails-CLOSED on a truncated response;
# the client secret is never echoed in a returned error or token; a nil-error Exchange yields
# a non-empty access_token; air-gap (only the loopback endpoint is dialed) + bounded dials,
# response bytes and per-input allocation (resguard). Does NOT fuzz TLS, the on-wire request,
# id_token/JWT verification (covered by FuzzVerifyIDToken), or OIDC discovery. 9m.
fuzz/thirdparty/oauth2sso|FuzzOAuth2HostileTokenEndpoint|9m
