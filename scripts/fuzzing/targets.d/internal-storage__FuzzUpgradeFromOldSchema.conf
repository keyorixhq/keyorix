# Skip-version upgrade fuzzer: replays a snapshot written by a real old release
# (v0.91.0-v0.96.3, internal/storage/testdata/upgrade-snapshots), adds generated
# state on that old schema, runs HEAD's real startup migration and checks secrets
# decrypt, authz equals the old binary's verdicts and a model validated against
# each old release's real Authorize, the audit log and chain survive, and a
# second migration changes nothing. Coverage instrumentation of the SQLite engine
# makes this slow (about 2 execs/s), hence 1h like FuzzUpgradeMigration.
internal/storage|FuzzUpgradeFromOldSchema|1h
