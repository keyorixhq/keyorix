# Hostile-server fuzzing of redis/go-redis/v9 (session h5, h1 follow-up): a fake
# server satisfies the connect handshake (-ERR to HELLO -> RESP2 fallback, +OK to
# legacy AUTH) then streams a fuzz-controlled command-reply byte stream to the
# client's generic Do, driving go-redis's internal/proto RESP3 reply parser
# (array/set/push/map/attr/bulk/verbatim/bignum/double/bool) — the ACL
# SETUSER/DELUSER reply path internal/dynamic uses. Oracles: no panic/hang,
# bounded alloc (lengths clamped at 4 KiB, reply at 32 KiB for host safety),
# canary never in an error or decoded value, truncated reply must error. Loopback
# TCP, fast (hundreds/sec). NOTE: the Go fuzz corpus cache lives under a shared
# GOCACHE on this host; under concurrent sessions the cache can be disturbed
# mid-run ("no such file" infra error) — run with a private GOCACHE for a long
# uninterrupted pass.
fuzz/thirdparty/redis|FuzzRedisReply|10m
