# --- fuzz/jwt-single-constraint-violation-v2 ---
# Single-constraint-violation harness for the two JWT/OIDC verifiers: builds a
# fully valid token signed with the harness key, violates exactly one
# verification constraint per the fuzz input, asserts 0 violations => accept
# with the right identity, 1 violation => reject. Already found and closed one
# real gap (future-dated iat bypassing the max-age check) and one RFC 7515
# compliance gap (unrecognized crit header accepted) — see
# docs/findings/2026-09-23-FINDING-oidc-future-iat-and-crit.md. No saturation
# data yet (brand new); 1h each, matching this file's precedent for
# claims-semantics-focused JWT targets (FuzzOIDCVerifierClaims/FuzzVerifyIDTokenClaims
# above, not re-tuned here since they're owned by another session).
internal/core|FuzzOIDCIDTokenSingleConstraintViolation|1h
