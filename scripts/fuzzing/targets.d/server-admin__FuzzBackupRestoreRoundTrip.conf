# Metamorphic backup/restore ROUND-TRIP fuzzer (server/admin,
# design-b3-backup-v2.md §11.1). The sibling targets cover adjacent slices:
# FuzzReadBackupArchive / internal/backupfmt FuzzExtractArchive fuzz the
# archive READER on malformed bytes; the existing crash tests cover backup at
# process-crash points and killed rotations (#4058/#4104/#4105). None of them
# fuzz the ORDINARY cycle on arbitrary states. This target drives a bounded,
# fuzz-byte-driven sequence of REAL core mutations (projects, secrets,
# versions, roles, machine identities, deletes) onto a seeded, encrypted store,
# then runs the real `admin backup` -> `admin restore` (fresh-dir, real startup
# path) -> second backup, and asserts: (1) logical-state equality
# restore(backup(S))==S minus documented exclusions (schema_epoch, the trigger-
# maintained cache_epoch, and the restore self-audit event); (2) every secret
# version still decrypts to its original plaintext under the RESTORED key files;
# (3) the restore's own verify-audit reports VALID; (4) idempotence
# backup(restore(backup(S)))==backup(S); (6) a refusal is an explicit error,
# never silent corruption. Runs SQLite always and Postgres when
# KEYORIX_TEST_PG_DSN is set (isolated bk_<pid>_<n> databases, dropped on
# cleanup). New. 1h: each iteration performs several full encrypted
# backup+restore cycles (600k-iteration PBKDF2 per key derivation), so this is
# a deep, low-rate target rather than a high-throughput byte-muncher.
server/admin|FuzzBackupRestoreRoundTrip|1h
