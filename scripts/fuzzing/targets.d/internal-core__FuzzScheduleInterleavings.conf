# Schedule/race interleaving fuzzer (fuzz/schedule-race campaign): unlike every
# other stateful core fuzzer, which runs a fuzzed op SEQUENCE one op at a time,
# this one runs 2-4 ops CONCURRENTLY (goroutine-per-op) against one seeded
# KeyorixCore, with the Go scheduler's interleaving nudged by a per-op
# runtime.Gosched() delay from the fuzz input and, in happens-before mode, a
# start barrier that enforces a real "A returned before B started" edge. Domains:
# PAT revoke vs validate, secret delete/update vs read, role grant/revoke vs
# authorize, and N concurrent audit-chain appends. Four oracles (serial
# equivalence / linearizability, post-return visibility of revocation+deletion,
# audit-chain integrity + one-event-per-op, and no deadlock/panic/race under
# -race) -- each states in its doc comment what it does NOT verify.
#
# SCOPE: single-process, in-process concurrency only (one *gorm.DB, the
# in-process WithNamedLock table, the audit flusher, the auth-cache invalidation
# callback). It does NOT exercise the cross-replica / multi-process races the
# Postgres advisory locks and SELECT ... FOR UPDATE guard -- that is
# FuzzCrossReplicaInvariants / FuzzCrossReplicaOps (two independent *gorm.DB
# pools). On SQLite the pool is capped at one connection, so DB-level writers
# serialize and the teeth are in the core logic; real DB-level write concurrency
# needs KEYORIX_TEST_PG_DSN (the companion TestScheduleInterleavings_Postgres
# replays schedules against a Postgres-backed store).
#
# 1h: matches the other DB-backed stateful core fuzzers
# (FuzzCoreOperationSequence, FuzzCrossReplicaInvariants). Each iteration
# bootstraps a fresh in-memory store (~80ms) then runs the concurrent schedule,
# so throughput is modest; a long nightly run is where new interleavings surface.
internal/core|FuzzScheduleInterleavings|1h
