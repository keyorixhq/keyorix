# Robustness + round-trip + one-way differential for github.com/google/uuid's
# STRING parser: no panic/bounded work, Parse(u.String())==u, and every strict
# RFC-4122 canonical string must be accepted (uuid is a documented superset).
# WEAK reachability: uuid enters the build only via go-webauthn (AAGUID), which
# uses the FromBytes byte path, not this string path — low-yield tripwire. 5m.
fuzz/thirdparty/uuid|FuzzUUIDParse|5m
