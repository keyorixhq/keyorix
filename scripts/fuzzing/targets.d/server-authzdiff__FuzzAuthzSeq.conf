# Stateful sequence fuzzing: a fuzzer-chosen sequence of up to 8 authorisation-
# changing steps (role grant/revoke, suspend/reactivate, group add/remove, custom
# permission toggle, grant expiry) runs on core, the real REST router and the real
# gRPC server, each on its own copy of the seeded template. After every step the
# layers must agree, an allowed step must leave the state it names (a denied one
# must change nothing), and every principal's secret-value read must equal the
# reference model on each layer. A finding that also reproduces as the single
# step alone is logged; one that needs the sequence fails the run and its minimal
# sequence goes to $AUTHZSEQ_PRIVATE. ~0.3-1s per sequence. See SEQUENCE.md.
server/authzdiff|FuzzAuthzSeq|30m
