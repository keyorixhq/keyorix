# PerfFuzz-style cost-per-byte oracle over the google.golang.org/protobuf
# runtime wire decoder, the code every gRPC method runs on untrusted bytes
# before the handler (server/grpc/server.go:186 MaxRecvMsgSize, default 10 MiB).
# Decodes into structpb.Struct so most fuzz bytes land in the unknown-field path
# (scan + retain). Cross-checks that allocation stays linear where the runtime's
# recursion limit (100) only bounds nesting depth. Measured baseline ~1.5-5
# B/byte; 64 B/byte budget.
internal/libconformance|FuzzProtobufDecodeComplexity|1h
