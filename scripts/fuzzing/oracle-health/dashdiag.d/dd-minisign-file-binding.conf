# DashDiag (run with --root <dashdiag clone> --entries scripts/fuzzing/oracle-health/dashdiag.d).
# FuzzVerifyMinisign_FileBinding (internal/selfupdate): a signature binds exactly the
# file it was made over; verifyMinisign accepts a candidate iff it is byte-identical
# to the signed file (a self-update signature bypass otherwise). Plant: the file's own
# Ed25519 signature check is skipped (the trusted-comment signature is still checked),
# so the genuine file still verifies (the harness's positive anchor stays green) and a
# tampered file does too. The committed seeds with an appended byte and a flipped hex
# digit trip it. (A first plant that hashed only a prefix of the file broke the genuine
# file as well, because the harness signs the full hash: not a binding plant.)
FAMILY=dashdiag-minisign
DESC=verifyMinisign no longer checks the file signature (tampered artifact accepted)
PKG=./internal/selfupdate
TARGET=FuzzVerifyMinisign_FileBinding
RUN=^FuzzVerifyMinisign_FileBinding$
MARKERS=file binding broken
TIMEOUT=120
VERIFIED=2026-11-27 sandbox, dashdiag 60bae3715e09, control PASS, planted FAIL (DETECTED via the relative --entries command)
