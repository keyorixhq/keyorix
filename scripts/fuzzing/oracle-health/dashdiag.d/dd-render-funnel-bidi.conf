# DashDiag (run with --root <dashdiag clone> --entries scripts/fuzzing/oracle-health/dashdiag.d).
# FuzzRenderFunnelNoTerminalInjection (internal/render): host text carried through the
# markdown / share / post-mortem funnels must contain no ESC, no control rune and no
# bidi formatting rune. Plant: isBidiFormatting reports false for every rune, so the
# shared sanitizer keeps U+202E (Trojan-Source). The committed seeds "bidi‮KO..."
# and "iso⁦FAIL⁩" trip it. (A C1-only plant is not used here: this
# harness's C1 seeds are raw invalid-UTF-8 bytes, which become U+FFFD either way.)
FAMILY=dashdiag-terminal-escape
DESC=sanitizer no longer strips bidi override/isolate runes (Trojan-Source)
PKG=./internal/render
TARGET=FuzzRenderFunnelNoTerminalInjection
RUN=^FuzzRenderFunnelNoTerminalInjection$
MARKERS=bidi formatting rune
TIMEOUT=240
VERIFIED=2026-11-27 sandbox, dashdiag 60bae3715e09, control PASS, planted FAIL (DETECTED via the relative --entries command)
