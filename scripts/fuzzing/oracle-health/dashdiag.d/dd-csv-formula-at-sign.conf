# DashDiag (run with --root <dashdiag clone> --entries scripts/fuzzing/oracle-health/dashdiag.d).
# FuzzEscapeCSVFormula (internal/inventory): a hardware-derived value written into the
# inventory CSV must never come back as a cell that begins with a spreadsheet formula
# trigger (CWE-1236). Plant: '@' removed from escapeCSVFormula's trigger set. The
# committed seed "@SUM(A1)" trips it.
FAMILY=dashdiag-csv-formula
DESC=escapeCSVFormula no longer neutralises a leading '@'
PKG=./internal/inventory
TARGET=FuzzEscapeCSVFormula
RUN=^FuzzEscapeCSVFormula$
MARKERS=CSV FORMULA INJECTION
TIMEOUT=120
