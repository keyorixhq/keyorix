# DashDiag (run with --root <dashdiag clone> --entries scripts/fuzzing/oracle-health/dashdiag.d).
# FuzzSanitizeThenRenderNoRawEscape (internal/output): SanitizeControl must leave no
# control rune in its output. Plant: unsafeForTerminal only treats ASCII controls
# (below 0x80) as unsafe, so a C1 control encoded as UTF-8 (U+009B, the CSI
# introducer) survives. The committed seed "c1enc\xc2\x9bcsi" trips it.
FAMILY=dashdiag-terminal-escape
DESC=SanitizeControl lets UTF-8 encoded C1 controls (CSI U+009B) through
PKG=./internal/output
TARGET=FuzzSanitizeThenRenderNoRawEscape
RUN=^FuzzSanitizeThenRenderNoRawEscape$
MARKERS=SanitizeControl output still has a control rune
TIMEOUT=120
