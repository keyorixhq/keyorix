# FuzzJSONDecodeBoundedWork (server/http/handlers): the harness comment says its
# bound for webauthn.FinishWebAuthnLogin is the inner 64 KiB cap precisely so that
# removing decodeJSON's io.LimitReader trips it. Plant: that LimitReader removed.
# The seed corpus alone trips it: keyorix#4744 (closing #4740) added an in-process
# 3 MiB seed, bigNumberArray(3 << 20), whose uncapped decode allocates ~8.4 MB
# against a 4.2 MB limit (the 1 MiB seed stays under it), so no replay generator is
# needed any more.
# Does NOT verify: bodies between the 64 KiB inner cap and ~1.5 MiB (below the
# allocation limit even uncapped), any decode site other than
# webauthn.FinishWebAuthnLogin (the other cases bound on the 10 MiB router cap),
# or fuzzing-time discovery (this replays the seeds only).
FAMILY=bounded-work
DESC=JSON decode with its inner body cap removed
PKG=./server/http/handlers
TARGET=FuzzJSONDecodeBoundedWork
RUN=^FuzzJSONDecodeBoundedWork$
NEEDS=none
MARKERS=BOUNDED-WORK: webauthn.FinishWebAuthnLogin allocated
TIMEOUT=300
VERIFIED=2026-11-27 control PASS, planted DETECTED on the seed corpus alone (no REPLAY_GEN)
