# FuzzJSONDecodeBoundedWork (server/http/handlers): the harness comment says its
# bound for webauthn.FinishWebAuthnLogin is the inner 64 KiB cap precisely so that
# removing decodeJSON's io.LimitReader trips it. Plant: that LimitReader removed.
# The committed seeds (largest ~1 MiB) do NOT trip it (#4740): the limit is 4.2 MB
# and a 1 MiB decode stays under it. The replay generator adds one 6 MB body
# ("[1,1,...]"), under the 10 MiB router cap, which does. When #4740 is fixed by a
# committed large seed, drop REPLAY_GEN here.
FAMILY=bounded-work
DESC=JSON decode with its inner body cap removed
PKG=./server/http/handlers
TARGET=FuzzJSONDecodeBoundedWork
RUN=^FuzzJSONDecodeBoundedWork$
REPLAY_GEN=bounded-json-decode-inner-cap.replay.sh
NEEDS=none
MARKERS=BOUNDED-WORK: webauthn.FinishWebAuthnLogin allocated
TIMEOUT=300
VERIFIED=2026-11-26 control PASS, planted FAIL 0.5s with the generated body; seeds alone: blind (#4740)
