# FuzzHTTPRequestEchoCanary (SQLite world), request-echo class of keyorix#4702 /
# fuzz-corpus#186: internal/identity quoting the rejected name with %q puts caller
# input into the 400 body and the validation log line.
# Plant: invalidNameError quotes raw again.
# The SQLite harness was blind to this plant (#4739: no request shape reached a name
# that precis rejects). keyorix#4744 fixed it: request shape 12 plus the committed
# corpus seed escaped-nul-name-secret-create now reach it, so the seed corpus alone
# detects the plant and KNOWN_BLIND is gone. A DETECTED verdict is green; if the
# harness goes blind again the entry fails the run (PLANTED PASS).
# Does NOT verify: the Postgres harness (canary-echo-pg covers it), echo sites other
# than the identity name quoting, or fuzzing-time discovery (seeds are replayed only).
FAMILY=http-request-echo-canary
DESC=SQLite canary vs a rejected name echoed in the 400 (identity %q)
PKG=./server/http
TARGET=FuzzHTTPRequestEchoCanary
RUN=^FuzzHTTPRequestEchoCanary$
PATCH=echo-identity-quote.patch
NEEDS=none
MARKERS=CANARY LEAK
TIMEOUT=300
VERIFIED=2026-11-27 control PASS, planted DETECTED on the seed corpus
