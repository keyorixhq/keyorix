# FuzzHTTPRequestEchoCanary (SQLite world), request-echo class of keyorix#4702 /
# fuzz-corpus#186: internal/identity quoting the rejected name with %q puts caller
# input into the 400 body and the validation log line.
# Plant: invalidNameError quotes raw again.
# KNOWN-BLIND (#4739): no request shape of the SQLite harness reaches a name that
# precis rejects, so it stays green on the plant (seed corpus, the #186 reproducer
# and a sweep of all routes were tried). The PG variant below is the guard; this
# entry flips to BLIND-FIXED (fails the run) as soon as the SQLite harness sees it,
# which is the cue to delete KNOWN_BLIND.
FAMILY=http-request-echo-canary
DESC=SQLite canary vs a rejected name echoed in the 400 (identity %q)
PKG=./server/http
TARGET=FuzzHTTPRequestEchoCanary
RUN=^FuzzHTTPRequestEchoCanary$
PATCH=echo-identity-quote.patch
NEEDS=none
MARKERS=CANARY LEAK
KNOWN_BLIND=#4739
TIMEOUT=300
VERIFIED=2026-11-26 control PASS, planted PASS (blind) on the seed corpus
