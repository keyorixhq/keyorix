# FuzzDEKSweepCrashConsistency (internal/encryption): recovery after a sweep crash
# (ADR-010 Phase 3) must promote the pending DEK when the redo marker committed, so
# the rows re-encrypted under the new DEK are still readable after restart.
# Plant: in RecoverInterruptedRotation, call CleanPendingDEK() (delete the pending
# file) instead of PromotePendingDEK() (promote it to active). After a crash at
# sweep:after-sweep-commit the rows are under the NEW DEK, but recovery loads the
# OLD DEK (the pending file was removed), so every committed row fails to decrypt.
# Seed: f.Add(uint8(2), uint8(3), "rotate-passphrase", "secret-value-") is a
# committed seed — crashSel=2 selects sweep:after-sweep-commit; no REPLAY_GEN needed.
FAMILY=dek-sweep-crash-consistency
DESC=recovery discards the pending DEK instead of promoting it (DATA LOSS on sweep commit)
PKG=./internal/encryption
TARGET=FuzzDEKSweepCrashConsistency
RUN=^FuzzDEKSweepCrashConsistency$
NEEDS=none
MARKERS=DATA LOSS after sweep crash
TIMEOUT=180
VERIFIED=2026-11-27 pve01 clone, control PASS SQLite+PG, planted DETECTED 65s tree=b54b46e2a3d3
