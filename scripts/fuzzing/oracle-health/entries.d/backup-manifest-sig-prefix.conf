# FuzzManifestSignatureNeverAcceptsMismatch (internal/backupfmt): a manifest whose
# stored signature differs from the HMAC of its canonical bytes must never verify;
# the harness doc names "a prefix-only compare" as the bug it is built to see.
# Plant: VerifyManifestSignature compares only the first len(got) bytes of the stored
# signature. The committed seed with "00" appended to a valid signature trips it.
FAMILY=backupfmt-manifest-signature
DESC=manifest signature verified by prefix only (trailing bytes ignored)
PKG=./internal/backupfmt
TARGET=FuzzManifestSignatureNeverAcceptsMismatch
RUN=^FuzzManifestSignatureNeverAcceptsMismatch$
MARKERS=a mismatched signature must never verify
TIMEOUT=120
VERIFIED=2026-11-27 sandbox, control PASS, planted FAIL on the committed seeds
