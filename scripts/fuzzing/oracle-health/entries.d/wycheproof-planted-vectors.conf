# internal/wycheproof: the planted AEAD, Ed25519 and RSA defects. These run against
# the pinned Wycheproof vectors, which are git-ignored and absent from the runner's
# fresh tree, so the entry fetches them (network, checksum-verified by fetch.sh; a set
# WYCHEPROOF_DIR is used as a cache) and sets WYCHEPROOF_REQUIRE=1 so a missing file
# fails instead of skipping. HEAVY because it needs the network.
FAMILY=wycheproof
DESC=Wycheproof harness detects its planted AEAD/Ed25519/RSA defects (fetches vectors)
KIND=selftest
CMD=bash scripts/wycheproof/fetch.sh && WYCHEPROOF_REQUIRE=1 go test ./internal/wycheproof -run '^TestPlantedDefects(AEAD|Ed25519|RSA)$' -count=1 -timeout 240s -v
NEEDS=none
HEAVY=1
MARKERS=--- PASS: TestPlantedDefectsAEAD || --- PASS: TestPlantedDefectsEd25519 || --- PASS: TestPlantedDefectsRSA
TIMEOUT=600
