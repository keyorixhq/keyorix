# FuzzHTTPPGRequestEchoCanary: the PG variant of the request-echo canary, the one
# that found keyorix#4702 (fuzz-corpus#186 reproducer is a committed seed in
# server/http/testdata/fuzz/FuzzHTTPPGRequestEchoCanary). Same plant as
# canary-echo-sqlite. Needs a Postgres role that may SET session_replication_role
# (superuser or GRANT SET ON PARAMETER); the harness skips itself otherwise, which
# this runner reports as SKIP, never as a pass.
# NOT verified red in the authoring session: the sandbox kpg role lacks that
# privilege, so only the SKIP path was exercised. First nightly on pve01 is the proof.
FAMILY=http-request-echo-canary
DESC=PG canary vs a rejected name echoed in the 400 (identity %q)
PKG=./server/http
TARGET=FuzzHTTPPGRequestEchoCanary
RUN=^FuzzHTTPPGRequestEchoCanary$
PATCH=echo-identity-quote.patch
NEEDS=pg-superuser
MARKERS=CANARY LEAK
TIMEOUT=600
VERIFIED=no (control SKIPs on the sandbox kpg role)
