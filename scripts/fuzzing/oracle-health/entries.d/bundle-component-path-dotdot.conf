# FuzzComponentPathContainment (pkg/bundleverify): every component path
# cleanComponentPath accepts must stay inside the destination when joined under it.
# Plant: isUnsafeCleanComponentPath stops refusing a cleaned path that starts with
# "../" (a bare ".." is still refused), so "../escape" is accepted. The committed
# seeds "../escape", "../../etc/passwd" and "a/../../b" trip it.
FAMILY=bundleverify-path-containment
DESC=component path "../x" accepted (traversal out of the bundle destination)
PKG=./pkg/bundleverify
TARGET=FuzzComponentPathContainment
RUN=^FuzzComponentPathContainment$
MARKERS=PATH TRAVERSAL: cleanComponentPath accepted
TIMEOUT=120
VERIFIED=2026-11-27 sandbox, control PASS, planted FAIL on the committed seeds
