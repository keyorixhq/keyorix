# return goes back to `n >= stopAfter`, the pre-#182 rule. The planted run must then
# report a false oracle-6 finding for the stop that hits the unlock, which proves the
# control's greenness is the real rule at work and not an accident.
# Replay: source index 5 (v0.96.3, the latest) with stops 84..104; the migration is 92
# write statements, so stopAfter=93 is the unlock. If the migration grows or ugSources
# gains a release this entry reports MISSED: re-probe with the recipe in
# scripts/fuzzing/README.md and move the window in replay/pg-upgrade-unlock-stop.sh.
