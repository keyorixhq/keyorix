# FuzzUpgradePGInterrupted, oracles 6 and 7 (internal/storage/upgrade_pg_fuzz_test.go).
# Plant: an ALTER TABLE users ADD COLUMN planted_zz sent on the pool connection from
# inside the migration lock (outside the migration transaction), so it survives the
# rollback of an interrupted upgrade (6) and is absent from a fresh install (7).
# Replay: seed#2 = source v0.91.0, stop after write statement 8 (statement 1 is the
# advisory lock and 2 the planted ALTER itself, so stops 1 and 2 would end before the
# column exists: seed#0 only trips oracle 7).
FAMILY=storage-upgrade-pg
DESC=DDL outside the migration transaction survives an interrupted upgrade
PKG=./internal/storage
RUN=^FuzzUpgradePGInterrupted$/^seed#2$
NEEDS=pg
MARKERS=invariant 6: interrupted migration || invariant 7: schema differs from a fresh install || planted_zz
TIMEOUT=300
VERIFIED=2026-11-26 sandbox kpg, control PASS 1.0s, planted FAIL
