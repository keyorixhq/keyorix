# FuzzAuditChainMetamorphicTamper (internal/auditverify): after ONE structured
# mutation of a valid, checkpointed audit chain, Verify must not return VALID when the
# authenticated content changed. Plant: Verify stops comparing a row's recomputed
# entry hash with the stored one (the prev_hash link and the checkpoint head/count
# checks stay), so an in-place edit of a hashed column goes unseen. The harness
# reports it as "MISS: mutation changed authenticated content but verifier reported
# VALID" on its byte-flip / numeric-nudge / timestamp seeds.
FAMILY=auditverify-chain-tamper
DESC=Verify does not compare the recomputed entry_hash (in-place row edit stays VALID)
PKG=./internal/auditverify
TARGET=FuzzAuditChainMetamorphicTamper
RUN=^FuzzAuditChainMetamorphicTamper$
MARKERS=MISS: mutation changed authenticated content but verifier reported VALID
TIMEOUT=240
VERIFIED=2026-11-27 sandbox, control PASS, planted FAIL on the committed seeds
