# server/authzdiff: the existing planted-defect self-test (five authorization
# plants applied with `go test -overlay`, clean control run inside the test). Not
# re-implemented: this entry only runs it, which is what ci.yml's
# authzdiff-plants job does (nightly / ci:full). ~3 minutes, so HEAVY.
FAMILY=authz-differential
DESC=authzdiff's own five planted authorization defects
KIND=selftest
CMD=AUTHZDIFF_PLANTS=1 go test ./server/authzdiff/ -run '^TestPlantsAreDetected$' -count=1 -timeout 60m -v
NEEDS=none
HEAVY=1
MARKERS=--- PASS: TestPlantsAreDetected
TIMEOUT=3600
VERIFIED=no (heavy: not run in the authoring session; CI job authzdiff-plants is the record)
