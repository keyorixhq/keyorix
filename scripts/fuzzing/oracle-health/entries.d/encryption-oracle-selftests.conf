# internal/encryption: the at-rest and memory oracles must detect a planted DEK on
# disk, a planted KEK outside the allow path and a DEK that was not wiped, and stay
# quiet on a clean key lifecycle; the process-crash red-proof must see its planted
# defect. Planted inside the tests; oracle-level self-test, not a product-code plant.
FAMILY=encryption-oracles
DESC=encryption at-rest / memory canary oracles and crash red-proof
KIND=selftest
CMD=go test ./internal/encryption -run '^(TestAtRestOracle_|TestMemoryOracle_|TestProcessCrashRedProof$)' -count=1 -timeout 240s -v
NEEDS=none
MARKERS=--- PASS: TestAtRestOracle_DetectsPlantedDEKOnDisk
TIMEOUT=300
