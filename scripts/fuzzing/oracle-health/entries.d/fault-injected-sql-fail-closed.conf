# FuzzFaultInjectedOperations (internal/encryption): when the sql:create-version
# GORM seam faults, the new version row must NOT exist in the database afterwards
# (fail-closed: the fault must have prevented the write, not just reported failure).
# Plant (harness, not product): in armSQLFault, change the Before-hook for
# sql:create-version and sql:update-version to an After-hook. The After-hook fires
# AFTER the INSERT has committed, so the row IS in the database when the error is
# returned, and the FAIL-CLOSED oracle fires.
# Seed: allFaultInjectedSeedTriples() includes {opSel=0, seamSel=1, kindSel=0}
# (opCreate + sql:create-version), which is a committed f.Add seed; no REPLAY_GEN
# needed. The opUpdate+sql:update-version seed also fires (ATOMICITY), but FAIL-CLOSED
# VIOLATION from the create case is what makes this oracle uniquely load-bearing.
# Note: the GORM After-hook fires after a plain (non-transactional) w.db.Create call
# completes, so the row is committed even though the error is returned. Were the call
# inside an explicit db.Transaction, GORM would not roll back (the error was added
# post-commit); the harness's direct w.db.Create calls are not transactional, so this
# behaves identically in SQLite and Postgres.
FAMILY=fault-injected-operations
DESC=sql:create-version After-hook makes the version row persist despite the injected fault
PKG=./internal/encryption
TARGET=FuzzFaultInjectedOperations
RUN=^FuzzFaultInjectedOperations$
NEEDS=none
MARKERS=FAIL-CLOSED VIOLATION
TIMEOUT=180
VERIFIED=2026-11-27 pve01 clone, control PASS SQLite+PG, planted DETECTED 127s tree=b54b46e2a3d3
