# server/wirefuzz: the committed red-proofs of the wire-level oracles (smuggling
# count, canary, leak without credential / per request / per stream, response
# splitting, unbounded alloc, health probes) and the anti-vacuity checks that an
# authorized read is reachable. Each plants its defect inside the test (a leaky
# listener or gRPC server driven through the fuzzers' own drivers), so this is an
# oracle-level self-test, not a product-code plant. It runs in default CI too; the
# entry keeps the wirefuzz family visible in the registry.
FAMILY=wirefuzz
DESC=wirefuzz oracle red-proofs and anti-vacuity checks (planted inside the tests)
KIND=selftest
CMD=go test ./server/wirefuzz -run '^(TestRedProof_|TestAntiVacuity_)' -count=1 -timeout 240s -v
NEEDS=none
MARKERS=--- PASS: TestRedProof_EndToEnd_Leak
TIMEOUT=300
