# FuzzKeyCommitmentDeny (internal/encryption): a value sealed under K1 must not
# authenticate under K2 != K1, for the value AEAD and for the DEK wrap. The model
# red-proof is TestKeyCommitmentDeny_RedProof_PlantedKeylessAEAD, which plants a
# keyless sealer inside the test; this entry plants the same defect in the product:
# wrapKey/unwrapKey ignore the KEK and use a fixed all-zero key, so every wrapped DEK
# opens under every KEK. The three seeds trip it (any K1 != K2 does).
FAMILY=key-commitment
DESC=DEK wrap ignores its KEK (keyless AEAD in wrapKey/unwrapKey)
PKG=./internal/encryption
TARGET=FuzzKeyCommitmentDeny
RUN=^FuzzKeyCommitmentDeny$
MARKERS=KEY-COMMITMENT VIOLATION || DEK wrap (wrapKey/unwrapKey)
TIMEOUT=120
VERIFIED=2026-11-27 sandbox, control PASS, planted FAIL on the committed seeds
