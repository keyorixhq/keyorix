# FuzzAuditCompleteness (server/faultops), oracle 1: a successful catalog operation
# never leaves zero new audit rows. Plant: logProjectDeletedOn writes nothing.
# Why delete and not create: the same plant on logProjectCreatedOn is NOT seen,
# because the create operation is compound (it writes other audit rows), and the
# harness only asserts the lower bound "at least one" by design.
FAMILY=audit-completeness
DESC=a successful project delete that writes no audit row
PKG=./server/faultops
TARGET=FuzzAuditCompleteness
RUN=^FuzzAuditCompleteness$
NEEDS=none
MARKERS=AUDIT-COMPLETENESS VIOLATION || DeleteProject
TIMEOUT=300
VERIFIED=2026-11-26 control PASS 22s, planted FAIL 22s (REST and gRPC DeleteProject)
