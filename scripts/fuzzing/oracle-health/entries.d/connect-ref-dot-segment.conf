# FuzzConnectRefScopingGRPC (server/http): a ref containing a "." or ".." path
# segment must be denied on BOTH REST and gRPC, regardless of whether it would
# otherwise fall within the grant's prefix boundary.
# Plant: remove the ports.RefHasDotSegment guard from refMatches (internal/core/
# connect.go). Without it, "allowed/prefix/../etc" is passed to RefWithinPrefix,
# which returns true (the ref string has "allowed/prefix" as a prefix and the byte
# at len("allowed/prefix") is '/'), so the read is allowed despite the traversal.
# Seed: f.Add("allowed/prefix/../etc") is a committed seed; no REPLAY_GEN needed.
# Note: refMatches is shared by both transports (connectRefAllowed calls it for
# REST and gRPC alike), so OVER-GRANT/TRAVERSAL fires on both; the entry's oracle
# checks BOTH via the independent crsHasDotSegmentIndependent guard.
FAMILY=connect-ref-scoping-grpc
DESC=dot-segment traversal ref resolves through the RBAC grant (OVER-GRANT/TRAVERSAL)
PKG=./server/http
TARGET=FuzzConnectRefScopingGRPC
RUN=^FuzzConnectRefScopingGRPC$
NEEDS=none
MARKERS=OVER-GRANT/TRAVERSAL
TIMEOUT=180
