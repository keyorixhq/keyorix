# FuzzParseResponse (internal/saml): every ParseResponse failure must be the one fixed
# sanitized sentinel, so a caller cannot tell WHY a response was refused (error
# oracle). Plant: a failure of the library's own validation is returned as the
# library error instead of the sentinel (one line).
# The committed seeds do NOT trip it (keyorix#4750): every seed is refused by the
# epilogue check or strictAssertionShape before the library runs, and those return the
# sentinel. The replay generator adds one well-formed, unsigned, single-assertion
# response, which reaches the library, fails there and trips the oracle. When #4750
# is fixed by a committed seed, drop REPLAY_GEN here. The signature-bypass oracle of
# the same harness is not exercised by this plant.
FAMILY=saml-parse-response
DESC=ParseResponse returns the library's error text instead of the sanitized sentinel
PKG=./internal/saml
TARGET=FuzzParseResponse
RUN=^FuzzParseResponse$
REPLAY_GEN=saml-parse-error-oracle.replay.sh
MARKERS=ERROR-ORACLE LEAK
TIMEOUT=240
VERIFIED=2026-11-27 sandbox, control PASS, planted FAIL with the generated seed; committed seeds alone: blind (#4750)
