# FuzzStorageBackendDifferential (internal/storage/store): SQLite and Postgres run
# the same op sequence and must agree. The harness doc names "case/collation" as a
# class it hunts. Plant: GetProjectByName matches with `name LIKE ?` instead of the
# folded column; LIKE is case-insensitive on SQLite and case-sensitive on Postgres,
# the classic passes-on-SQLite divergence. The committed corpus has inputs that look
# up "Alpha"/"alpha" and trip it.
FAMILY=storage-backend-differential
DESC=SQLite/PG divergence in a project lookup (LIKE vs folded name)
PKG=./internal/storage/store
TARGET=FuzzStorageBackendDifferential
RUN=^FuzzStorageBackendDifferential$
NEEDS=pg
MARKERS=BACKEND DIVERGENCE
TIMEOUT=300
VERIFIED=2026-11-26 sandbox kpg, control PASS 1.8s, planted FAIL 3.6s
