# internal/verifierflip: the verdict-flip harness's own planted verifiers (a token
# check that ignores its last character, an AEAD that ignores the last tag byte, a
# bundle verifier that ignores a component digest, slow reject, timing skew) must be
# reported, and a correct verifier must be clean. Planted inside the tests (verifier
# stand-ins), so an oracle-level self-test, not a product-code plant.
FAMILY=verifier-flip
DESC=verifierflip planted verifiers detected, correct verifier clean
KIND=selftest
CMD=go test ./internal/verifierflip -run '^(TestSelfTest_|TestCanonContract_)' -count=1 -timeout 240s -v
NEEDS=none
MARKERS=--- PASS: TestSelfTest_PlantedDefectsAreDetected
TIMEOUT=300
