# internal/wycheproof: the Wycheproof runner must flag the planted AEAD, Ed25519,
# RSA and MAC-equality defects its own test builds. Oracle-level self-test (the
# defects are stand-in primitives inside the test), not a product-code plant.
FAMILY=wycheproof
DESC=Wycheproof harness detects its planted AEAD/Ed25519/RSA/MAC defects
KIND=selftest
CMD=go test ./internal/wycheproof -run '^TestPlantedDefect' -count=1 -timeout 240s -v
NEEDS=none
MARKERS=--- PASS: TestPlantedDefectsAEAD
TIMEOUT=300
