# internal/wycheproof: the runner must flag the planted MAC-equality defect its own
# test builds. Oracle-level self-test (the defect is a stand-in primitive inside the
# test), not a product-code plant. Only this test runs without vectors: the AEAD,
# Ed25519 and RSA plants need the git-ignored Wycheproof vectors and skip without
# them, so they are the HEAVY entry wycheproof-planted-vectors.
FAMILY=wycheproof
DESC=Wycheproof harness detects its planted MAC-equality defect
KIND=selftest
CMD=go test ./internal/wycheproof -run '^TestPlantedDefectMACEqualsOperator$' -count=1 -timeout 240s -v
NEEDS=none
MARKERS=--- PASS: TestPlantedDefectMACEqualsOperator
TIMEOUT=300
VERIFIED=2026-11-27 sandbox, self-test PASS with its marker, no SKIP in the log
