allowBuilds:
  esbuild: true

# form-data <4.0.6 has a CRLF-injection advisory (GHSA-hmw2-7cc7-3qxx); axios
# pulls a vulnerable range transitively.
overrides:
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  # undici <7.29.0: 6 CVEs (TLS bypass, SOCKS5 cross-origin routing, cache
  # whitespace bypass, Set-Cookie injection, SameSite downgrade, keep-alive
  # queue poisoning). react-router pulls the vulnerable range transitively.
  undici@>=5.0.0 <7.29.0: ^7.29.0
  # undici >=8.0.0 <8.12.2: Dependabot #37. jsdom (vitest's DOM, dev only) pulls it.
  undici@>=8.0.0 <8.12.2: ^8.12.2
  # brace-expansion <5.0.7: exponential-time DoS. react-router transitively.
  brace-expansion@>=5.0.0 <5.0.7: ^5.0.8
  # source-map-js <1.2.2: GHSA-68fv-2mgg-jv7q. Pulled by postcss (vite, tailwind).
  source-map-js@<1.2.2: 1.2.2
  # follow-redirects 1.16.0-1.16.1: GHSA-mrwp-f3q8-3g9p (cross-realm sensitiveHeaders
  # discarded, credentials can follow redirects). axios pulls it transitively.
  follow-redirects@>=1.16.0 <1.16.2: ^1.16.2
