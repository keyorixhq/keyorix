events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Security headers — REFERENCE ONLY, not effective on their own: nginx's
    # add_header does not inherit into a location block once that location sets
    # any add_header of its own, and every real location below does. This block
    # only documents the intended policy; the actual headers are repeated in
    # each location block below. If you add a new location, copy the header set
    # from an existing one — don't assume it inherits from here.
    #
    # Semgrep's generic.nginx.security.header-redefinition rule flags every
    # add_header below as "overwrites the server block" — true in isolation,
    # but the intent here IS to fully own each location's header set rather
    # than rely on inheritance that doesn't work the way the rule assumes.
    # Suppressed per-line below; this comment is the one place explaining why.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    # script-src is 'self' only: the Vite production bundle ships no inline scripts
    # and invokes no eval()/Function(), so 'unsafe-inline'/'unsafe-eval' are not needed.
    # style-src keeps 'unsafe-inline' for Tailwind/React inline styles. form-action,
    # base-uri, frame-ancestors do not inherit from default-src and must be explicit;
    # object-src 'none' blocks Flash/Java plugins. img-src omits the https: wildcard —
    # all images are same-origin or inline data URIs. This must stay in sync with
    # server/middleware/security_headers.go and
    # deploy/helm/keyorix/templates/web-config.yaml — the three serving modes
    # (embedded single-binary, this Docker+nginx image, Helm/K8s) must present the
    # same policy to the browser.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none';" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable"; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition

            # add_header does not inherit from the http block once a location
            # defines its own add_header, so the security headers above must be
            # repeated in every location that sets one (see nginx docs on
            # add_header inheritance).
            add_header X-Frame-Options "DENY" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header X-Content-Type-Options "nosniff" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header X-XSS-Protection "1; mode=block" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Referrer-Policy "no-referrer" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none';" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Cross-Origin-Resource-Policy "same-origin" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Cross-Origin-Embedder-Policy "require-corp" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Cross-Origin-Opener-Policy "same-origin" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            # Harmless on a plain-HTTP self-host (browsers only honor HSTS over an
            # actual HTTPS connection); takes effect once TLS is terminated here or
            # upstream of here.
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition

            try_files $uri =404;
        }

        # API proxy. /api/ is the authenticated API; /auth/ is the PUBLIC auth
        # endpoints (login, refresh, logout), which the backend serves at the ROOT
        # path — not under /api/. Without proxying /auth/, login falls through to
        # the SPA index and 404s. /system/ covers first-boot init.
        #
        # No CORS headers here: the SPA is served by this same nginx on the same
        # origin, so browser calls to these paths are same-origin and need none.
        # There is no other known caller of this API from a browser context —
        # don't add Access-Control-Allow-Origin/-Credentials back without a real,
        # named cross-origin consumer and a specific origin allowlist.
        #
        # No `internal;` directive: Semgrep's generic.nginx.security.missing-internal
        # rule wants that on any proxy_pass location, but this location is
        # deliberately reachable from the browser directly — it's how the SPA
        # (served by this same nginx) calls its own backend API. `internal;` would
        # make nginx 404 every /api/, /auth/, and /system/ request from the browser,
        # breaking the app entirely.
        location ~ ^/(api|auth|system)/ {
            # Resolve the backend lazily via Docker's embedded DNS (127.0.0.11) and
            # a variable, so nginx starts even if the backend isn't up yet (returns
            # 502 until it is) and picks up a new backend IP after a restart —
            # rather than failing to start or caching a stale address as a literal
            # upstream hostname would.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $keyorix_backend http://backend:8080;
            proxy_pass $keyorix_backend$request_uri; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Frame-Options "DENY" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header X-Content-Type-Options "nosniff" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header X-XSS-Protection "1; mode=block" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Referrer-Policy "no-referrer" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none';" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Cross-Origin-Resource-Policy "same-origin" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Cross-Origin-Embedder-Policy "require-corp" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Cross-Origin-Opener-Policy "same-origin" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            # Harmless on a plain-HTTP self-host (browsers only honor HSTS over an
            # actual HTTPS connection); takes effect once TLS is terminated here or
            # upstream of here.
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        }

        # SPA routing
        location / {
            try_files $uri $uri/ /index.html;

            # Security headers for HTML
            add_header X-Frame-Options "DENY" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header X-Content-Type-Options "nosniff" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header X-XSS-Protection "1; mode=block" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Referrer-Policy "no-referrer" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none';" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Cross-Origin-Resource-Policy "same-origin" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Cross-Origin-Embedder-Policy "require-corp" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Cross-Origin-Opener-Policy "same-origin" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            # Harmless on a plain-HTTP self-host (browsers only honor HSTS over an
            # actual HTTPS connection); takes effect once TLS is terminated here or
            # upstream of here.
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
