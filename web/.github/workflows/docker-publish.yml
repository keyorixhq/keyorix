# Builds the Keyorix web UI container image and publishes it to GHCR so the
# self-host docker-compose (in the keyorix repo) can pull a ready-made image.
name: docker-publish

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for cosign's keyless (OIDC) signing — no long-lived signing key
      # is stored as a secret; GitHub's OIDC token proves this exact workflow run
      # produced the image, and Sigstore's transparency log makes that provable
      # after the fact (mirrored from keyorix's docker-publish.yml).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance/sbom attestations below require the docker-container driver;
      # the runner's default `docker` driver doesn't support them and fails the
      # build with "Attestation is not supported for the docker driver."
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/keyorixhq/keyorix-web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          # BuildKit-native SBOM + provenance attestations, pushed to GHCR
          # alongside the image (mirrored from keyorix's docker-publish.yml).
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      # Signs the image DIGEST (not a mutable tag) keylessly: cosign requests a
      # short-lived certificate from Sigstore's Fulcio CA bound to this workflow's
      # OIDC identity, and records the signature in the public Rekor transparency
      # log — no signing key to provision, rotate, or leak.
      - name: Sign image (keyless)
        run: cosign sign --yes "ghcr.io/keyorixhq/keyorix-web@${{ steps.build.outputs.digest }}"
