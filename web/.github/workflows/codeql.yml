name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Full weekly scan independent of PRs (catches newly-published query improvements).
    - cron: '0 8 * * 1'

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          languages: javascript-typescript
          # security-and-quality includes all security queries plus code-quality
          # checks (dead code, error handling, etc.)
          queries: security-and-quality

      # For JS/TS, autobuild just discovers source files — no compile step.
      - uses: github/codeql-action/autobuild@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3

      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          category: /language:javascript-typescript
