---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: keyorixsecrets.secrets.keyorix.io
spec:
  group: secrets.keyorix.io
  names:
    kind: KeyorixSecret
    listKind: KeyorixSecretList
    plural: keyorixsecrets
    shortNames:
    - kxsecret
    singular: keyorixsecret
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.target.name
      name: Secret
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KeyorixSecret materialises selected Keyorix secrets into a native Kubernetes
          Secret and keeps it current as upstream values rotate.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KeyorixSecretSpec defines which Keyorix secrets to sync and
              where.
            properties:
              data:
                description: Data lists the Keyorix references to materialise into
                  the target Secret.
                items:
                  description: KeyorixSecretData maps one Keyorix secret reference
                    to a key in the target Secret.
                  properties:
                    ref:
                      description: Ref is the Keyorix "project/environment/name" reference
                        to read (ADR-059).
                      type: string
                    secretKey:
                      description: SecretKey is the key to set in the target Kubernetes
                        Secret.
                      type: string
                  required:
                  - ref
                  - secretKey
                  type: object
                minItems: 1
                type: array
              refreshInterval:
                description: RefreshInterval is how often to re-read values from Keyorix.
                  Defaults to 5m.
                type: string
              server:
                description: Server is the Keyorix base URL, e.g. https://keyorix.internal.
                pattern: ^https?://
                type: string
              target:
                description: Target is the Kubernetes Secret to create/maintain.
                properties:
                  name:
                    description: Name of the target Secret. Defaults to the KeyorixSecret's
                      own name.
                    type: string
                  type:
                    default: Opaque
                    description: Type of the target Secret. Defaults to Opaque.
                    type: string
                type: object
              tokenSecretRef:
                description: |-
                  TokenSecretRef sources the Keyorix machine-identity token (a least-privilege
                  identity with secrets.read on the referenced secrets). The token is never
                  inlined in the spec.
                properties:
                  key:
                    default: token
                    description: Key within the Secret's data. Defaults to "token".
                    type: string
                  name:
                    description: Name of the Secret.
                    type: string
                required:
                - name
                type: object
            required:
            - data
            - server
            - tokenSecretRef
            type: object
          status:
            description: KeyorixSecretStatus reports the last reconcile outcome.
            properties:
              conditions:
                description: Conditions holds the Ready condition (reason SyncError
                  when a sync fails).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncTime:
                description: LastSyncTime is when the target Secret was last successfully
                  written.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation last reconciled.
                format: int64
                type: integer
              syncedHash:
                description: |-
                  SyncedHash is a fingerprint of the last successfully-written data, so an
                  unchanged reconcile is a no-op.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
